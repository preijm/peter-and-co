// ── Theme Context ──────────────────────────────────────────
const ThemeContext = React.createContext();
const useTheme = () => React.useContext(ThemeContext);

function ThemeProvider({ children }) {
  const [editionsOpen, setEditionsOpen] = React.useState(false);
  const [themeIdx, setThemeIdx] = React.useState(() => {
    try {
      const urlTheme = new URLSearchParams(window.location.search).get('theme');
      if (urlTheme) {
        const idx = THEMES.findIndex(t => t.id === urlTheme);
        if (idx >= 0) return idx;
      }
      const saved = localStorage.getItem('pco-theme');
      const idx = THEMES.findIndex(t => t.id === saved);
      return idx >= 0 ? idx : 0;
    } catch { return 0; }
  });
  const theme = THEMES[themeIdx];

  const setThemeById = (id) => {
    const idx = THEMES.findIndex(t => t.id === id);
    if (idx >= 0) {
      setThemeIdx(idx);
      try { localStorage.setItem('pco-theme', id); } catch {}
    }
  };

  const pickRandom = () => {
    const others = THEMES.filter((_, i) => i !== themeIdx);
    const pool = others.length > 0 ? others : THEMES;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setThemeById(pick.id);
  };

  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--color-bg', theme.colors.bg);
    root.style.setProperty('--color-text', theme.colors.text);
    const link = document.getElementById('theme-fonts');
    if (link) link.href = theme.googleFonts;
    const favicon = document.querySelector("link[rel='icon']");
    if (favicon) favicon.href = `themes/${theme.id}/favicon.svg`;
  }, [theme]);

  return (
    <ThemeContext.Provider value={{ theme, themes: THEMES, themeIdx, setThemeById, pickRandom, editionsOpen, openEditions: () => setEditionsOpen(true), closeEditions: () => setEditionsOpen(false) }}>
      {children}
    </ThemeContext.Provider>
  );
}

  const { theme, openEditions } = useTheme();
  return (
    <button
      onClick={openEditions}
      style={{
        fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
        color: theme.colors.textDim, background: 'none', border: 'none', cursor: 'pointer',
        borderBottom: '1px solid transparent', paddingBottom: '2px', paddingTop: '0',
        transition: 'color 150ms ease',
      }}
      onMouseEnter={e => { e.currentTarget.style.color = theme.colors.text; e.currentTarget.style.borderBottomColor = theme.colors.textDim; }}
      onMouseLeave={e => { e.currentTarget.style.color = theme.colors.textDim; e.currentTarget.style.borderBottomColor = 'transparent'; }}

  );
}

  const MONO = "'JetBrains Mono','Space Mono',monospace";
  const dark = theme.id === 'ink-v1' || theme.id === 'volt-v1';

  const c = dark ? {
    overlay:      'rgba(0,0,0,0.88)',
    panel:        '#1e1e1e',
    panelBorder:  '#3a3a3a',
    label:        '#6b6b6b',
    cardName:     '#ffffff',
    cardActive:   '#ffffff',
    cardInactive: '#3a3a3a',
    cardHover:    '#6b6b6b',
    tagline:      '#6b6b6b',
    divider:      '#3a3a3a',
    randomColor:  '#a8a8a8',
    randomHover:  '#ffffff',
    closeColor:   '#6b6b6b',
    closeHover:   '#a8a8a8',
  } : {
    overlay:      'rgba(0,0,0,0.75)',
    panel:        '#ffffff',
    panelBorder:  '#0a0a0a',
    label:        '#8a8a8a',
    cardName:     '#0a0a0a',
    cardActive:   '#0a0a0a',
    cardInactive: '#e0e0e0',
    cardHover:    '#a0a0a0',
    tagline:      '#8a8a8a',
    divider:      '#e8e8e8',
    randomColor:  '#6b6b6b',
    randomHover:  '#0a0a0a',
    closeColor:   '#aaaaaa',
    closeHover:   '#6b6b6b',
  };

  React.useEffect(() => {
    const handler = e => { if (e.key === 'Escape') closeEditions(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  return (
    <div
      onClick={closeEditions}
      style={{ position:'fixed', inset:0, background:c.overlay, zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:'24px' }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background:c.panel, border:`2px solid ${c.panelBorder}`, maxWidth:'860px', width:'100%', padding:'36px' }}
      >
        <div style={{ fontFamily:MONO, fontSize:'10px', letterSpacing:'0.14em', color:c.label, marginBottom:'28px', textTransform:'uppercase' }}>
          choose edition
        </div>
        {mobile ? (
          <div style={{ marginBottom:'24px' }}>
            {themes.map((t, i) => {
              const isActive = t.id === theme.id;
              const mobileAvailable = t.mobileOptimized === true;
              return (
                <button
                  key={t.id}
                  onClick={mobileAvailable ? () => { setThemeById(t.id); closeEditions(); } : undefined}
                  disabled={!mobileAvailable}
                  style={{
                    width:'100%', background:'none', border:'none', borderBottom: i < themes.length - 1 ? `1px solid ${c.divider}` : 'none',
                    padding:'16px 0', textAlign:'left', cursor: mobileAvailable ? 'pointer' : 'default',
                    display:'flex', justifyContent:'space-between', alignItems:'center',
                    opacity: mobileAvailable ? 1 : 0.35,
                  }}
                >
                  <div>
                    <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'3px' }}>
                      <span style={{ fontFamily:MONO, fontSize:'16px', fontWeight:600, color:c.cardName, letterSpacing:'-0.01em' }}>{t.name}</span>
                      {isActive && <span style={{ fontFamily:MONO, fontSize:'9px', letterSpacing:'0.1em', color:c.tagline, textTransform:'uppercase' }}>current</span>}
                    </div>
                    <span style={{ fontFamily:MONO, fontSize:'10px', color:c.tagline, letterSpacing:'0.04em' }}>{t.tagline}</span>
                  </div>
                  <span style={{ fontFamily:MONO, fontSize:'10px', color: mobileAvailable ? c.randomColor : c.tagline, letterSpacing:'0.08em', flexShrink:0, marginLeft:'12px' }}>
                    {mobileAvailable ? (isActive ? '✓' : '→') : 'desktop'}
                  </span>
                </button>
              );
            })}

          </div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'16px', marginBottom:'28px', alignItems:'stretch' }}>
            {themes.map((t) => {
              const isActive = t.id === theme.id;
              return (
                <button
                  key={t.id}
                  onClick={() => { setThemeById(t.id); closeEditions(); }}
                  style={{
                    background:'none', border:`2px solid ${isActive ? c.cardActive : c.cardInactive}`,
                    cursor:'pointer', padding:'0', textAlign:'left', display:'flex', flexDirection:'column', width:'100%',
                  }}
                  onMouseEnter={e => { if (!isActive) e.currentTarget.style.borderColor = c.cardHover; }}
                  onMouseLeave={e => { if (!isActive) e.currentTarget.style.borderColor = c.cardInactive; }}
                >
                  <ThemeSwatch themeId={t.id} />
                  <div style={{ padding:'14px 16px' }}>
                    <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'4px' }}>
                      <span style={{ fontFamily:MONO, fontSize:'14px', fontWeight:600, color:c.cardName, letterSpacing:'-0.01em' }}>{t.name}</span>
                      {isActive && <span style={{ fontFamily:MONO, fontSize:'9px', letterSpacing:'0.1em', color:c.tagline, textTransform:'uppercase' }}>current</span>}
                    </div>
                    <div style={{ fontFamily:MONO, fontSize:'10px', color:c.tagline, letterSpacing:'0.04em', lineHeight:1.5, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{t.tagline}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
        <div style={{ paddingTop:'20px', display:'flex', justifyContent: mobile ? 'flex-end' : 'space-between', alignItems:'center' }}>
          {!mobile && (
            <button
              onClick={() => { pickRandom(); closeEditions(); }}
              style={{ fontFamily:MONO, fontSize:'11px', color:c.randomColor, background:'none', border:'none', cursor:'pointer', letterSpacing:'0.06em' }}
              onMouseEnter={e => e.currentTarget.style.color = c.randomHover}
              onMouseLeave={e => e.currentTarget.style.color = c.randomColor}
            >random edition →</button>
          )}
          <button
            onClick={closeEditions}
            style={{ fontFamily:MONO, fontSize:'10px', color:c.closeColor, background:'none', border:'none', cursor:'pointer', letterSpacing:'0.1em', textTransform:'uppercase' }}

            onMouseLeave={e => e.currentTarget.style.color = c.closeColor}
          >{mobile ? 'close' : 'esc to close'}</button>
        </div>

    </div>

}

function useMobile(breakpoint = 600) {
  const [mobile, setMobile] = React.useState(() => window.innerWidth < breakpoint);
  React.useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpoint}px)`);
    const handler = e => setMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [breakpoint]);
  return mobile;
}

// ── Tag ────────────────────────────────────────────────────
function Tag({ children, filled, muted }) {
  const { theme } = useTheme();
  const bg     = filled ? theme.colors.btnBg  : muted ? theme.colors.surface : 'transparent';
  const color  = filled ? theme.colors.btnText : muted ? theme.colors.textDim : theme.colors.textMuted;
  const border = filled ? `1px solid ${theme.colors.btnBg}` : `1px solid ${theme.colors.border}`;
  return (
    <span style={{
      fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',
      padding: '3px 8px', background: bg, color, border,
      borderRadius: '2px', display: 'inline-block',
    }}>{children}</span>
  );
}

// ── resolveAccent ──────────────────────────────────────────
const MONDRIAAN_PALETTE = new Set(['#d72027', '#1d4ed8', '#fcc60b', '#0a0a0a', '#ffffff']);
function resolveAccent(project, themeId) {
  const a = project.accent;
  if (!a) return null;
  const color = typeof a === 'string' ? a : (a[themeId] || a.default || null);
  if (!color) return null;
  if (themeId === 'mondriaan-v1' && !MONDRIAAN_PALETTE.has(color.toLowerCase())) return null;
  return color;
}

// ── LivePreview ────────────────────────────────────────────
function LivePreview({ href, themeId }) {
  const containerRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const [interactive, setInteractive] = React.useState(false);
  const [hovered, setHovered] = React.useState(false);
  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new ResizeObserver(([entry]) => {
      setScale(entry.contentRect.width / 1280);
    });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  React.useEffect(() => {
    if (!interactive) return;
    const handler = (e) => { if (e.key === 'Escape') setInteractive(false); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [interactive]);
  const url = `${href}?theme=${themeId}`;
  return (
    <div ref={containerRef} style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <iframe
        key={url}
        src={url}
        scrolling={interactive ? "yes" : "no"}
        style={{
          position: 'absolute', top: 0, left: 0,
          width: '1297px', height: '720px',
          border: 'none',
          pointerEvents: interactive ? 'auto' : 'none',
          transform: `scale(${scale})`, transformOrigin: 'top left',
        }}
      />
      {!interactive ? (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          onClick={() => setInteractive(true)}
          style={{
            position: 'absolute', inset: 0, cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: hovered ? 'rgba(0,0,0,0.12)' : 'transparent',
            transition: 'background 0.2s',
          }}
        >
          <span style={{
            background: 'rgba(0,0,0,0.72)', color: '#fff',
            padding: '7px 16px', borderRadius: '3px',
            fontFamily: 'monospace', fontSize: '11px', letterSpacing: '0.07em',
            opacity: hovered ? 1 : 0, transition: 'opacity 0.15s',
            pointerEvents: 'none', userSelect: 'none',
          }}>&#9654; INTERACT</span>
        </div>
      ) : (
        <button
          onClick={() => setInteractive(false)}
          style={{

// Tools the page shows as "what I use" — retired tools stay defined (and credited
// on their projects) but drop off the Tools page. Shared by Tools() and MTools().
const visibleToolCategories = () =>
  TOOL_CATEGORIES.map(c => ({ ...c, tools: c.tools.filter(t => t.status !== 'retired') }));

// ── Tools ──────────────────────────────────────────────────
function Tools() {
  const categories = visibleToolCategories();
  const mobile = useMobile();
  const { theme } = useTheme();
  const pad = mobile ? '48px 20px' : '80px 32px';
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: pad }}>
      <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '20px' }}>tools</div>
      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: mobile ? '32px' : '44px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: '16px' }}>
        How I work.
      </h1>
      <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: theme.colors.textDim, lineHeight: 1.8, maxWidth: '48ch', marginBottom: mobile ? '40px' : '64px' }}>
        No strong opinions on tools. Strong opinions on outcomes. These just happen to be what's in the stack right now.
      </p>
      {mobile ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1px', background: theme.colors.borderSubtle }}>
          {categories.map(cat => (
            <div key={cat.label} style={{ background: theme.colors.bg, padding: '20px 20px 4px' }}>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '16px' }}>{cat.label}</div>
              {cat.tools.map(t => (
                <div key={t.name} style={{ paddingBottom: '20px' }}>
                  <div style={{ fontFamily: theme.fonts.serif, fontSize: '20px', color: theme.colors.text, letterSpacing: '-0.01em', marginBottom: '4px' }}>{t.name}</div>
                  <div style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textFaint, lineHeight: 1.6 }}>{t.desc}</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', columnGap: '1px', rowGap: 0, background: theme.colors.borderSubtle }}>
          {categories.map(cat => (
            <div key={`h-${cat.label}`} style={{ background: theme.colors.bg, padding: '32px 28px 20px' }}>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint }}>{cat.label}</div>
            </div>
          ))}
          {Array.from({ length: Math.max(...categories.map(c => c.tools.length)) }, (_, rowIdx) =>
            categories.map(cat => {
              const t = cat.tools[rowIdx];
              const isLast = rowIdx === Math.max(...categories.map(c => c.tools.length)) - 1;
              return (
                <div key={`${cat.label}-${rowIdx}`} style={{ background: theme.colors.bg, padding: `0 28px ${isLast ? '32px' : '20px'}` }}>
                  {t && (
                    <>
                      <div style={{ fontFamily: theme.fonts.serif, fontSize: '20px', color: theme.colors.text, letterSpacing: '-0.01em', marginBottom: '4px' }}>{t.name}</div>
                      <div style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textFaint, lineHeight: 1.6 }}>{t.desc}</div>
                    </>
                  )}
                </div>
              );
            })
          )}
        </div>
      )}
    </section>
  );
}

// ── Contact ────────────────────────────────────────────────
function Contact() {
  const [sent, setSent] = React.useState(false);
  const [error, setError] = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const mobile = useMobile();
  const { theme } = useTheme();
  const inputStyle = {
    width: '100%', padding: '10px 12px', fontFamily: theme.fonts.mono,
    fontSize: '13px', color: theme.colors.text, background: theme.colors.bgInput,
    border: `1px solid ${theme.colors.border}`, borderRadius: '2px', outline: 'none',
    boxSizing: 'border-box',
  };
  return (
    <section style={{ maxWidth: '640px', margin: '0 auto', padding: mobile ? '48px 20px' : '80px 32px' }}>
      <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '20px' }}>contact</div>
      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: '44px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: '48px' }}>Say hello.</h1>
      {!sent ? (
        <form onSubmit={async e => {
          e.preventDefault();
          setSending(true);
          setError(false);
          try {
            const res = await fetch('https://formspree.io/f/xaqvlkzl', {
              method: 'POST',
              body: new FormData(e.target),
              headers: { Accept: 'application/json' },
            });
            if (res.ok) { setSent(true); }
            else { setError(true); }
          } catch { setError(true); }
          finally { setSending(false); }
        }} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
          {[
            { id: 'name',  label: 'name',  type: 'text',  placeholder: 'your name' },
            { id: 'email', label: 'email', type: 'email', placeholder: 'your@email.com' },
          ].map(f => (
            <div key={f.id}>
              <label htmlFor={f.id} style={{ display: 'block', fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: theme.colors.textFaint, marginBottom: '6px' }}>{f.label}</label>
              <input id={f.id} name={f.id} type={f.type} placeholder={f.placeholder} style={inputStyle}
                onFocus={e => e.target.style.borderColor = theme.colors.textDim}
                onBlur={e => e.target.style.borderColor = theme.colors.border} />
            </div>
          ))}
          <div>
            <label htmlFor="message" style={{ display: 'block', fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: theme.colors.textFaint, marginBottom: '6px' }}>message</label>
            <textarea id="message" name="message" rows={5} placeholder="what's on your mind?" style={{ ...inputStyle, resize: 'vertical' }}
              onFocus={e => e.target.style.borderColor = theme.colors.textDim}
              onBlur={e => e.target.style.borderColor = theme.colors.border} />
          </div>
          {error && (
            <p style={{ fontFamily: theme.fonts.mono, fontSize: '12px', color: '#c0392b', margin: 0 }}>Something went wrong. Try again or email me directly at peterreijm@live.nl.</p>
          )}
          <button type="submit" disabled={sending} style={{
            alignSelf: 'flex-start', fontFamily: theme.fonts.mono, fontSize: '12px',
            letterSpacing: '0.08em', color: theme.colors.btnText, background: theme.colors.btnBg,
            border: `1px solid ${theme.colors.btnBg}`, padding: '10px 28px', borderRadius: '2px', cursor: sending ? 'default' : 'pointer',
            opacity: sending ? 0.5 : 1,
          }}
          onMouseEnter={e => { if (!sending) e.currentTarget.style.opacity = '0.7'; }}
          onMouseLeave={e => { if (!sending) e.currentTarget.style.opacity = '1'; }}
          >{sending ? 'sending…' : 'send →'}</button>
        </form>
      ) : (
        <div style={{ borderTop: `1px solid ${theme.colors.border}`, paddingTop: '32px' }}>
          <p style={{ fontFamily: theme.fonts.serif, fontSize: '28px', color: theme.colors.text, marginBottom: '12px' }}>Got it.</p>
          <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: theme.colors.textDim, lineHeight: 1.7 }}>I'll be in touch. Usually within a day or two.</p>
        </div>
      )}
    </section>
  );
}

// ── Project Detail ─────────────────────────────────────────
function ProjectDetail({ project, onBack }) {
  const mobile = useMobile();
  const { theme } = useTheme();
  const accent = resolveAccent(project, theme.id) || theme.colors.text;
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: mobile ? '48px 20px' : '80px 32px' }}>
      <button onClick={onBack} style={{
        fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
        color: theme.colors.textFaint, background: 'none', border: 'none', cursor: 'pointer',
        padding: 0, marginBottom: '48px', display: 'block', transition: 'color 150ms ease',
      }}
      onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
      onMouseLeave={e => e.currentTarget.style.color = theme.colors.textFaint}
      >← back to work</button>

      <div style={{ display: 'flex', gap: '6px', marginBottom: '20px', flexWrap: 'wrap' }}>
        {project.tags.map(t => <Tag key={t} muted>{t}</Tag>)}
        <Tag filled>{project.year}</Tag>
      </div>

      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: mobile ? '36px' : '52px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.0, letterSpacing: '-0.02em', marginBottom: '12px' }}>
        {project.title}
      </h1>
      {project.tagline && (
        <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: accent, letterSpacing: '0.04em', marginBottom: '32px' }}>
          {project.tagline}
        </p>
      )}

function AppShell({ page, selectedProject, activePage, navigate, selectProject }) {
  const { theme, editionsOpen } = useTheme();
  const [readyThemes, setReadyThemes] = React.useState([]);
  const modal = editionsOpen ? <EditionModal /> : null;

  React.useEffect(() => {
    if (!theme.mondriaan || readyThemes.includes(theme.id)) return;
    const src = document.getElementById(theme.srcId).textContent;
    const compiled = Babel.transform(src, { presets: ['react'] }).code;
    const s = document.createElement('script');
    s.text = compiled;
    document.head.appendChild(s);
    setReadyThemes(ids => [...ids, theme.id]);
  }, [theme, readyThemes]);

  if (theme.mondriaan) {
    if (!readyThemes.includes(theme.id)) return <>{modal}<div style={{ minHeight: '100vh', background: theme.colors.bg }} /></>;
    const TakeoverApp = window[theme.appGlobal];
    return <>{modal}<TakeoverApp page={page} selectedProject={selectedProject} navigate={navigate} selectProject={selectProject} activePage={activePage} /></>;
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>{modal}
      <main style={{ flex: 1 }}>
        {page === 'home' && !selectedProject && (
          <>
            <Hero activePage={activePage} onNavigate={navigate} />
            <ProjectGrid featured onSelect={selectProject} onViewAll={() => navigate('work')} />
          </>
        )}
        {page === 'work' && !selectedProject && (
          <>
            <SiteHeader activePage={activePage} onNavigate={navigate} />
            <WorkPage onSelect={selectProject} />
          </>
        )}
        {(page === 'about' || page === 'tools' || page === 'contact' || page === 'project') && (
          <SiteHeader activePage={activePage} onNavigate={navigate} />
        )}
        {page === 'about'   && <About />}
        {page === 'tools'   && <Tools />}
        {page === 'contact' && <Contact />}
        {page === 'project' && selectedProject && <ProjectDetail project={selectedProject} onBack={() => navigate('work')} />}
      </main>
      <Footer />
    </div>
  );
}

// ── Live content (Sanity) ──────────────────────────────────
// Projects + tools are edited in the Sanity Studio (see studio/) and read here at
// load. The built-in PROJECTS / TOOL_CATEGORIES above are the fallback if Sanity
// is unreachable, so the site never breaks. See CONTENT.md.
const SANITY = { projectId: 'fas2xxna', dataset: 'production' };
const sanityUrl = (q) =>
  `https://${SANITY.projectId}.apicdn.sanity.io/v2024-01-01/data/query/${SANITY.dataset}?query=${encodeURIComponent(q)}`;
const Q_PROJECTS = `*[_type=="project"]|order(order asc){"id":slug.current,title,description,tagline,detail,tags,year,url,href,"screenshot":screenshot.asset->url,role,stack,tools,featured,isPublic,"accent":{"default":accentDefault,"mondriaan-v1":accentMondriaan}}`;
const Q_TOOLS = `*[_type=="tool"]|order(order asc){name,"desc":description,category,status}`;

function mapSanityProjects(docs) {
  return (docs || []).filter(d => d && d.title).map(d => {
    const p = {
      id: d.id || (d.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
      title: d.title, description: d.description, tagline: d.tagline, detail: d.detail,
      tags: d.tags || [], year: d.year, url: d.url, role: d.role,
      stack: d.stack || [], tools: d.tools || [], featured: !!d.featured,
      accent: { default: (d.accent && d.accent.default) || '#818cf8', 'mondriaan-v1': (d.accent && d.accent['mondriaan-v1']) || (d.accent && d.accent.default) || '#d72027' },
    };
    if (d.href) p.href = d.href;
    if (d.screenshot) p.screenshot = d.screenshot;
    if (d.isPublic === false) p.public = false;
    return p;
  });
}
function mapSanityTools(docs) {
  const order = ['build', 'infrastructure', 'daily'], byCat = {};
  (docs || []).filter(d => d && d.name).forEach(d => {
    const cat = (d.category || 'build');
    (byCat[cat] = byCat[cat] || []).push({ name: d.name, desc: d.desc, ...(d.status === 'retired' ? { status: 'retired' } : {}) });
  });
  const cats = order.filter(c => byCat[c]).map(c => ({ label: c, tools: byCat[c] }));
  Object.keys(byCat).forEach(c => { if (!order.includes(c)) cats.push({ label: c, tools: byCat[c] }); });
  return cats;
}
async function loadSanityContent() {
  try {
    const [pr, tr] = await Promise.all([
      fetch(sanityUrl(Q_PROJECTS)).then(r => r.json()),
      fetch(sanityUrl(Q_TOOLS)).then(r => r.json()),
    ]);
    let changed = false;
    const ps = mapSanityProjects(pr && pr.result);
    const ts = mapSanityTools(tr && tr.result);
    if (ps.length) { PROJECTS.splice(0, PROJECTS.length, ...ps); changed = true; }
    if (ts.length) { TOOL_CATEGORIES.splice(0, TOOL_CATEGORIES.length, ...ts); changed = true; }
    return changed;
  } catch (e) { return false; }
}

function App() {
  const [page, setPage] = React.useState('home');
  const [selectedProject, setSelectedProject] = React.useState(null);
  const [, setContentVersion] = React.useState(0);

  React.useEffect(() => {
    let alive = true;
    loadSanityContent().then(changed => { if (alive && changed) setContentVersion(v => v + 1); });
    return () => { alive = false; };
  }, []);

  const navigate = (p) => {
    setPage(p);
    setSelectedProject(null);
    window.scrollTo({ top: 0 });
  };

  const selectProject = (project) => {
    setSelectedProject(project);
    setPage('project');
    window.scrollTo({ top: 0 });
  };

  const activePage = selectedProject ? 'work' : page;

  React.useEffect(() => {
    const titles = { home: 'Peter & Co.', work: 'Work — Peter & Co.', tools: 'Tools — Peter & Co.', about: 'About — Peter & Co.', contact: 'Contact — Peter & Co.' };
    document.title = selectedProject ? `${selectedProject.title} — Peter & Co.` : (titles[page] || 'Peter & Co.');
  }, [page, selectedProject]);

  return (
    <ThemeProvider>
      <AppShell page={page} selectedProject={selectedProject} activePage={activePage} navigate={navigate} selectProject={selectProject} />
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

function MContact() {
  const mobile = useMobile();
  const [sent, setSent] = React.useState(false);
  const [error, setError] = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const inp = {
    width: '100%', padding: '14px 16px', fontFamily: M_SANS, fontWeight: 500,
    fontSize: '16px', color: M_BLACK, background: M_WHITE,
    border: `${M_LINE/2 + 1}px solid ${M_BLACK}`, outline: 'none', boxSizing: 'border-box',
  };
  return (
    <section style={{ width: '100%', maxWidth: '1280px', margin: '0 auto', padding: mobile ? '12px' : '24px' }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : 'minmax(0, 1.2fr) minmax(0, 1fr)', gridTemplateRows: '1fr', gap: 0, border: `${M_LINE}px solid ${M_BLACK}`, background: M_BLACK, minHeight: mobile ? 'auto' : '600px' }}>
        <div style={{ background: M_WHITE, padding: '40px', borderRight: `${M_LINE}px solid ${M_BLACK}` }}>
          <h1 style={{ fontFamily: M_DISPLAY, fontSize: 'clamp(56px, 8vw, 112px)', color: M_BLACK, lineHeight: 0.92, letterSpacing: '-0.035em', marginBottom: 36, textTransform: 'uppercase' }}>
            Say <span style={{ color: M_RED }}>hello.</span>
          </h1>
          {!sent ? (
            <form onSubmit={async e => {
              e.preventDefault();
              setSending(true);
              setError(false);
              try {
                const res = await fetch('https://formspree.io/f/xaqvlkzl', {
                  method: 'POST',
                  body: new FormData(e.target),
                  headers: { Accept: 'application/json' },
                });
                if (res.ok) { setSent(true); }
                else { setError(true); }
              } catch { setError(true); }
              finally { setSending(false); }
            }} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              {[{ id: 'name', label: 'Name', type: 'text', ph: 'your name' }, { id: 'email', label: 'Email', type: 'email', ph: 'your@email.com' }].map(f => (
                <div key={f.id}>
                  <label htmlFor={f.id} style={{ display: 'block', marginBottom: 8 }}><MLabel size="11px">{f.label}</MLabel></label>
                  <input id={f.id} name={f.id} type={f.type} placeholder={f.ph} style={inp}
                    onFocus={e => e.target.style.background = M_YELLOW}
                    onBlur={e => e.target.style.background = M_WHITE} />
                </div>
              ))}
              <div>
                <label htmlFor="message" style={{ display: 'block', marginBottom: 8 }}><MLabel size="11px">Message</MLabel></label>
                <textarea id="message" name="message" rows={5} placeholder="what's on your mind?" style={{ ...inp, resize: 'vertical' }}
                  onFocus={e => e.target.style.background = M_YELLOW}
                  onBlur={e => e.target.style.background = M_WHITE} />
              </div>
              {error && (
                <p style={{ fontFamily: M_SANS, fontSize: '13px', fontWeight: 500, color: M_RED, margin: 0 }}>Something went wrong. Try again or email me directly at peterreijm@live.nl.</p>
              )}
              <button type="submit" disabled={sending} style={{
                alignSelf: 'flex-start', fontFamily: M_SANS, fontWeight: 700, fontSize: '15px',
                letterSpacing: '0.08em', textTransform: 'uppercase',
                color: M_WHITE, background: M_RED,
                border: `${M_LINE/2 + 1}px solid ${M_BLACK}`,
                padding: '14px 32px', cursor: sending ? 'default' : 'pointer',
                opacity: sending ? 0.5 : 1,
                boxShadow: `6px 6px 0 0 ${M_BLACK}`, transition: 'transform 150ms ease',
              }}
              onMouseEnter={e => { if (!sending) e.currentTarget.style.transform = 'translate(-2px,-2px)'; }}
              onMouseLeave={e => { if (!sending) e.currentTarget.style.transform = 'none'; }}
              >{sending ? 'Sending…' : 'Send →'}</button>
            </form>
          ) : (
            <div>
              <p style={{ fontFamily: M_DISPLAY, fontSize: '52px', color: M_BLACK, letterSpacing: '-0.03em', textTransform: 'uppercase', lineHeight: 1.0 }}>Got it.</p>
              <p style={{ fontFamily: M_SANS, fontSize: '16px', fontWeight: 500, color: M_BLACK, marginTop: 16 }}>I'll be in touch. Usually within a day or two.</p>
            </div>
          )}
        </div>
        {!mobile && (
          <div style={{ display: 'grid', gridTemplateRows: '1fr 1fr 1fr', gap: 0 }}>
            {[
              { label: 'Response time', bg: M_RED,    fg: M_WHITE, text: 'Usually within\na day or two.' },
              { label: 'Open to',       bg: M_BLUE,   fg: M_WHITE, text: 'Side projects.\nInteresting ideas.\nNot for hire.' },
              { label: 'Location',      bg: M_YELLOW, fg: M_BLACK, text: 'Rotterdam,\nthe Netherlands.' },
            ].map((l, i, arr) => (
              <div key={l.label} style={{
                background: l.bg, padding: '28px 32px',

                display: 'flex', flexDirection: 'column', justifyContent: 'space-between',

                <MLabel color={l.fg}>{l.label}</MLabel>
                <div style={{ fontFamily: M_DISPLAY, fontSize: '26px', color: l.fg, letterSpacing: '-0.02em', lineHeight: 1.1, whiteSpace: 'pre-line' }}>{l.text}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

<script type="text/plain" id="volt-src">
// ─────────────────────────────────────────────────────────
// VOLT MODE — dark, minimal "design + code + systems" landing.
// Restrained and terminal-flavored; GSAP for subtle reveals only.
// ─────────────────────────────────────────────────────────
const V_BG    = '#0c0c0a';
const V_SUR   = '#14140f';
const V_LINEC = '#26261f';
const V_INK   = '#f2f0e6';
const V_MUTE  = '#8a877a';
const V_FAINT = '#7d7a6e';
const V_LIME  = '#d4f932';

const V_SANS = "'Geist', system-ui, 'Helvetica Neue', sans-serif";
const V_MONO = "'Geist Mono', 'Space Mono', ui-monospace, monospace";

// Layout — a true full-bleed shell. No centred max-width cap: sections run edge
// to edge with fluid gutters that scale with the viewport, so content uses the
// whole screen on large displays. Paragraphs keep their own max line-length, and
// the fixed chrome shares vPadX so it lines up with the content edge.
const vPadX = (mobile) => mobile ? '20px' : 'clamp(28px, 5vw, 120px)';
const vShell = (mobile, padY) => ({
  width: '100%', boxSizing: 'border-box',
  paddingTop: padY, paddingBottom: padY, paddingLeft: vPadX(mobile), paddingRight: vPadX(mobile),
});

const vReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

(function vInjectStyle() {
  if (document.getElementById('volt-style')) return;
  const st = document.createElement('style');
  st.id = 'volt-style';
  st.textContent = [
    '@keyframes v-blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }',
    '@keyframes v-peek-in { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }',
    '.volt-root ::selection { background: #d4f932; color: #0c0c0a; }',
    '.volt-root a, .volt-root button { -webkit-tap-highlight-color: transparent; }',
    '.v-caret { display: inline-block; width: 0.5em; height: 1.05em; background: #d4f932; margin-left: 5px; vertical-align: -0.16em; animation: v-blink 1.1s step-end infinite; }',
    '@media (prefers-reduced-motion: reduce) { .v-caret { animation: none; } }',
  ].join('\n');
  document.head.appendChild(st);
})();

// GSAP is loaded lazily, only when Volt activates
let vGsapPromise = null;
function vLoadGsap() {
  if (window.gsap && window.ScrollTrigger) return Promise.resolve();
  if (!vGsapPromise) {
    const load = src => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
    vGsapPromise = load('https://unpkg.com/gsap@3.12.5/dist/gsap.min.js')
      .then(() => load('https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js'))
      .then(() => window.gsap.registerPlugin(window.ScrollTrigger));
  }
  return vGsapPromise;
}
function useVoltGsap() {
  const [ready, setReady] = React.useState(() => !!(window.gsap && window.ScrollTrigger));
  React.useEffect(() => {
    if (ready) return;
    let alive = true;
    vLoadGsap().then(() => { if (alive) setReady(true); }).catch(() => {});
    return () => { alive = false; };
  }, []);
  return ready;
}

// Three.js (UMD global THREE) loaded lazily, only when Volt activates
let vThreePromise = null;
function vLoadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (!vThreePromise) {
    vThreePromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/three@0.149.0/build/three.min.js';
      s.onload = () => resolve(window.THREE);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  return vThreePromise;
}

function useRotterdamTime() {
  const fmt = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' });
  const [time, setTime] = React.useState(fmt);
  React.useEffect(() => {
    const id = setInterval(() => setTime(fmt()), 10000);
    return () => clearInterval(id);
  }, []);
  return time;
}

// Static, near-flat backdrop — one faint lime bloom. No canvas, no motion.
function VBackdrop() {
  return (
    <div aria-hidden="true" style={{
      position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none',
      background: 'radial-gradient(70vw 70vh at 84% 6%, rgba(212,249,50,0.055), transparent 55%), radial-gradient(60vw 60vh at 6% 102%, rgba(242,240,230,0.02), transparent 55%), ' + V_BG,
    }} />
  );
}

// Scroll-reactive Three.js point field — a faint depth layer behind the content.
// Camera travels + the field rotates with scroll progress; near-monochrome with a few lime motes.
function VParticles({ mobile }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (vReduced()) return;
    let stop = false, raf = 0, dispose = () => {};
    vLoadThree().then(THREE => {
      if (stop || !ref.current || !THREE) return;
      const el = ref.current;
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(el.clientWidth, el.clientHeight);
      el.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, el.clientWidth / el.clientHeight, 0.1, 120);
      camera.position.z = 24;

      const N = mobile ? 700 : 1700;
      const spread = 38, depth = 70;
      const positions = new Float32Array(N * 3);
      const colors = new Float32Array(N * 3);
      const cInk = new THREE.Color('#cbc8bb'), cLime = new THREE.Color('#d4f932');
      for (let i = 0; i < N; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * spread * 1.8;
        positions[i * 3 + 1] = (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = -Math.random() * depth;
        const c = Math.random() < 0.07 ? cLime : cInk;
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: mobile ? 0.07 : 0.055, vertexColors: true, transparent: true, opacity: 0.6,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);

      let targetScroll = window.scrollY || 0, curScroll = targetScroll, simT = 0, last = performance.now();
      // Pointer parallax — the field eases toward the cursor for an interactive depth.
      let ptrX = 0, ptrY = 0, curPX = 0, curPY = 0;
      const onScroll = () => { targetScroll = window.scrollY || 0; };
      const onPointer = (e) => {
        ptrX = (e.clientX / window.innerWidth) - 0.5;
        ptrY = (e.clientY / window.innerHeight) - 0.5;
      };
      const onResize = () => {
        camera.aspect = el.clientWidth / el.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(el.clientWidth, el.clientHeight);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('pointermove', onPointer, { passive: true });
      window.addEventListener('resize', onResize);

      const tick = (now) => {
        if (stop) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (document.visibilityState === 'visible') {
          simT += dt;
          curScroll += (targetScroll - curScroll) * 0.06;
          curPX += (ptrX - curPX) * 0.045;
          curPY += (ptrY - curPY) * 0.045;
          const docH = Math.max(1, document.body.scrollHeight - window.innerHeight);
          const prog = Math.min(1, curScroll / docH);
          points.rotation.y = simT * 0.02 + prog * 1.1 + curPX * 0.32;
          points.rotation.x = prog * 0.4 + curPY * 0.22;
          camera.position.z = 24 - prog * 15;
          camera.position.x = Math.sin(simT * 0.1) * 0.5 + curPX * 6;
          camera.position.y = -curPY * 4;
          camera.lookAt(0, 0, -20);
          mat.opacity = 0.5 + prog * 0.3;
          renderer.render(scene, camera);
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);

      dispose = () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('pointermove', onPointer);
        window.removeEventListener('resize', onResize);
        cancelAnimationFrame(raf);
        geo.dispose(); mat.dispose(); renderer.dispose();
        if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      };
    }).catch(() => {});
    return () => { stop = true; dispose(); };
  }, [mobile]);
  return <div ref={ref} aria-hidden="true" style={{ position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none' }} />;
}

// Interactive shell — a real command line in the hero. Type 'help' to explore.
function VTerminal({ projects, mobile }) {
  const { openEditions } = useTheme();
  const [history, setHistory] = React.useState([]);
  const [value, setValue] = React.useState('');
  const [stack, setStack] = React.useState([]); // command recall buffer
  const [si, setSi] = React.useState(-1);
  const inputRef = React.useRef(null);

  const run = (raw) => {
    const cmd = raw.trim();
    setValue('');
    if (!cmd) return;
    setStack(s => [...s, cmd]); setSi(-1);
    const [name, ...args] = cmd.split(/\s+/);
    const n = name.toLowerCase();
    let a = [];
    if (n === 'help') {
      a = ['available commands:',
           '  whoami       who is this',
           '  projects     list the work        (alias: ls)',
           '  open <n>     open project n in a new tab',
           '  background   the short story       (alias: about)',
           '  stack        what i build with',
           '  contact      how to reach me',
           '  editions     switch site edition   (alias: theme)',
           '  clear        clear the screen'];
    } else if (n === 'whoami') {
      a = ['peter reijm — product owner by day, builder the rest of the time.',
           'not a developer: i bring the ideas and the taste; AI handles the code.'];
    } else if (n === 'ls' || n === 'projects') {
      a = [projects.length + ' projects:'];
      projects.forEach((p, idx) => a.push('  ' + String(idx + 1).padStart(2, '0') + '  ' + p.title + ' — ' + (p.tagline || (p.tags || []).join(' · ')) + (p.href ? '  ↗' : '  (soon)')));
      a.push("→ type 'open <n>' to visit one");
    } else if (n === 'open') {
      const idx = parseInt(args[0], 10);
      const p = projects[idx - 1] || projects.find(x => x.id === (args[0] || '').toLowerCase());
      if (!p) a = ["no such project. try 'projects'"];
      else if (!p.href) a = [p.title + " isn't live yet — soon."];
      else { a = ['opening ' + p.title + ' → ' + p.href]; window.open(p.href, '_blank', 'noopener'); }
    } else if (n === 'about' || n === 'background') {
      a = ["i've wanted to build things forever — i just never wanted to learn to write the code.",
           'AI changed that. a personal lab of experiments, running on nights and weekends.'];
    } else if (n === 'stack') {
      a = ['build:  claude · lovable · stitch',
           'infra:  github · supabase · netlify · mapbox',
           'make:   a 3d printer, for turning files into things'];
    } else if (n === 'contact') {
      a = ['email     peterreijm@live.nl',
           'github    github.com/preijm',
           'linkedin  /in/peter-reijm'];
    } else if (n === 'editions' || n === 'theme') {
      a = ['opening editions…']; openEditions();
    } else if (n === 'clear') {
      setHistory([]); return;
    } else if (n === 'sudo') {
      a = ["nice try — you don't have root here :)"];
    } else {
      a = ['command not found: ' + name + " — try 'help'"];
    }
    setHistory(h => [...h.slice(-5), { q: cmd, a }]);
  };

  const onKey = (e) => {
    if (e.key === 'Enter') { run(value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!stack.length) return; const ni = si < 0 ? stack.length - 1 : Math.max(0, si - 1); setSi(ni); setValue(stack[ni]); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (si < 0) return; const ni = si + 1; if (ni >= stack.length) { setSi(-1); setValue(''); } else { setSi(ni); setValue(stack[ni]); } }
  };

  const mono = { fontFamily: V_MONO, fontSize: mobile ? '12px' : '13px', letterSpacing: '0.02em', lineHeight: 1.7 };
  const prompt = <span style={{ color: V_LIME }}>peter@rotterdam:~$</span>;
  return (
    <div className="v-fade" onClick={() => inputRef.current && inputRef.current.focus()} style={{ cursor: 'text', maxWidth: mobile ? '100%' : '720px' }}>
      <div style={{ ...mono, display: 'flex', alignItems: 'center', gap: '8px', color: V_FAINT }}>
        <span aria-hidden="true" style={{ width: '6px', height: '6px', borderRadius: '50%', background: V_LIME, display: 'inline-block' }} />
        available for good problems
      </div>
      {history.length > 0 && (
        <div style={{ ...mono, marginTop: '14px' }}>
          {history.map((h, i) => (
            <div key={i} style={{ marginBottom: '8px' }}>
              <div style={{ color: V_INK }}>{prompt} {h.q}</div>
              {h.a.map((line, j) => <div key={j} style={{ color: V_MUTE, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{line}</div>)}
            </div>
          ))}
        </div>
      )}
      <div style={{ ...mono, marginTop: history.length ? '6px' : '14px', display: 'flex', alignItems: 'center', color: V_INK }}>
        <span style={{ marginRight: '8px', flexShrink: 0 }}>{prompt}</span>
        <input
          ref={inputRef} value={value} onChange={e => setValue(e.target.value)} onKeyDown={onKey}
          spellCheck={false} autoComplete="off" autoCapitalize="off" aria-label="terminal command input"
          placeholder="try: help, projects, contact"
          style={{
            flex: 1, minWidth: 0, background: 'transparent', border: 'none', outline: 'none', padding: 0,
            color: V_INK, fontFamily: V_MONO, fontSize: mobile ? '12px' : '13px', letterSpacing: '0.02em', caretColor: V_LIME,
          }}
        />
      </div>
    </div>
  );
}

function VRow({ p, i, mobile, onPeek }) {

      </div>

      <div style={{ ...mono, display: 'flex', flexDirection: 'column', gap: '8px', paddingTop: topPad }}>
        {p.tags && p.tags.length > 0 && <span style={{ color: V_FAINT }}>{p.tags.slice(0, 3).join(' · ')}</span>}
        {p.role && <span style={{ color: V_MUTE }}>{p.role}</span>}
      </div>

      <span style={{ ...mono, color: live ? (hov ? V_LIME : V_MUTE) : V_FAINT, textAlign: mobile ? 'left' : 'right', paddingTop: topPad, transition: 'color 200ms ease' }}>
        {live ? p.year + ' ↗' : 'soon'}
      </span>
    </React.Fragment>
  );
  const style = {
    display: mobile ? 'flex' : 'grid', flexDirection: mobile ? 'column' : undefined,
    gridTemplateColumns: mobile ? undefined : '56px minmax(0,1fr) 240px 90px',
    alignItems: mobile ? 'flex-start' : 'start', gap: mobile ? '12px' : '40px',
    padding: mobile ? '28px 0' : 'clamp(30px, 3vw, 52px) 0', borderTop: '1px solid ' + V_LINEC,
    textDecoration: 'none', color: V_INK, cursor: live ? 'pointer' : 'default',
  };
  const peek = (e) => { if (!mobile && live && onPeek) { const r = e.currentTarget.getBoundingClientRect(); onPeek({ href: p.href, title: p.title, y: r.top + r.height / 2 }); } };
  const handlers = {
    className: 'v-row',
    onMouseEnter: (e) => { setHov(true); peek(e); },
    onMouseMove: peek,
    onMouseLeave: () => { setHov(false); if (onPeek) onPeek(null); },
  };
  return live
    ? <a href={p.href} target="_blank" rel="noopener noreferrer" {...handlers} style={style}>{inner}</a>
    : <div {...handlers} style={style}>{inner}</div>;
}

// Floating live-preview that appears beside a hovered project row (desktop only).
// Reuses the scaled-iframe LivePreview, framed like a small browser window.
function VRowPreview({ href, title, y }) {
  const PANEL_H = 312;
  const top = Math.max(96, Math.min((y || window.innerHeight / 2) - PANEL_H / 2, window.innerHeight - PANEL_H - 24));
  return (
    <div aria-hidden="true" style={{
      position: 'fixed', right: vPadX(false), top, width: 'clamp(320px, 30vw, 520px)', zIndex: 40,
      pointerEvents: 'none', transition: 'top 320ms cubic-bezier(0.2,0.7,0.2,1)',
    }}>
      <div style={{
        border: '1px solid ' + V_LINEC, background: V_SUR, borderRadius: '5px', overflow: 'hidden',
        boxShadow: '0 28px 70px rgba(0,0,0,0.55)', animation: vReduced() ? 'none' : 'v-peek-in 240ms ease both',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '9px 12px', borderBottom: '1px solid ' + V_LINEC, fontFamily: V_MONO, fontSize: '11px' }}>
          <span aria-hidden="true" style={{ width: '7px', height: '7px', borderRadius: '50%', background: V_LIME, display: 'inline-block', flexShrink: 0 }} />
          <span style={{ color: V_MUTE, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{href.replace(/^https?:\/\//, '').replace(/\/$/, '')}</span>
        </div>
        <div style={{ position: 'relative', width: '100%', aspectRatio: '16 / 10', overflow: 'hidden', background: V_BG }}>
          <LivePreview href={href} themeId="volt-v1" />
        </div>
      </div>
    </div>
  );
}

function VoltApp(props) {
  const gsapReady = useVoltGsap();
  const mobile = useMobile();
  const rootRef = React.useRef(null);
  const projects = PROJECTS.filter(p => p.public !== false);

  const onTop = () => window.scrollTo({ top: 0, behavior: vReduced() ? 'auto' : 'smooth' });

  React.useEffect(() => {
    if (!gsapReady || vReduced()) return;
    const gsap = window.gsap;
    const ctx = gsap.context(() => {
      gsap.from('.v-fade', { y: 16, opacity: 0, duration: 0.8, ease: 'power2.out', stagger: 0.09, delay: 0.12 });
      gsap.utils.toArray('.v-reveal').forEach(el => {
        gsap.from(el, { y: 22, opacity: 0, duration: 0.8, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 90%' } });
      });
      gsap.from('.v-row', { y: 16, opacity: 0, duration: 0.6, ease: 'power2.out', stagger: 0.05, scrollTrigger: { trigger: '#v-work', start: 'top 80%' } });
    }, rootRef);
    return () => ctx.revert();
  }, [gsapReady]);

  return (
    <div ref={rootRef} className="volt-root" style={{ background: 'transparent', color: V_INK, minHeight: '100vh', fontFamily: V_SANS, overflowX: 'clip' }}>
      <VBackdrop />
      <VParticles mobile={mobile} />
      <VFloatingChrome onTop={onTop} />
      <VHero mobile={mobile} projects={projects} />
      <VWork projects={projects} mobile={mobile} />
      <VBackground mobile={mobile} />
      <VContact mobile={mobile} />
    </div>
  );
}
