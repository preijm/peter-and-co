<!-- Counterscale. Gated three ways.
     1. The live hostname: without it a local `npx serve`, a file:// open of this page, or
        any preview deploy writes into the production dataset. That is where the `/C:/`
        paths and `localhost:3000` referrers in the dashboard came from.
     2. The webdriver flag, for browser automation that announces itself.
     3. An opt-out remembered per browser. Visiting my own site to check a change is the
        biggest remaining distortion in the numbers, so `?notrack=1` once per browser
        stops counting me. `?notrack=0` turns it back on when I need to prove the tracker
        still works.

     peterreijm.nl is the old domain. It 301s to here at the Cloudflare edge, so no page
     ever loads on it and no tracker can run there. The redirect target carries
     `?ref=peterreijm.nl` instead. Counterscale's tracker falls back to a `ref` query
     parameter when `document.referrer` is empty, so a visit typed straight into the
     address bar as the old domain lands in the Referrers table under `peterreijm.nl`
     rather than under Direct. Same site id, so the totals stay whole. A visit that
     reached the old domain from somewhere else keeps that real referrer, because a 301
     passes it through, and that is the more useful attribution anyway. -->
<script>
(function () {
  var KEY = 'pco-notrack', excluded = false, note = '';

  // The switch lives in the tracking dashboard, which links here with the
  // parameter set. The flag still has to be written on this origin --
  // localStorage is origin-scoped, so nothing running on localhost can set it
  // for peterandco.nl.
  try {
    var v = new URLSearchParams(location.search).get('notrack');
    if (v === '1') { localStorage.setItem(KEY, '1'); note = 'This browser is no longer counted.'; }
    if (v === '0') { localStorage.removeItem(KEY); note = 'This browser is counted again.'; }
    excluded = !!localStorage.getItem(KEY);
  } catch (e) {} // private mode: count the visit rather than lose it

  // Confirmation for an explicit ?notrack=1/0 arrival only, so the action is
  // something I can trust rather than take on faith. A visitor never carries the
  // parameter and so never sees this. Fades itself out; never blocks a click.
  if (note) {
    var toast = function () {
      var el = document.createElement('div');
      el.setAttribute('role', 'status');
      el.textContent = note;
      el.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:2147483647;' +
        'font:500 13px/1 ui-sans-serif,system-ui,sans-serif;padding:11px 16px;' +
        'border-radius:999px;background:#0a0a0a;color:#fff;' +
        'border:1px solid rgba(255,255,255,.25);pointer-events:none;' +
        'opacity:1;transition:opacity .6s';
      document.body.appendChild(el);
      setTimeout(function () { el.style.opacity = '0'; }, 3600);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4400);
    };
    if (document.body) toast();
    else document.addEventListener('DOMContentLoaded', toast);
  }

  if (excluded) return;
  if (!/(^|\.)peterandco\.nl$/.test(location.hostname) || navigator.webdriver) return;

  var csScript = document.createElement('script');
  csScript.id = 'counterscale-script';
  csScript.src = 'https://counterscale.peterreijm.workers.dev/tracker.js';
  csScript.setAttribute('data-site-id', 'peterandco.nl');
  csScript.defer = true;
  document.head.appendChild(csScript);
})();
</script>

<!-- Theme fonts, resolved during parse. The edition is chosen client-side (?theme= /
     localStorage), so waiting for React + Babel to boot before requesting the face means
     the largest type on the page paints in a system fallback and then reflows. This map
     MUST stay in sync with the `googleFonts` values on the THEMES array below. An
     unknown or absent id falls back to DEFAULT_ID so there is always a face. -->
<script>
(function () {
  var FONTS = {
    'ink-v1':       'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap',
    'broadside-v1': 'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap',
    'mondriaan-v1': 'https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap',
    'volt-v1':      'https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap',
    'grain-v1':    'https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap',
    'prism-v1':    'https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap'
  };
  // Must match DEFAULT_THEME_ID in the app below. A first-time visitor has no saved
  // edition, so this is the face the page actually opens with.
  var DEFAULT_ID = 'volt-v1';
  var id = null;
  try { id = new URLSearchParams(location.search).get('theme') || localStorage.getItem('pco-theme'); } catch (e) {}
  // What will actually render. A first-time visitor has no explicit choice, so id is
  // null for them, and everything below has to reason about the resolved edition
  // rather than the requested one.
  var active = FONTS[id] ? id : DEFAULT_ID;
  var l = document.createElement('link');
  l.id = 'theme-fonts'; l.rel = 'preload'; l.as = 'style';
  l.href = FONTS[active];
  l.onload = function () { this.onload = null; this.rel = 'stylesheet'; };
  document.head.appendChild(l);
  // Grain's hero photograph is the LCP element and sits four sequential hops deep:
  // HTML → app.js → React mount → fetch(footage/manifest.json) → render. Starting it
  // during parse skips all four. The filename is stamped by build.js from the
  // manifest, so this can never preload a file that does not ship; an empty value
  // (no hero in footage/) means the plane falls back to its generated field.
  var HERO = 'hero.webp'; /* build:hero */
  if (active === 'grain-v1' && HERO) {
    var p = document.createElement('link');
    p.rel = 'preload'; p.as = 'image'; p.href = 'footage/' + HERO;
    p.setAttribute('fetchpriority', 'high');
    document.head.appendChild(p);
  }
})();
</script>

     inside the plane's turbulence filter, so the straight edge is displaced
     into a wandering one on its way across — the same hand that wobbles every
     plane's edges. Drawing the raggedness here as polygon points instead put
     notches at an even pitch, which reads as tape off a serrated cutter. */
  @keyframes m-paint-r { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 -4% 0 0) } }
  @keyframes m-paint-l { from { clip-path: inset(0 0 0 100%) } to { clip-path: inset(0 0 0 -4%) } }
  @keyframes m-paint-d { from { clip-path: inset(0 0 100% 0) } to { clip-path: inset(-4% 0 0 0) } }
  @keyframes m-paint-u { from { clip-path: inset(100% 0 0 0) } to { clip-path: inset(0 0 -4% 0) } }
  /* The paint-in is the largest motion on the site: seventeen planes sweeping
     across the home page. Every other edition gates its motion behind this and
     Mondriaan did not, so a visitor who asked for less motion got the most of

// The edition a first-time visitor lands on. Volt leads, and the reason is not that
// it is the best looking - Grain probably is. It is that Volt is composed, and Grain
// follows their visual language closely. A portfolio whose own intertitle says

// onEditionChange fires when the reader actually moves to a different edition,
// and App uses it to send them to that edition's home. Picking the edition you
// are already on does not fire it: that closes the modal and nothing else.
function ThemeProvider({ children, onEditionChange }) {
  const [editionsOpen, setEditionsOpen] = React.useState(false);
  const [themeIdx, setThemeIdx] = React.useState(() => {
    try {
      const urlTheme = new URLSearchParams(window.location.search).get('theme');
      if (urlTheme) {
        const idx = THEMES.findIndex(t => t.id === urlTheme);
        if (idx >= 0) return idx;
      }
      const saved = localStorage.getItem('pco-theme');
      const idx = THEMES.findIndex(t => t.id === saved);
      if (idx >= 0) return idx;
      const fallback = THEMES.findIndex(t => t.id === DEFAULT_THEME_ID);
      return fallback >= 0 ? fallback : 0;
    } catch {
      const fallback = THEMES.findIndex(t => t.id === DEFAULT_THEME_ID);
      return fallback >= 0 ? fallback : 0;
    }
  });
  const theme = THEMES[themeIdx];

  const setThemeById = (id) => {
    const idx = THEMES.findIndex(t => t.id === id);
    if (idx >= 0) {
      const moved = idx !== themeIdx;
      setThemeIdx(idx);
      try { localStorage.setItem('pco-theme', id); } catch {}
      if (moved && onEditionChange) onEditionChange();
    }
  };

  const pickRandom = () => {
    const others = THEMES.filter((_, i) => i !== themeIdx);
    const pool = others.length > 0 ? others : THEMES;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setThemeById(pick.id);
  };

  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--color-bg', theme.colors.bg);
    root.style.setProperty('--color-text', theme.colors.text);
    // Editions keep their stylesheet once it has been fetched. Swapping a single
    // link's href meant every switch re-requested the faces and the whole page —
    // the Editions modal included, which is what you are looking at when you
    // switch — rendered in a fallback until they landed, then swapped. Worse, it
    // refetched even when going back to an edition already seen. Appending makes
    // a revisit instant; the cost is a few KB of CSS left open per edition
    // visited, and a face nothing references costs nothing to have declared.
    const head = document.getElementById('theme-fonts');
    const links = [head, ...document.querySelectorAll('link[data-pco-font]')].filter(Boolean);
    if (!links.some(l => l.href === theme.googleFonts)) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = theme.googleFonts;
      l.setAttribute('data-pco-font', theme.id);
      document.head.appendChild(l);
    }
    const favicon = document.querySelector("link[rel='icon']");
    if (favicon) favicon.href = `themes/${theme.id}/favicon.svg`;
  }, [theme]);

  return (
    <ThemeContext.Provider value={{ theme, themes: THEMES, themeIdx, setThemeById, pickRandom, editionsOpen, openEditions: () => setEditionsOpen(true), closeEditions: () => setEditionsOpen(false) }}>
      {children}
    </ThemeContext.Provider>
  );
}

// ── ThemeDropdown ──────────────────────────────────────────
function ThemeDropdown() {
  const { theme, openEditions } = useTheme();
  const mobile = useMobile();
  const rule = React.useRef(null);
  return (
    <button
      onClick={openEditions}
      style={{
        fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
        color: theme.colors.textDim, background: 'none', border: 'none', cursor: 'pointer',
        padding: 0, transition: 'color 150ms ease', ...tapArea(mobile),
      }}
      onMouseEnter={e => { e.currentTarget.style.color = theme.colors.text; if (rule.current) rule.current.style.borderBottomColor = theme.colors.textDim; }}
      onMouseLeave={e => { e.currentTarget.style.color = theme.colors.textDim; if (rule.current) rule.current.style.borderBottomColor = 'transparent'; }}
    >
      {/* The rule underlines the word, so it lives on the word. Left on the button it
          would sit at the bottom of the tap target, 15px adrift of the text on mobile. */}
      <span ref={rule} style={{ borderBottom: '1px solid transparent', paddingBottom: '2px' }}>edition</span>
    </button>
  );
}

// ── ThemeSwatch ────────────────────────────────────────────

      <div style={{ position:'absolute', top:'18%', left:'10%', width:'58%', height:'13%', background:'#ffffff' }} />
      <div style={{ position:'absolute', top:'36%', left:'10%', width:'72%', height:'13%', background:'#ffffff' }} />

      <div style={{ position:'absolute', bottom:'10%', left:'10%', width:'28%', height:'7%', background:'#2a2a2a' }} />

  if (themeId === 'broadside-v1') return (
    <div style={{ width:'100%', aspectRatio:'16/9', background:'#f2f0eb', position:'relative', overflow:'hidden' }}>
      {/* One statement across the full measure, a quieter second line, then the heavy
          rule and the listings — the shape of the edition rather than a colour sample. */}
      <div style={{ position:'absolute', top:'10%', left:'8%', right:'8%', height:'1px', background:'#0a0a0a' }} />

    <div style={{ width:'100%', aspectRatio:'16/9', background:'#0c0c0a', position:'relative', overflow:'hidden' }}>

      <div style={{ position:'absolute', top:'74%', left:'8%', right:'8%', height:'1px', background:'#2a2a22' }} />
      <div style={{ position:'absolute', top:'86%', left:'8%', right:'8%', height:'1px', background:'#2a2a22' }} />
      <div style={{ position:'absolute', top:'79%', left:'8%', width:'4%', height:'4%', background:'#d4f932' }} />
    </div>
  );
  if (themeId === 'grain-v1') return (
    <div style={{ width:'100%', aspectRatio:'16/9', background:'#141109', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(70% 90% at 22% 14%, rgba(194,181,174,0.42), rgba(20,17,9,0) 70%)' }} />
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(60% 70% at 82% 78%, rgba(220,220,220,0.22), rgba(20,17,9,0) 70%)' }} />
      <div style={{ position:'absolute', top:'14%', left:'8%', width:'46%', height:'6%', background:'#fafafa' }} />

      <div style={{ position:'absolute', top:'36%', left:'8%', width:'30%', height:'6%', background:'#fafafa' }} />

      <div style={{ position:'absolute', top:'18%', right:'8%', width:'14%', height:'2px', background:'#fafafa' }} />
      <div style={{ position:'absolute', bottom:'12%', left:'8%', width:'26%', height:'14%', border:'1px solid #fafafa', borderRadius:'300px' }} />
    </div>
  );
  if (themeId === 'prism-v1') return (
    <div style={{ width:'100%', aspectRatio:'16/9', background:'#fbfbfd', position:'relative', overflow:'hidden' }}>
      {/* Radial gradients, not blurred circles: a swatch this small never animates, and
          three filter: blur() layers per row is real cost in a six-row grid. */}

  );
}

// ── EditionModal ───────────────────────────────────────────
function EditionModal() {
  const { theme, themes, themeIdx, setThemeById, pickRandom, closeEditions } = useTheme();
  const mobile = useMobile();
  // The modal speaks whatever face the active edition actually ships. Hardcoding
  // JetBrains Mono meant any edition that does not load it — Grain, which loads only
  // Inter, and Prism, which loads no monospace at all — rendered here in the generic
  // system monospace with a synthesised weight. Reading theme.fonts.mono fixes both
  // and every edition added later.
  const MONO = theme.fonts.mono;
  // The panel label and the two controls under the grid. These used to take the
  // display face, for contrast against the mono captions beside them. It reads as
  // the wrong font rather than as contrast: every edition sets its 10-11px tracked
  // micro-labels in mono — Ink's FEATURED WORK, Broadside's BSLabel, Volt's
  // VLabel, even Mondriaan's MLabel, which uses Space Mono and not the Archivo
  // Black the edition is named for. A display face at 11px is a display face used
  // at caption size, so the modal announced itself as foreign to the edition it
  // was sitting on. The theme names still take the display face — that is
  // NAME_FONT below, and Mondriaan still gets Archivo Black for them.
  const LABEL_FONT = MONO;
  // Grain is the one edition that forbids weights above 400; a synthesised 600 is
  // exactly the heavy face it exists to avoid.
  const NAME_WEIGHT = theme.id === 'grain-v1' ? 400 : 600;
  // The modal's chrome is derived from the active edition's own tokens. It used to be
  // two frozen palettes — Ink's chrome and Ink's chrome inverted — picked by testing
  // theme.id against a list of two. That had every light edition landing in the same
  // hard white box whatever it looked like, and it defaulted a new edition to the
  // light set silently, the same trap ThemeSwatch had with its Mondriaan fallback.
  //
  // Light or dark is measured off the panel colour rather than declared, so an
  // edition added later cannot be wrong about itself.
  const t = theme.colors;
  const pzLum = (hex) => {
    const ch = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255)
      .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  };
  const rgba = (hex, alpha) => {
    const n = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
    return 'rgba(' + n[0] + ',' + n[1] + ',' + n[2] + ',' + alpha + ')';
  };
  const panel = t.surface;
  const panelDark = pzLum(panel) < 0.35;
  // A quiet edge on the panel: on a dark surface that is border, on a light one
  // borderSubtle. Mondriaan's borderSubtle is hard black, so it keeps its rule.
  // This used to read textGhost on the dark side, back when that token happened to sit
  // at hairline darkness. It is a text colour, and once it was lifted to clear AA it
  // started drawing a bright grey outline around the panel, every card and every
  // divider. A rule wants the rule token.
  const edge = panelDark ? t.border : t.borderSubtle;
  // Labels read textMuted, not textDim. Ink's textDim has since been lifted clear of
  // AA, but Broadside's still measures 4.04, and the old hardcoded #6b6b6b was worse
  // still. textMuted puts the worst case across all six at 7.01.
  const c = {
    overlay:      rgba(panelDark ? t.bg : t.text, panelDark ? 0.9 : 0.6),
    panel:        panel,
    panelBorder:  edge,
    label:        t.textMuted,
    cardName:     t.text,
    cardActive:   t.btnBg,
    cardInactive: edge,
    // On a bordered grid the card frame sits on the panel, where textDim reads.
    // On a painted one it sits in black gutters, where Mondriaan's textDim
    // (#3a3a3a) all but disappears — the hover was there and invisible. An
    // edition that paints its grid declares its primaries, so hover takes the
    // yellow: unmissable against the ground, and unmistakably not the red that
    // marks the current edition.
    cardHover:    t.textDim,
    // One colour, and it is yellow. The ring is drawn in the gutter, which is
    // this edition's black, and that is the whole argument: yellow measures 11.8
    // against it, blue 2.8. A dark blue on a near-black gutter is a ring you have
    // to look for, so half the grid highlighted well and half barely highlighted
    // at all. White fails differently — it reads against the gutter, but the card
    // it borders is the panel colour, near enough to white that the ring merged
    // into it and looked like the card bleeding outward rather than a frame.
    //
    // That leaves yellow. Red is spoken for, marking the current edition, and
    // black is the gutter itself. So the rotation this used to do was never a
    // choice between four primaries — it was yellow plus two colours that did not
    // work, dressed up as variety.
    //
    // It was also striped rather than varied: the cycle ran three long and the
    // grid is three wide, so the period matched the column count exactly and
    // every column came out one colour — Ink over Volt both yellow, Broadside
    // over Grain both blue.
    cardHoverPainted: t.yellow || t.textGhost,
    tagline:      t.textMuted,
    divider:      edge,
    randomColor:  t.textMuted,
    randomHover:  t.btnBg,
    closeColor:   t.textMuted,
    closeHover:   t.text,
    // Shape, casing and the label's weight and tracking are identity, not colour,
    // so none of them can be derived. Every default sits BEFORE the spread, which
    // makes theme.modalChrome a pure set of overrides: an edition can name one key
    // without silently losing the rest to an undefined. That trap was real — `caps`
    // was already hoisted for it, and the fallback object it replaces meant an
    // edition could not add a label tweak without also restating its whole shape.
    //
    // Weight and tracking are here because matching the typeface was not enough.
    // Mondriaan sets every micro-label in Space Mono at 700 and 0.18em — its own
    // MLabel, its chrome, the APP / TOOL rules on the work table — while the modal
    // used the same face at 400 and 0.12em. Right family, wrong voice, which is
    // most of why the panel still read as a visitor.
    borderW: '2px', radius: '0', cardRadius: '0',
    caps: 'uppercase',
    labelWeight: 400,
    labelTrack: '0.12em',
    ...(theme.modalChrome || {}),
  };

  // An edition whose identity is a display face can set the names in it. Those
  // families ship a single weight, so the 600 the mono names carry would be
  // synthesised into a smear — the same trap Grain's NAME_WEIGHT avoids. 400 is
  // the real face.
  const NAME_FONT  = c.nameDisplay ? (theme.fonts.display || theme.fonts.serif) : MONO;
  const NAME_W     = c.nameDisplay ? 400 : NAME_WEIGHT;
  const NAME_TRACK = c.nameDisplay ? '-0.025em' : '-0.01em';
  const NAME_CASE  = c.nameDisplay ? 'uppercase' : 'none';

  React.useEffect(() => {
    const handler = e => { if (e.key === 'Escape') closeEditions(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  return (
    <div
      onClick={closeEditions}
      style={{ position:'fixed', inset:0, background:c.overlay, zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:'24px' }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background:c.panel, border:`${c.borderW} solid ${c.panelBorder}`, borderRadius:c.radius, maxWidth:'860px', width:'100%', padding:'36px' }}
      >
        <div style={{ fontFamily:LABEL_FONT, fontWeight:c.labelWeight, fontSize:'11px', letterSpacing:c.labelTrack, color:c.label, marginBottom:'28px', textTransform:c.caps }}>
          choose edition
        </div>
        {mobile ? (
          <div style={{ marginBottom:'24px' }}>
            {themes.map((t, i) => {
              const isActive = t.id === theme.id;
              const mobileAvailable = t.mobileOptimized === true;
              return (
                <button
                  key={t.id}
                  onClick={mobileAvailable ? () => { setThemeById(t.id); closeEditions(); } : undefined}
                  disabled={!mobileAvailable}
                  style={{
                    width:'100%', background:'none', border:'none',
                    borderBottom: i < themes.length - 1 ? `${c.paintedGrid ? '4px' : '1px'} solid ${c.divider}` : 'none',
                    padding:'16px 0', textAlign:'left', cursor: mobileAvailable ? 'pointer' : 'default',
                    display:'flex', justifyContent:'space-between', alignItems:'center',
                    opacity: mobileAvailable ? 1 : 0.35,
                  }}
                >
                  <div>
                    <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'3px' }}>
                      <span style={{ fontFamily:NAME_FONT, fontSize:'16px', fontWeight:NAME_W, color:c.cardName, letterSpacing:NAME_TRACK, textTransform:NAME_CASE }}>{t.name}</span>
                      {isActive && <span style={{ fontFamily:MONO, fontSize:'9px', letterSpacing:'0.1em', color:c.tagline, textTransform:c.caps }}>current</span>}
                    </div>
                    <span style={{ fontFamily:MONO, fontSize:'10px', color:c.tagline, letterSpacing:'0.04em' }}>{t.tagline}</span>
                  </div>
                  <span style={{ fontFamily:MONO, fontSize:'10px', color: mobileAvailable ? c.randomColor : c.tagline, letterSpacing:'0.08em', flexShrink:0, marginLeft:'12px' }}>
                    {mobileAvailable ? (isActive ? '✓' : '→') : 'desktop'}
                  </span>
                </button>
              );
            })}

          </div>
        ) : (
          <div style={{
            display:'grid', gridTemplateColumns:'repeat(3,1fr)', marginBottom:'28px', alignItems:'stretch',
            // Painted: the gutters are the black lines, so they take the panel's
            // border colour and the cards drop their own frames.
            gap: c.paintedGrid ? '10px' : '16px',
            background: c.paintedGrid ? c.panelBorder : 'none',
            padding: c.paintedGrid ? '10px' : 0,
          }}>
            {themes.map((t, i) => {
              const isActive = t.id === theme.id;
              return (
                <button
                  key={t.id}
                  onClick={() => { setThemeById(t.id); closeEditions(); }}
                  style={{
                    background: c.paintedGrid ? c.panel : 'none',
                    border: c.paintedGrid ? 'none' : `${c.borderW} solid ${isActive ? c.cardActive : c.cardInactive}`,
                    // Both rings sit in the gutter at offset 0, never inset: a
                    // hovered card and the current one then occupy exactly the
                    // same space, where an inset marker against an outset hover
                    // made the hovered card look 10px wider than the one it was
                    // being compared to.
                    outline: c.paintedGrid && isActive ? `5px solid ${c.cardActive}` : 'none',
                    outlineOffset: c.paintedGrid ? '0px' : '-5px',
                    borderRadius:c.cardRadius, overflow:'hidden',
                    cursor:'pointer', padding:'0', textAlign:'left', display:'flex', flexDirection:'column', width:'100%',
                  }}
                  onMouseEnter={e => {
                    if (isActive) return;
                    if (c.paintedGrid) {
                      // Drawn in the gutter, not inset like the current-edition
                      // marker. Inset, the frame crosses the card's own swatch,
                      // and the yellow that reads on a dark one (Ink, Volt,
                      // Grain) all but vanishes on a light one (Broadside,
                      // Prism) — the same frame looked whole on half the grid
                      // and partial on the other half. Out here it is always on
                      // black. Red stays inset, so the two never read alike.
                      e.currentTarget.style.outline = `5px solid ${c.cardHoverPainted}`;
                      e.currentTarget.style.outlineOffset = '0px';
                    }
                    else e.currentTarget.style.borderColor = c.cardHover;
                  }}
                  onMouseLeave={e => {
                    if (isActive) return;
                    if (c.paintedGrid) {
                      e.currentTarget.style.outline = 'none';
                      e.currentTarget.style.outlineOffset = '0px';
                    }
                    else e.currentTarget.style.borderColor = c.cardInactive;
                  }}
                >
                  <ThemeSwatch themeId={t.id} />
                  <div style={{ padding:'14px 16px' }}>
                    <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'4px' }}>
                      <span style={{ fontFamily:NAME_FONT, fontSize:'15px', fontWeight:NAME_W, color:c.cardName, letterSpacing:NAME_TRACK, textTransform:NAME_CASE }}>{t.name}</span>
                      {isActive && <span style={{ fontFamily:MONO, fontSize:'9px', letterSpacing:'0.1em', color:c.tagline, textTransform:c.caps }}>current</span>}
                    </div>
                    <div style={{ fontFamily:MONO, fontSize:'10px', color:c.tagline, letterSpacing:'0.04em', lineHeight:1.5, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{t.tagline}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
        <div style={{ paddingTop:'20px', display:'flex', justifyContent: mobile ? 'flex-end' : 'space-between', alignItems:'center' }}>
          {!mobile && (
            <button
              onClick={() => { pickRandom(); closeEditions(); }}
              style={{ fontFamily:LABEL_FONT, fontWeight:c.labelWeight, fontSize:'11px', color:c.randomColor, background:'none', border:'none', cursor:'pointer', letterSpacing:c.labelTrack }}
              onMouseEnter={e => e.currentTarget.style.color = c.randomHover}
              onMouseLeave={e => e.currentTarget.style.color = c.randomColor}
            >random edition →</button>
          )}
          <button
            onClick={closeEditions}
            style={{ fontFamily:LABEL_FONT, fontWeight:c.labelWeight, fontSize:'10px', color:c.closeColor, background:'none', border:'none', cursor:'pointer', letterSpacing:c.labelTrack, textTransform:c.caps }}
            onMouseEnter={e => e.currentTarget.style.color = c.closeHover}
            onMouseLeave={e => e.currentTarget.style.color = c.closeColor}
          >{mobile ? 'close' : 'esc to close'}</button>
        </div>
      </div>
    </div>
  );
}

function useMobile(breakpoint = 600) {
  const [mobile, setMobile] = React.useState(() => window.innerWidth < breakpoint);
  React.useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpoint}px)`);
    const handler = e => setMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [breakpoint]);
  return mobile;
}

// A text-sized control is only as tall as its line box — 13 to 17px for the 10-12px
// mono this edition labels things in, well under the 44px a thumb needs. The padding
// grows the tap target; the equal negative margin takes it straight back out of the
// layout, so spacing on the page is unchanged and nothing shifts. Desktop keeps the
// tight box: a cursor is precise, and there the extra area would only overlap
// neighbours. `x` widens narrow targets (an icon button); text links are already wide
// enough and only ever fail on height. `y` defaults to the 16px that lifts a 10-13px
// line box over 44, and is passed explicitly where the text is already tall.
const tapArea = (mobile, x, y) => {
  if (!mobile) return null;

// ── resolveAccent ──────────────────────────────────────────
const MONDRIAAN_PALETTE = new Set(['#d72027', '#1d4ed8', '#fcc60b', '#0a0a0a', '#ffffff']);
// Accent legibility.
//
// One accent per project has to serve a near-black card in Ink and a near-white page
// in Broadside, and no single hex does both. Measured on the current five: the blue is
// 3.0 against Ink and 5.5 against Broadside; the amber is 10.1 against Ink and 1.6
// against Broadside. So the value stays canonical in Sanity and the theme adjusts it here.
//
// Lightness only, hue and saturation held, so a colour stays itself - the purple that
// already reads well comes out as exactly the purple that was authored, untouched.
//
// Dark surfaces only. The same function fixes Broadside, but there it has to darken rather
// than brighten and the shifts are drastic - amber #ffad01 becomes #906100 - which is a
// look decision, not a bug fix, and wants deciding on its own.
const AC_TARGET = 7;      // WCAG AAA for normal text; the accents are 13px links
const AC_DARK_BG = 0.18;  // above this the surface is not dark and nothing is touched

function acLum(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function acRatio(a, b) {
  const x = acLum(a), y = acLum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}
function acToHsl(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  const l = (mx + mn) / 2;
  return [h, d ? d / (1 - Math.abs(2 * l - 1)) : 0, l];
}
function acToHex([h, s, l]) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const r = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
          : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return '#' + r.map(v => Math.round(Math.max(0, Math.min(1, v + m)) * 255).toString(16).padStart(2, '0')).join('');
}
// Returns the accent unchanged unless the surface is dark and the pair falls short.
function fitAccent(hex, bg) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex || '') || !/^#[0-9a-fA-F]{6}$/.test(bg || '')) return hex;
  if (acLum(bg) > AC_DARK_BG) return hex;
  if (acRatio(hex, bg) >= AC_TARGET) return hex;
  const [h, s, l0] = acToHsl(hex);
  for (let step = 1; step <= 100; step++) {
    const cand = acToHex([h, s, Math.min(1, l0 + step / 100)]);
    if (acRatio(cand, bg) >= AC_TARGET) return cand;
  }
  return hex;
}

// The surface an accent is actually painted on. bgDark is the card fill where it is a
// real colour. Broadside is a takeover and paints no cards at all, so this only
// the accent sits against.
function accentSurface(theme) {
  const d = theme.colors.bgDark;
  return /^#[0-9a-fA-F]{6}$/.test(d || '') ? d : theme.colors.bg;
}

function resolveAccent(project, themeId) {
  const a = project.accent;
  if (!a) return null;
  const color = typeof a === 'string' ? a : (a[themeId] || a.default || null);
  if (!color) return null;
  if (themeId === 'mondriaan-v1' && !MONDRIAAN_PALETTE.has(color.toLowerCase())) return null;
  return color;
}

function ProjectCard({ project, index, onClick }) {
  const [hovered, setHovered] = React.useState(false);
  const { theme } = useTheme();
  const accent = fitAccent(resolveAccent(project, theme.id), accentSurface(theme)) || theme.colors.text;
  // A button, not a div. The whole card is the control, and as a div it was clickable
  // by pointer only: no keyboard focus, and nothing announcing it. There is no link or
  // button inside it, so the card itself can be the element. The reset below only
  // neutralises what a button brings of its own — the card's own background, border and
  // padding are set further down and stay.
  return (
    <button
      type="button"
      onClick={() => onClick(project)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        font: 'inherit', color: 'inherit', textAlign: 'left', width: '100%', boxSizing: 'border-box',

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '32px' }}>

  const [filter, setFilter] = React.useState('all');

  const pool = featured ? PROJECTS.filter(p => p.featured) : PROJECTS.filter(p => p.public !== false);
  const categories = ['all', ...new Set(PROJECTS.map(p => p.tags[0]))];
  const visible = (!featured && filter !== 'all') ? pool.filter(p => p.tags[0] === filter) : pool;

  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: mobile ? '48px 20px' : '80px 32px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.15em' }}>
          {featured ? 'FEATURED WORK' : 'SELECTED PROJECTS'}
        </span>
        {onViewAll ? (
          <button onClick={onViewAll} style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em', background: 'none', border: 'none', cursor: 'pointer', padding: 0, transition: 'color 150ms ease', ...tapArea(mobile) }}
            onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
            onMouseLeave={e => e.currentTarget.style.color = theme.colors.textGhost}
          >{String(visible.length).padStart(2, '0')} / {String(PROJECTS.length).padStart(2, '0')} projects →</button>
        ) : (
          <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em' }}>
            {String(visible.length).padStart(2, '0')} / {String(PROJECTS.length).padStart(2, '0')} projects
          </span>
        )}
      </div>
      {!featured && (
        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '32px' }}>
          {categories.map(cat => (
            <button key={cat} onClick={() => setFilter(cat)} style={{
              fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',
              padding: '4px 12px', borderRadius: '2px', cursor: 'pointer',
              background: filter === cat ? theme.colors.btnBg : 'transparent',
              color: filter === cat ? theme.colors.btnText : theme.colors.textDim,
              border: `1px solid ${filter === cat ? theme.colors.btnBg : theme.colors.border}`,
              transition: 'all 150ms ease',
            }}
            onMouseEnter={e => { if (filter !== cat) { e.currentTarget.style.borderColor = theme.colors.textDim; e.currentTarget.style.color = theme.colors.text; }}}
            onMouseLeave={e => { if (filter !== cat) { e.currentTarget.style.borderColor = theme.colors.border; e.currentTarget.style.color = theme.colors.textDim; }}}
            >{cat}</button>
          ))}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '1px', background: visible.length ? theme.colors.bg : 'transparent' }}>
        {visible.map((p, i) => <ProjectCard key={p.id} project={p} index={i} onClick={onSelect} />)}
      </div>
    </section>
  );
}

// ── LivePreview ────────────────────────────────────────────
function LivePreview({ href, themeId }) {
  const containerRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const [interactive, setInteractive] = React.useState(false);
  const [hovered, setHovered] = React.useState(false);
  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new ResizeObserver(([entry]) => {
      setScale(entry.contentRect.width / 1280);
    });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  React.useEffect(() => {
    if (!interactive) return;
    const handler = (e) => { if (e.key === 'Escape') setInteractive(false); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [interactive]);
  const url = `${href}?theme=${themeId}`;
  return (
    <div ref={containerRef} style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      <iframe
        key={url}
        src={url}
        scrolling={interactive ? "yes" : "no"}
        style={{
          position: 'absolute', top: 0, left: 0,
          width: '1297px', height: '720px',
          border: 'none',
          pointerEvents: interactive ? 'auto' : 'none',
          transform: `scale(${scale})`, transformOrigin: 'top left',
        }}
      />
      {!interactive ? (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          onClick={() => setInteractive(true)}
          style={{
            position: 'absolute', inset: 0, cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: hovered ? 'rgba(0,0,0,0.12)' : 'transparent',
            transition: 'background 0.2s',
          }}
        >
          <span style={{
            background: 'rgba(0,0,0,0.72)', color: '#fff',
            padding: '7px 16px', borderRadius: '3px',
            fontFamily: 'monospace', fontSize: '11px', letterSpacing: '0.07em',
            opacity: hovered ? 1 : 0, transition: 'opacity 0.15s',
            pointerEvents: 'none', userSelect: 'none',
          }}>&#9654; INTERACT</span>
        </div>
      ) : (
        <button
          onClick={() => setInteractive(false)}
          style={{
            position: 'absolute', top: '8px', right: '8px', zIndex: 10,
            background: 'rgba(0,0,0,0.72)', color: '#fff', border: 'none',
            padding: '5px 12px', borderRadius: '3px', cursor: 'pointer',
            fontFamily: 'monospace', fontSize: '11px', letterSpacing: '0.05em',
          }}
        >&#10005; EXIT</button>
      )}
    </div>
  );
}

// Tools the page shows as "what I use" — retired tools stay defined (and credited
// on their projects) but drop off the Tools page. Shared by Tools() and MTools().
const visibleToolCategories = () =>
  TOOL_CATEGORIES.map(c => ({ ...c, tools: c.tools.filter(t => t.status !== 'retired') }));

// ── Tools ──────────────────────────────────────────────────
function Tools() {
  const categories = visibleToolCategories();
  const mobile = useMobile();
  const { theme } = useTheme();
  const pad = mobile ? '48px 20px' : '80px 32px';
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: pad }}>
      <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '20px' }}>tools</div>
      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: mobile ? '32px' : '44px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: '16px' }}>
        How I work.
      </h1>
      <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: theme.colors.textDim, lineHeight: 1.8, maxWidth: '48ch', marginBottom: mobile ? '40px' : '64px' }}>
        No strong opinions on tools. Strong opinions on outcomes. These just happen to be what's in the stack right now.
      </p>
      {mobile ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1px', background: theme.colors.borderSubtle }}>
          {categories.map(cat => (
            <div key={cat.label} style={{ background: theme.colors.bg, padding: '20px 20px 4px' }}>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '16px' }}>{cat.label}</div>
              {cat.tools.map(t => (
                <div key={t.name} style={{ paddingBottom: '20px' }}>
                  <div style={{ fontFamily: theme.fonts.serif, fontSize: '20px', color: theme.colors.text, letterSpacing: '-0.01em', marginBottom: '4px' }}>{t.name}</div>
                  <div style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textFaint, lineHeight: 1.6 }}>{t.desc}</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', columnGap: '1px', rowGap: 0, background: theme.colors.borderSubtle }}>
          {categories.map(cat => (
            <div key={`h-${cat.label}`} style={{ background: theme.colors.bg, padding: '32px 28px 20px' }}>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint }}>{cat.label}</div>
            </div>
          ))}
          {Array.from({ length: Math.max(...categories.map(c => c.tools.length)) }, (_, rowIdx) =>
            categories.map(cat => {
              const t = cat.tools[rowIdx];
              const isLast = rowIdx === Math.max(...categories.map(c => c.tools.length)) - 1;
              return (
                <div key={`${cat.label}-${rowIdx}`} style={{ background: theme.colors.bg, padding: `0 28px ${isLast ? '32px' : '20px'}` }}>
                  {t && (
                    <>
                      <div style={{ fontFamily: theme.fonts.serif, fontSize: '20px', color: theme.colors.text, letterSpacing: '-0.01em', marginBottom: '4px' }}>{t.name}</div>
                      <div style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textFaint, lineHeight: 1.6 }}>{t.desc}</div>
                    </>
                  )}
                </div>
              );
            })
          )}
        </div>
      )}
    </section>
  );
}

// ── Contact ────────────────────────────────────────────────
function Contact() {
  const [sent, setSent] = React.useState(false);
  const [error, setError] = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const mobile = useMobile();
  const { theme } = useTheme();
  const inputStyle = {
    width: '100%', padding: '10px 12px', fontFamily: theme.fonts.mono,
    // 16px on mobile, not 13. Safari zooms the page in on any field it considers too
    // small to read and does not zoom back out, so the reader is left on a form wider
    // than the screen. 16px is the threshold, and Mondriaan's form already sits on it.
    fontSize: mobile ? '16px' : '13px', color: theme.colors.text, background: theme.colors.bgInput,
    border: `1px solid ${theme.colors.border}`, borderRadius: '2px', outline: 'none',
    boxSizing: 'border-box',
    // A single-line field lands at 39px from its padding alone. This is the one control
    // on the page you have to hit before you can type, so it gets the full 44.
    minHeight: '44px',
    // Read by the :-webkit-autofill rule in the head, which cannot see these
    // inline values any other way.
    '--pco-autofill-bg': theme.colors.bgInput,
    '--pco-autofill-fg': theme.colors.text,
  };
  return (

// ── Before/After comparison slider ──────────────────────────
// Drag-to-reveal case-study comparison: "before" clips over a full "after"
// base layer. Used only when a project defines both screenshots.
function BeforeAfterSlider({ before, after, alt, accent }) {
  const [pos, setPos] = React.useState(50);
  const draggingRef = React.useRef(false);
  const ref = React.useRef(null);

  const setFromClientX = (clientX) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const pct = ((clientX - rect.left) / rect.width) * 100;
    setPos(Math.min(100, Math.max(0, pct)));
  };
  const onPointerDown = (e) => {
    draggingRef.current = true;
    e.currentTarget.setPointerCapture(e.pointerId);
    setFromClientX(e.clientX);
  };
  const onPointerMove = (e) => { if (draggingRef.current) setFromClientX(e.clientX); };
  const onPointerUp = () => { draggingRef.current = false; };
  const onKeyDown = (e) => {
    if (e.key === 'ArrowLeft') { setPos(p => Math.max(0, p - 5)); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { setPos(p => Math.min(100, p + 5)); e.preventDefault(); }
  };
  const labelStyle = {
    position: 'absolute', top: '10px', fontFamily: 'monospace', fontSize: '10px',
    letterSpacing: '0.1em', textTransform: 'uppercase', color: '#fff',
    background: 'rgba(0,0,0,0.55)', padding: '4px 8px', borderRadius: '2px',
    pointerEvents: 'none', transition: 'opacity 150ms ease',
  };
  // Each label only makes sense while its side is actually visible — at the
  // extremes (pos 0 or 100) only one image shows at all, so hide the other's label.
  const beforeOpacity = pos <= 0 ? 0 : 1;
  const afterOpacity = pos >= 100 ? 0 : 1;
  const imgStyle = { width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'top', display: 'block' };
  return (
    <div
      ref={ref}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      style={{ position: 'absolute', inset: 0, cursor: 'ew-resize', userSelect: 'none', touchAction: 'none' }}
    >
      <img src={sanityImg(after, 1400)} alt={alt} style={imgStyle} draggable={false} />
      <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', clipPath: `inset(0 ${100 - pos}% 0 0)` }}>
        <img src={sanityImg(before, 1400)} alt={alt + ', before'} style={imgStyle} draggable={false} />
      </div>
      <div style={{ ...labelStyle, left: '10px', opacity: beforeOpacity }}>before</div>
      <div style={{ ...labelStyle, right: '10px', opacity: afterOpacity }}>after</div>
      <div aria-hidden="true" style={{
        position: 'absolute', top: 0, bottom: 0, left: `calc(${pos}% - 1px)`, width: '2px',
        background: '#fff', boxShadow: '0 0 0 1px rgba(0,0,0,0.3)', pointerEvents: 'none',
      }} />
      <div
        role="slider" tabIndex={0} aria-label="Before and after comparison"
        aria-valuenow={Math.round(pos)} aria-valuemin={0} aria-valuemax={100}
        onKeyDown={onKeyDown}
        style={{
          position: 'absolute', top: '50%', left: `${pos}%`, transform: 'translate(-50%, -50%)',
          width: '36px', height: '36px', borderRadius: '50%', background: accent || '#fff',
          border: '2px solid #fff', boxShadow: '0 2px 8px rgba(0,0,0,0.35)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: '13px', color: '#fff', cursor: 'ew-resize',
        }}
      >⟷</div>
    </div>
  );
}

// ── Data completeness ──────────────────────────────────────
// How much of a project the numbers above actually cover, as a bar rather than
// only as a sentence. The figure is commitCoveragePct, computed by the
// extractor: the share of the project's commits that fall inside the measured
// window. It is a coverage measure, not a quality one — a low score says the
// record is thin, not that the project is.
//
// The label carries the scope, because the same number means different things
// either side of a hand-counted source. Milk Me Not measures 4%: it was built
// almost entirely in Lovable, so Claude Code saw almost none of its 3,054
// commits. Its prompt count is still nearly whole — the Lovable figure is
// counted right beside it — so a bare "4% complete" would report the project as
// undocumented when it is the token and hour figures alone that are thin. On a
// mixed project the label says which tool the percentage is about, and the
// caveat underneath names the other source and what it does not report.
function Completeness({ fp, mixed }) {
  const { theme } = useTheme();
  const pct = fp.coverage && fp.coverage.commitCoveragePct;
  if (typeof pct !== 'number') return null;

  const clamped = Math.max(0, Math.min(100, pct));
  return (
    <div style={{ marginTop: '18px', maxWidth: '360px' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', marginBottom: '6px' }}>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textGhost }}>
          DATA COMPLETENESS
        </span>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textDim }}>
          {clamped}%
        </span>
      </div>
      {/* A track one step off the page ground, and a fill in body text colour —
          no red, no green. A thin record is a fact about the archive, not a
          failure to grade. */}
      <div
        role="img"
        aria-label={`${clamped}% of this project's commits fall inside the measured window`}
        style={{ height: '3px', background: theme.colors.border, borderRadius: '2px', overflow: 'hidden' }}>
        <div style={{ width: clamped + '%', height: '100%', background: theme.colors.textDim }} />
      </div>
      <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textDim, marginTop: '6px' }}>
        {mixed ? 'of commits measured in Claude Code' : 'of commits measured'}
      </div>
    </div>
  );
}

// ── Build Footprint ────────────────────────────────────────
// One rule, three stats, one honest caveat. Renders nothing when there's no
// measured data for this project.
function BuildFootprint({ project }) {
  const mobile = useMobile();
  const { theme } = useTheme();
  const fp = footprintFor(project);
  if (!fp) return null;

  // Prompts is the only figure that combines across tools — a prompt is a
  // prompt anywhere. Hours and tokens stay Claude Code only, because no other
  // tool reports them; the caveat below says so explicitly.
  const prompts = (fp.combined ? fp.combined.prompts : fp.measured.prompts) || 0;
  const mixed = !!(fp.combined && fp.manualSources && fp.manualSources.length);

  // 0% coverage means not one of the project's commits falls inside the measured
  // window, so the figures describe some later visit rather than the build. They
  // are true and they are worse than nothing — "2 prompts" under a shipped site
  // reads as a claim about how it was made. The bar still renders at zero, which
  // is the honest statement, and the caveat explains the gap.
  const noRecord = !!(fp.coverage && fp.coverage.commitCoveragePct === 0);

  // Every stat on the rule has to share one scope, or the reader reads a
  // parity that isn't there. Where another tool did most of the building,
  // hours and tokens describe only the Claude Code sliver while prompts
  // describe the whole project — so those two are dropped rather than shown
  // at equal weight beside a number that means something different. Months
  // spans the real work in either case, and comes from git.
  const stats = mixed
    ? [
        { value: prompts.toLocaleString('en-US'), label: 'prompts' },
        { value: spanMonths(fp), label: 'months' },
      ]
    : [
        { value: prompts.toLocaleString('en-US'), label: 'prompts' },
        { value: fp.measured.activeHours, label: 'hours' },
        { value: fmtTokens(fp.tokens.output), label: 'tokens out' },
      ];

  return (
    <div style={{
      borderTop: `1px solid ${theme.colors.border}`,
      paddingTop: '16px',
      marginTop: mobile ? '32px' : '40px',
    }}>
      <div style={{
        fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost,
        letterSpacing: '0.12em', marginBottom: '14px',
      }}>BUILD FOOTPRINT</div>

      <div style={{
        display: noRecord ? 'none' : 'flex', gap: mobile ? '28px' : '48px',
        flexWrap: 'wrap', marginBottom: '14px',
      }}>
        {stats.map(s => (
          <div key={s.label} style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
            <span style={{
              fontFamily: theme.fonts.serif, fontSize: mobile ? '22px' : '26px',
              color: theme.colors.text, letterSpacing: '-0.01em', lineHeight: 1,
            }}>{s.value}</span>
            <span style={{
              fontFamily: theme.fonts.mono, fontSize: '12px', color: theme.colors.textDim,
            }}>{s.label}</span>
          </div>
        ))}
      </div>

      {/* textDim, not textFaint: this line is the disclosure, so it has to stay
          legible. textFaint now clears AA on the dark editions, but still fails on
          the light ones. */}
      <p style={{
        fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textDim,
        lineHeight: 1.75, margin: 0, maxWidth: '62ch',
      }}>{footprintCaveat(fp)}</p>

      <Completeness fp={fp} mixed={mixed} />
    </div>
  );
}
