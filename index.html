<script type="text/babel">
// ── Themes ─────────────────────────────────────────────────
const THEMES = [
  {
    id: 'ink-v1',
    name: 'Ink',
    version: 'v1',
    fonts: {
      serif: "'DM Serif Display', Georgia, serif",
      mono:  "'JetBrains Mono', 'Fira Code', monospace",
    },
    googleFonts: 'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap',
    colors: {
      bg:          '#0a0a0a',
      bgDark:      '#111111',
      bgInput:     '#141414',
      surface:     '#1e1e1e',
      border:      '#2a2a2a',
      borderSubtle:'#1e1e1e',
      text:        '#ffffff',
      textMuted:   '#a8a8a8',
      textDim:     '#6b6b6b',
      textFaint:   '#4a4a4a',
      textGhost:   '#3a3a3a',
      btnBg:       '#ffffff',
      btnText:     '#0a0a0a',
    },
  },
  {
    id: 'chalk-v1',
    name: 'Chalk',
    version: 'v1',
    fonts: {
      serif: "'DM Serif Display', Georgia, serif",
      mono:  "'JetBrains Mono', 'Fira Code', monospace",
    },
    googleFonts: 'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap',
    colors: {
      bg:          '#f2f0eb',
      bgDark:      '#e8e6e1',
      bgInput:     '#eceae5',
      surface:     '#e2e0db',
      border:      '#d0cec9',
      borderSubtle:'#dddbd6',
      text:        '#0a0a0a',
      textMuted:   '#3a3a3a',
      textDim:     '#6b6b6b',
      textFaint:   '#8a8a8a',
      textGhost:   '#aaaaaa',
      btnBg:       '#0a0a0a',
      btnText:     '#f2f0eb',
    },
  },
];

// ── Theme Context ──────────────────────────────────────────
const ThemeContext = React.createContext();
const useTheme = () => React.useContext(ThemeContext);

function ThemeProvider({ children }) {
  const [themeIdx, setThemeIdx] = React.useState(() => {
    try {
      const saved = localStorage.getItem('pco-theme');
      const idx = THEMES.findIndex(t => t.id === saved);
      return idx >= 0 ? idx : 0;
    } catch { return 0; }
  });
  const theme = THEMES[themeIdx];

  const setThemeById = (id) => {
    const idx = THEMES.findIndex(t => t.id === id);
    if (idx >= 0) {
      setThemeIdx(idx);
      try { localStorage.setItem('pco-theme', id); } catch {}
    }
  };

  const pickRandom = () => {
    const others = THEMES.filter((_, i) => i !== themeIdx);
    const pool = others.length > 0 ? others : THEMES;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    setThemeById(pick.id);
  };

  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--color-bg', theme.colors.bg);
    root.style.setProperty('--color-text', theme.colors.text);
    const link = document.getElementById('theme-fonts');
    if (link) link.href = theme.googleFonts;
  }, [theme]);

  return (
    <ThemeContext.Provider value={{ theme, themes: THEMES, themeIdx, setThemeById, pickRandom }}>
      {children}
    </ThemeContext.Provider>
  );
}

// ── ThemeDropdown ──────────────────────────────────────────
function ThemeDropdown() {
  const { theme, themes, themeIdx, setThemeById, pickRandom } = useTheme();
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef();

  React.useEffect(() => {
    if (!open) return;
    const handler = e => { if (!ref.current?.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  return (
    <div ref={ref} style={{ position: 'relative', paddingTop: '8px' }}>
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
          color: open ? theme.colors.text : theme.colors.textDim,
          background: 'none', border: 'none', cursor: 'pointer',
          borderBottom: `1px solid ${open ? theme.colors.textDim : 'transparent'}`,
          paddingBottom: '2px', transition: 'color 150ms ease',
          display: 'flex', alignItems: 'center', gap: '4px',
        }}
        onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
        onMouseLeave={e => { if (!open) e.currentTarget.style.color = theme.colors.textDim; }}
      >
        theme <span style={{ fontSize: '9px', opacity: 0.6 }}>{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 8px)', right: 0,
          background: theme.colors.bgDark, border: `1px solid ${theme.colors.border}`,
          borderRadius: '2px', minWidth: '160px', zIndex: 200,
        }}>
          {themes.map((t, i) => (
            <button key={t.id} onClick={() => { setThemeById(t.id); setOpen(false); }} style={{
              display: 'block', width: '100%', textAlign: 'left',
              fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.06em',
              color: i === themeIdx ? theme.colors.text : theme.colors.textDim,
              background: 'none', border: 'none', cursor: 'pointer',
              padding: '10px 14px',
              borderBottom: `1px solid ${theme.colors.borderSubtle}`,
            }}>
              {i === themeIdx ? '● ' : '○ '}{t.name} {t.version}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function useMobile(breakpoint = 600) {
  const [mobile, setMobile] = React.useState(() => window.innerWidth < breakpoint);
  React.useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpoint}px)`);
    const handler = e => setMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [breakpoint]);
  return mobile;
}

// ── Tag ────────────────────────────────────────────────────
function Tag({ children, filled, muted }) {
  const { theme } = useTheme();
  const bg     = filled ? theme.colors.btnBg  : muted ? theme.colors.surface : 'transparent';
  const color  = filled ? theme.colors.btnText : muted ? theme.colors.textDim : theme.colors.textMuted;
  const border = filled ? `1px solid ${theme.colors.btnBg}` : `1px solid ${theme.colors.border}`;
  return (
    <span style={{
      fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',
      padding: '3px 8px', background: bg, color, border,
      borderRadius: '2px', display: 'inline-block',
    }}>{children}</span>
  );
}

// ── SiteHeader ─────────────────────────────────────────────
function SiteHeader({ activePage, onNavigate }) {
  const mobile = useMobile();
  const { theme } = useTheme();
  const links = ['work', 'about', 'tools', 'contact'];
  return (
    <div style={{ maxWidth: '1080px', margin: '0 auto', padding: '48px 32px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: mobile ? 'wrap' : 'nowrap', gap: mobile ? '12px' : '0' }}>
      <button onClick={() => onNavigate('home')} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, display: 'flex', alignItems: 'baseline', gap: '5px' }}>
        <span style={{ fontFamily: theme.fonts.serif, fontSize: mobile ? '26px' : '36px', color: theme.colors.text, letterSpacing: '-0.03em', lineHeight: 1.0 }}>Peter</span>
        <span style={{ fontFamily: theme.fonts.serif, fontSize: mobile ? '16px' : '22px', color: theme.colors.textDim, letterSpacing: '-0.02em', lineHeight: 1.0 }}>&amp; Co.</span>
      </button>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: mobile ? '16px' : '28px', flexShrink: 0 }}>
        <nav style={{ display: 'flex', gap: mobile ? '16px' : '28px', paddingTop: '8px' }}>
          {links.map(l => (
            <button key={l} onClick={() => onNavigate(l)} style={{
              fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
              color: activePage === l ? theme.colors.text : theme.colors.textDim,
              background: 'none', border: 'none', cursor: 'pointer',
              borderBottom: activePage === l ? `1px solid ${theme.colors.text}` : '1px solid transparent',
              paddingBottom: '2px', transition: 'color 150ms ease',
            }}
            onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
            onMouseLeave={e => e.currentTarget.style.color = activePage === l ? theme.colors.text : theme.colors.textDim}
            >{l}</button>
          ))}
        </nav>
        {!mobile && <ThemeDropdown />}
      </div>
    </div>
  );
}

// ── Hero ───────────────────────────────────────────────────
function Hero({ onCTA, activePage, onNavigate }) {
  const mobile = useMobile();
  const { theme } = useTheme();
  return (
    <section style={{ borderBottom: `1px solid ${theme.colors.border}` }}>

        <h1 style={{
          fontFamily: theme.fonts.serif, fontSize: 'clamp(52px, 8vw, 92px)',
          fontWeight: 400, color: theme.colors.text, lineHeight: 1.0,
          letterSpacing: '-0.025em', margin: 0, marginBottom: '40px', maxWidth: '14ch',
        }}>I build things.<br />Sometimes<br />they're useful.</h1>
        <div style={{ display: 'flex', flexDirection: mobile ? 'column' : 'row', alignItems: mobile ? 'flex-start' : 'center', gap: mobile ? '12px' : '32px' }}>
          <button onClick={() => onNavigate('contact')} style={{
            fontFamily: theme.fonts.mono, fontSize: '12px', letterSpacing: '0.08em',
            color: theme.colors.btnText, background: theme.colors.btnBg, border: `1px solid ${theme.colors.btnBg}`,

            whiteSpace: 'nowrap',
          }}
          onMouseEnter={e => e.currentTarget.style.opacity = '0.7'}
          onMouseLeave={e => e.currentTarget.style.opacity = '1'}

          <span style={{ fontFamily: theme.fonts.mono, fontSize: '11px', color: theme.colors.textFaint, letterSpacing: '0.06em' }}>

// ── ProjectCard ────────────────────────────────────────────
function ProjectCard({ project, index, onClick }) {
  const [hovered, setHovered] = React.useState(false);
  const { theme } = useTheme();
  const accent = project.accent || theme.colors.text;
  return (
    <div
      onClick={() => onClick(project)}

      onMouseLeave={() => setHovered(false)}
      style={{
        background: theme.colors.bgDark, cursor: 'pointer', padding: '28px 28px 0',
        display: 'flex', flexDirection: 'column',
        border: `1px solid ${theme.colors.borderSubtle}`,
        transition: 'border-color 150ms ease',
        borderColor: hovered ? theme.colors.border : theme.colors.borderSubtle,
        position: 'relative',
      }}
    >
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '32px' }}>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em' }}>
          {String(index + 1).padStart(2, '0')}
        </span>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.12em' }}>
          {project.tags[0].toUpperCase()}
        </span>
      </div>
      <h3 style={{
        fontFamily: theme.fonts.serif, fontWeight: 400, fontSize: '36px',
        lineHeight: 0.95, color: theme.colors.text, letterSpacing: '-0.02em',
        marginBottom: '24px', flex: 1,
      }}>{project.title}</h3>
      <p style={{
        fontFamily: theme.fonts.mono, fontSize: '12px', color: theme.colors.textDim,
        lineHeight: 1.7, marginBottom: '32px', maxWidth: '36ch',
      }}>{project.description}</p>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: '28px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accent, display: 'inline-block', flexShrink: 0 }} />
          <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: accent, letterSpacing: '0.04em' }}>{project.url}</span>
        </div>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: hovered ? theme.colors.text : theme.colors.textGhost, transition: 'color 150ms ease' }}>→</span>

        background: hovered ? accent : 'transparent', transition: 'background 150ms ease',

  );
}

// ── ProjectStrip ───────────────────────────────────────────
function ProjectStrip({ onSelect, projects, onViewAll }) {
  const { theme } = useTheme();
  const list = projects || PROJECTS;
  return (
    <div style={{ borderTop: `1px solid ${theme.colors.borderSubtle}` }}>
      <div style={{ maxWidth: '1080px', margin: '0 auto', padding: '0 32px' }}>
        {list.map((p, i) => {
          const [hovered, setHovered] = React.useState(false);
          const accent = p.accent || theme.colors.text;
          return (
            <div key={p.id}
              onClick={() => onSelect(p)}
              onMouseEnter={() => setHovered(true)}
              onMouseLeave={() => setHovered(false)}
              style={{
                display: 'flex', alignItems: 'center', gap: '24px',
                padding: '18px 0',
                borderBottom: `1px solid ${theme.colors.borderSubtle}`,
                cursor: 'pointer',
                background: hovered ? theme.colors.surface : 'transparent',
                margin: '0 -32px', paddingLeft: '32px', paddingRight: '32px',
                transition: 'background 120ms ease',
              }}
            >
              <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em', width: '20px', flexShrink: 0 }}>
                {String(i + 1).padStart(2, '0')}
              </span>
              <span style={{ fontFamily: theme.fonts.serif, fontSize: '22px', color: theme.colors.text, letterSpacing: '-0.02em', flex: 1 }}>
                {p.title}
              </span>
              <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textDim, letterSpacing: '0.08em', width: '48px', flexShrink: 0 }}>
                {p.tags[0]}

              <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.06em', width: '32px', flexShrink: 0 }}>
                {p.year}
              </span>
              <span style={{ display: 'flex', alignItems: 'center', gap: '6px', flexShrink: 0 }}>
                <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accent, display: 'inline-block' }} />
                <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: accent, letterSpacing: '0.04em' }}>{p.url}</span>
              </span>

              fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',

            onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
            onMouseLeave={e => e.currentTarget.style.color = theme.colors.textFaint}
            >all projects →</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ProjectGrid({ onSelect, featured }) {
  const { theme } = useTheme();
  const [filter, setFilter] = React.useState('all');

  const pool = featured ? PROJECTS.filter(p => p.featured) : PROJECTS;
  const categories = ['all', ...new Set(PROJECTS.map(p => p.tags[0]))];
  const visible = (!featured && filter !== 'all') ? pool.filter(p => p.tags[0] === filter) : pool;

  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: '80px 32px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.15em' }}>
          {featured ? 'FEATURED WORK' : 'SELECTED PROJECTS'}
        </span>
        <span style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em' }}>
          {String(visible.length).padStart(2, '0')} projects
        </span>
      </div>
      {!featured && (
        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '32px' }}>
          {categories.map(cat => (
            <button key={cat} onClick={() => setFilter(cat)} style={{
              fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',
              padding: '4px 12px', borderRadius: '2px', cursor: 'pointer',
              background: filter === cat ? theme.colors.btnBg : 'transparent',
              color: filter === cat ? theme.colors.btnText : theme.colors.textDim,
              border: `1px solid ${filter === cat ? theme.colors.btnBg : theme.colors.border}`,
              transition: 'all 150ms ease',
            }}
            onMouseEnter={e => { if (filter !== cat) { e.currentTarget.style.borderColor = theme.colors.textDim; e.currentTarget.style.color = theme.colors.text; }}}
            onMouseLeave={e => { if (filter !== cat) { e.currentTarget.style.borderColor = theme.colors.border; e.currentTarget.style.color = theme.colors.textDim; }}}
            >{cat}</button>
          ))}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '1px', background: visible.length ? theme.colors.borderSubtle : 'transparent' }}>
        {visible.map((p, i) => <ProjectCard key={p.id} project={p} index={i} onClick={onSelect} />)}
      </div>
    </section>
  );
}

  const { theme } = useTheme();

// ── Contact ────────────────────────────────────────────────
function Contact() {
  const [sent, setSent] = React.useState(false);
  const { theme } = useTheme();
  const inputStyle = {
    width: '100%', padding: '10px 12px', fontFamily: theme.fonts.mono,
    fontSize: '13px', color: theme.colors.text, background: theme.colors.bgInput,
    border: `1px solid ${theme.colors.border}`, borderRadius: '2px', outline: 'none',
  };
  return (
    <section style={{ maxWidth: '640px', margin: '0 auto', padding: '80px 32px' }}>
      <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: theme.colors.textFaint, marginBottom: '20px' }}>contact</div>
      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: '44px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: '48px' }}>Say hello.</h1>
      {!sent ? (
        <form onSubmit={e => {
          e.preventDefault();
          const data = new FormData(e.target);
          const name = data.get('name') || '';
          const msg = data.get('message') || '';
          window.location.href = `mailto:peterreijm@live.nl?subject=Hello from ${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}`;
          setSent(true);
        }} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
          {[
            { id: 'name',  label: 'name',  type: 'text',  placeholder: 'your name' },
            { id: 'email', label: 'email', type: 'email', placeholder: 'your@email.com' },
          ].map(f => (
            <div key={f.id}>
              <label htmlFor={f.id} style={{ display: 'block', fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: theme.colors.textFaint, marginBottom: '6px' }}>{f.label}</label>
              <input id={f.id} name={f.id} type={f.type} placeholder={f.placeholder} style={inputStyle}
                onFocus={e => e.target.style.borderColor = theme.colors.textDim}
                onBlur={e => e.target.style.borderColor = theme.colors.border} />
            </div>
          ))}
          <div>
            <label htmlFor="message" style={{ display: 'block', fontFamily: theme.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: theme.colors.textFaint, marginBottom: '6px' }}>message</label>
            <textarea id="message" name="message" rows={5} placeholder="what's on your mind?" style={{ ...inputStyle, resize: 'vertical' }}
              onFocus={e => e.target.style.borderColor = theme.colors.textDim}
              onBlur={e => e.target.style.borderColor = theme.colors.border} />
          </div>
          <button type="submit" style={{
            alignSelf: 'flex-start', fontFamily: theme.fonts.mono, fontSize: '12px',
            letterSpacing: '0.08em', color: theme.colors.btnText, background: theme.colors.btnBg,
            border: `1px solid ${theme.colors.btnBg}`, padding: '10px 28px', borderRadius: '2px', cursor: 'pointer',
          }}
          onMouseEnter={e => e.currentTarget.style.opacity = '0.7'}
          onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >send →</button>
        </form>
      ) : (
        <div style={{ borderTop: `1px solid ${theme.colors.border}`, paddingTop: '32px' }}>
          <p style={{ fontFamily: theme.fonts.serif, fontSize: '28px', color: theme.colors.text, marginBottom: '12px' }}>Got it.</p>
          <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: theme.colors.textDim, lineHeight: 1.7 }}>I'll be in touch. Usually within a day or two.</p>
        </div>
      )}
    </section>
  );
}

// ── Project Detail ─────────────────────────────────────────
function ProjectDetail({ project, onBack }) {
  const { theme } = useTheme();
  const accent = project.accent || theme.colors.text;
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: '80px 32px' }}>
      <button onClick={onBack} style={{
        fontFamily: theme.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
        color: theme.colors.textFaint, background: 'none', border: 'none', cursor: 'pointer',
        padding: 0, marginBottom: '48px', display: 'block', transition: 'color 150ms ease',
      }}
      onMouseEnter={e => e.currentTarget.style.color = theme.colors.text}
      onMouseLeave={e => e.currentTarget.style.color = theme.colors.textFaint}
      >← back to work</button>

      <div style={{ display: 'flex', gap: '6px', marginBottom: '20px', flexWrap: 'wrap' }}>
        {project.tags.map(t => <Tag key={t} muted>{t}</Tag>)}
        <Tag filled>{project.year}</Tag>
      </div>

      <h1 style={{ fontFamily: theme.fonts.serif, fontSize: '52px', fontWeight: 400, color: theme.colors.text, lineHeight: 1.0, letterSpacing: '-0.02em', marginBottom: '12px' }}>
        {project.title}
      </h1>
      {project.tagline && (
        <p style={{ fontFamily: theme.fonts.mono, fontSize: '13px', color: accent, letterSpacing: '0.04em', marginBottom: '32px' }}>
          {project.tagline}
        </p>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 260px', gap: '64px', marginBottom: '48px', alignItems: 'start' }}>
        <p style={{ fontFamily: theme.fonts.mono, fontSize: '14px', color: theme.colors.textMuted, lineHeight: 1.8, margin: 0 }}>
          {project.detail || project.description}
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
          {project.role && (
            <div>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.12em', marginBottom: '6px' }}>ROLE</div>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '12px', color: theme.colors.textDim }}>{project.role}</div>
            </div>
          )}
          {project.stack && (
            <div>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.12em', marginBottom: '8px' }}>STACK</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                {project.stack.map(s => <Tag key={s} muted>{s}</Tag>)}
              </div>
            </div>
          )}
          {project.href && (
            <div>
              <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.12em', marginBottom: '6px' }}>LIVE AT</div>
              <a href={project.href} target="_blank" rel="noopener noreferrer" style={{
                fontFamily: theme.fonts.mono, fontSize: '12px', color: accent,
                textDecoration: 'none', letterSpacing: '0.04em',
              }}
              onMouseEnter={e => e.target.style.opacity = '0.7'}
              onMouseLeave={e => e.target.style.opacity = '1'}
              >{project.url} ↗</a>
            </div>
          )}
        </div>
      </div>

      <div style={{
        width: '100%', aspectRatio: '16/9', background: theme.colors.bgDark, border: `1px solid ${accent}22`,
        borderRadius: '2px', display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative', overflow: 'hidden',
      }}>
        {project.screenshot
          ? <img src={project.screenshot} alt={project.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          : <>
              <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at 30% 50%, ${accent}11 0%, transparent 70%)` }} />
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: theme.fonts.serif, fontSize: '32px', color: accent, opacity: 0.2, marginBottom: '8px' }}>{project.title}</div>
                <div style={{ fontFamily: theme.fonts.mono, fontSize: '10px', color: theme.colors.textGhost, letterSpacing: '0.1em' }}>screenshot coming soon</div>
              </div>
            </>
        }
      </div>
    </section>
  );
}

function App() {
  const [page, setPage] = React.useState('home');
  const [selectedProject, setSelectedProject] = React.useState(null);

  const navigate = (p) => {
    setPage(p);
    setSelectedProject(null);
    window.scrollTo({ top: 0 });
  };

  const selectProject = (project) => {
    setSelectedProject(project);
    setPage('project');
    window.scrollTo({ top: 0 });
  };

  const activePage = selectedProject ? 'work' : page;

  return (
    <ThemeProvider>
    <div>
      <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
        <main style={{ flex: 1 }}>
        {page === 'home' && !selectedProject && (
          <>
            <Hero activePage={activePage} onNavigate={navigate} />
            <ProjectGrid featured onSelect={selectProject} />
          </>
        )}
        {page === 'work' && !selectedProject && (
          <>
            <SiteHeader activePage={activePage} onNavigate={navigate} />
            <div style={{ paddingTop: '80px' }}>
              <ProjectStrip projects={PROJECTS} onSelect={selectProject} />
            </div>
          </>
        )}
        {(page === 'about' || page === 'tools' || page === 'contact' || page === 'project') && (
          <SiteHeader activePage={activePage} onNavigate={navigate} />
        )}
        {page === 'about' && <About />}
        {page === 'tools' && <Tools />}
        {page === 'contact' && <Contact />}
        {page === 'project' && selectedProject && <ProjectDetail project={selectedProject} onBack={() => navigate('work')} />}
        </main>
        <Footer />
      </div>
    </div>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
