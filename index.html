function PrismApp({ selectedProject, navigate, selectProject }) {
  const mobile = useMobile();
  const { openEditions } = useTheme();
  const projects = PROJECTS;
  const [pendingJump, setPendingJump] = React.useState(null);

  React.useEffect(() => { pzStyles(); }, []);
  // Leaving a project changes this dependency from an id to null, which would fire a
  // scroll to the top at the same moment a pending jump is aiming at a section. Skip
  // it while one is in flight so the two cannot race.
  //
  // Instant, and before paint. Opening a project is not a journey through the
  // document, it is a different document, and gliding there put three movements on
  // screen at once: React swaps the short project page in under a reader scrolled
  // down the long work list, the browser clamps the scroll to the new height in one
  // jump, and only then does the smooth glide start — across pz-in already revealing.
  // That stack is the flicker.
  //
  // A layout effect runs before the browser paints, so the reset lands with the new
  // page rather than after it, and the clamp is never seen.
  //
  // behavior:'instant', not 'auto'. The option does NOT override the CSS: per the
  // CSSOM spec 'auto' MEANS defer to scroll-behavior, and line 164 sets
  // html { scroll-behavior: smooth } for the whole site. So this reset — the one
  // this entire comment argues has to be instant and before paint — was animating
  // the full length of the work list every time a project opened. Only 'instant'
  // forces the jump. Measured in the page: scrollTo with 'auto' left scrollY where
  // it was; with 'instant' it moved on the same tick.
  //
  // In-page jumps keep their glide. There the movement is the point: the reader stays
  // in one document and the travel shows them where they went.
  React.useLayoutEffect(() => {
    if (pendingJump) return;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [selectedProject && selectedProject.id]);

  // 'instant' rather than 'auto' here too — 'auto' deferred to the global smooth
  // rule, so asking for reduced motion still got a full animated scroll.
  const onTop = () => window.scrollTo({ top: 0, behavior: pzReduced() ? 'instant' : 'smooth' });
  const scrollToId = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: pzReduced() ? 'instant' : 'smooth', block: 'start' });
  };

  // A layout effect rather than a pair of nested requestAnimationFrames. Both wait for
  // the sections to be in the document, but rAF is a FRAME callback: a tab that is not
  // compositing never runs it, and the jump is swallowed exactly as the original bug
  // swallowed it. This runs on render instead, so it does not depend on a frame ever
  // being painted.
  React.useLayoutEffect(() => {
    if (!pendingJump || selectedProject) return;
    scrollToId(pendingJump);
    setPendingJump(null);
  }, [pendingJump, selectedProject]);

  // The header's Work / Background / Contact did nothing at all on a project page.
  // PrismApp renders PZProject INSTEAD of those sections, so they are not in the
  // document while a project is open: getElementById returned null and the click was
  // swallowed in silence. Leave the project first, then jump once the sections exist.
  const onJump = (id) => {
    if (selectedProject) { setPendingJump(id); navigate('home'); return; }
    scrollToId(id);
  };
  const onWork = () => onJump('pz-work');

  return (
    <div className="prism-root" style={{ background: PZ_PAPER, color: PZ_INK, fontFamily: PZ_SANS, minHeight: '100vh' }}>
      {/* The whole edition's ground, mounted once so it cannot be cut at a section
          edge. It sits on both the sectioned page and a case study, which is why it
          lives here rather than in either. */}
      <PZField mobile={mobile} fixed />
      {selectedProject
        ? <PZProject project={selectedProject} projects={projects} mobile={mobile} onSelect={selectProject} onBack={() => navigate('work')} onTop={onTop} openEditions={openEditions} onJump={onJump} />
        : (
          <React.Fragment>
            <PZHero mobile={mobile} openEditions={openEditions} onWork={onWork} onTop={onTop} onJump={onJump} />
            <PZWork projects={projects} mobile={mobile} onSelect={selectProject} />
            <PZBackground mobile={mobile} />
            <PZTools mobile={mobile} />
            <PZContact mobile={mobile} />
          </React.Fragment>
        )}
    </div>
  );
}
</script>
<script type="text/plain" id="broadside-src">
// ── BROADSIDE MODE ─────────────────────────────────────────────
// A poster, not a page. One statement owns the first screen at a size no other
// edition goes near, and everything under it is a ruled listing.
//
// The scale is the whole idea, so it is arithmetic rather than taste. In DM Serif
// Display at -0.04em, "I build things." measures 5.476x its own font-size, so the line
// that fills a sheet is (available width / 5.476). At 16.3vw that lands at 95-99% of
// the measure from a 390px phone to a 1920px desktop — measured in a browser at each
// width, not estimated. Change those words and that ratio changes with them.
//
// This was first drawn on a 1120x1240 artboard, which is PORTRAIT, and it did not
// survive contact with a real 1440x900 viewport: at the size that filled the sheet the
// line reached only 67% across a screen, which is a large headline rather than a
// poster. Landscape wanted the type BIGGER, not smaller.
//
// Motion is deliberately near-zero. This is a print idiom and print does not float:
// rules draw themselves in from the left, content rises once, nothing loops.
const BS_PAPER = '#f2f0eb', BS_INK = '#0a0a0a', BS_BODY = '#3a3a3a', BS_MUTE = '#6b6b6b';
const BS_SURFACE = '#e2e0db', BS_LINE = '#dddbd6';
const BS_DISPLAY = "'DM Serif Display', Georgia, serif";
const BS_MONO = "'JetBrains Mono', 'Fira Code', monospace";
const BS_EDGE = 'clamp(20px, 4vw, 56px)';
// The background sheet's hanging labels: the width of the margin they sit in, and the
// gap to the text. The headline is indented by their sum, so they are constants rather
// than two numbers written three times.
const BS_GUTTER = 118, BS_GUTTER_GAP = 38;
const BS_CHROME = '64px';

const bsReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function bsStyles() {
  if (document.getElementById('broadside-style')) return;
  const st = document.createElement('style');
  st.id = 'broadside-style';
  st.textContent = [
    '.broadside-root ::selection { background: #0a0a0a; color: #f2f0eb; }',
    '.broadside-root a, .broadside-root button { -webkit-tap-highlight-color: transparent; }',
    '.broadside-root a:focus-visible, .broadside-root button:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 3px; }',

    // RULE. A rule that draws itself is the only flourish here, and it is the one
    // motion that belongs to a printing idiom rather than a screen one. Default state
    // is DRAWN — without scroll-driven timelines the page is simply already set.
    '@keyframes bs-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }',
    '.bs-rule { transform-origin: 0 50%; }',

    // RISE. One move, 12px, no loop.
    '@keyframes bs-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }',
    '.bs-in { animation: bs-rise 620ms cubic-bezier(0.22,0.61,0.36,1) both; }',
    '.bs-d1 { animation-delay: 90ms; } .bs-d2 { animation-delay: 180ms; }',
    '@supports (animation-timeline: view()) { @media (prefers-reduced-motion: no-preference) {',
    // Both end at `entry 100%` for the reason given on Prism's .pz-rise: a cover-relative
    // end is unreachable for anything near the foot of the document, and the animation
    // then freezes partway. Here it was worse than a clipped card — the colophon's rule
    // is a 1px element at the very bottom of every sheet, so it sat at scaleX(0) and was
    // never drawn at all on background, the kit and contact.
    '  .bs-rule { animation: bs-draw linear both; animation-timeline: view(); animation-range: entry 10% entry 100%; }',
    '  .bs-riser { animation: bs-rise linear both; animation-timeline: view(); animation-range: entry 5% entry 100%; }',
    '} }',
    '@media (prefers-reduced-motion: reduce) { .broadside-root *, .broadside-root *::before { animation: none !important; transition: none !important; } }',

    // Rows used to answer a hover by fading to 55%, which reads as disabled rather than
    // as pointing at something — the one thing a hover must not say. The constraint that
    // produced it still holds (a filled row would be a card, and this edition does not
    // have one anywhere), so the rule under the entry thickens to ink instead: a ruled
    // index answering in its own grammar.
    //
    // An inset box-shadow rather than a thicker border, which would move every row below
    // it by a pixel, and rather than border-color, which the inline border on each row
    // would beat without !important. Nothing sets box-shadow inline, so it just wins.
    //
    // Not a transform either: .bs-row is also .bs-riser on the work sheet, whose entry
    // animation holds a transform under fill:both forever after, and an animation beats
    // a rule. A transform hover would work on the hero listing and silently do nothing
    // on the sheet the rows actually live on.
    '@media (hover: hover) {',
    '  .bs-row { transition: box-shadow 140ms ease; }',
    '  .bs-row:hover { box-shadow: inset 0 -2px 0 #0a0a0a; }',
    '}',

    // NUDGE — the one looping animation here, and it earns the exception. The first
    // sheet is exactly one viewport ending in a hard rule, so nothing bleeds past the
    // fold and the composition reads as finished: the next section starts 90px BELOW
    // the fold, which is to say invisibly. A closed poster needs to say it continues.
    '@keyframes bs-nudge { 0%,100% { transform: translateY(0); opacity: 0.75; } 50% { transform: translateY(3px); opacity: 1; } }',
    '.bs-nudge { animation: bs-nudge 2.4s ease-in-out infinite; }',
  ].join('\n');
  document.head.appendChild(st);
}

function BSLabel({ children, style }) {
  return (
    <span style={{
      fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em',
      color: BS_MUTE, textTransform: 'lowercase', ...(style || {}),
    }}>{children}</span>
  );
}

// The heavy rule under every section head.
//
// `draw` is opt-in, and deliberately so. view() measures an element against its own
// trip through the viewport, so a rule that is ALREADY on screen at load sits partway
// through its own entry range forever — the listings rule at the foot of the first
// sheet drew to about 45% and stopped there. Anything above the fold is therefore
// simply set, and only rules the reader actually scrolls to draw themselves in.
function BSRule({ weight, draw }) {
  return <div className={draw ? 'bs-rule' : undefined} style={{ height: weight || '3px', background: BS_INK, width: '100%' }} />;
}

// `full` makes the button fill its cell instead of shrinking to its label, which is what
// lets three buttons of different word lengths line up on a phone.
function BSButton({ children, onClick, href, newTab, primary, full }) {
  const base = {
    display: full ? 'flex' : 'inline-flex', width: full ? '100%' : undefined,
    alignItems: 'center', justifyContent: 'center', gap: '8px',
    minHeight: '44px', padding: '0 26px', borderRadius: '2px', boxSizing: 'border-box',
    fontFamily: BS_MONO, fontSize: '12px', letterSpacing: '0.08em', cursor: 'pointer',
    textDecoration: 'none', border: '1px solid ' + BS_INK,
    background: primary ? BS_INK : 'transparent',
    color: primary ? BS_PAPER : BS_INK,
  };
  if (href) return <a href={href} target={newTab ? '_blank' : undefined} rel={newTab ? 'noopener noreferrer' : undefined} style={base}>{children}</a>;
  return <button onClick={onClick} style={base}>{children}</button>;
}

// The nav navigates. Broadside used to be one long scroll with these as jump targets,
// which meant the poster sheet had five sections stacked under it and had to apologise
// for them with a "continued" mark. Each is its own sheet now, so the first screen is
// the whole of the home page and nothing is hidden below a fold that gave no sign of
// having anything below it.
function BSChrome({ mobile, onTop, openEditions, onNavigate, activePage, left, right }) {
  const nav = [['work', 'work'], ['background', 'about'], ['kit', 'tools'], ['contact', 'contact']];
  // This 1px rule stays, and it is the only one at the head of a sheet now. There were
  // two, 60px apart at different weights — this line and the section's 3px directly
  // under it — which read as one rule gone wrong rather than as two ranks. The section's
  // went, and the label row it underlined went with it.
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      gap: '16px', height: BS_CHROME, flexShrink: 0,
      borderBottom: '1px solid ' + BS_INK,
    }}>
      {/* The name only. This sits at the top of every sheet, so the location was being
          set on every screen to say something that does not change and that nobody
          navigates by. The nav beside it marks the current page, which is what actually
          says where you are.

          Checked rather than assumed: the colophon still prints "peter & co. ·
          rotterdam, nl" on work, background, the kit and contact. Home is the exception
          — it is one viewport ending in a hard rule and has no colophon, so the location
          now appears nowhere on the first sheet. That is the whole cost of this, and it
          is the sheet where a poster wants the fewest words on it anyway. */}
      {left || (
        <button onClick={onTop} style={{
          background: 'none', border: 'none', cursor: 'pointer', padding: '0 10px 0 0', minHeight: '44px',
          fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE, textAlign: 'left',
        }}>peter &amp; co.</button>
      )}
      {right || (
        <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? '2px' : '4px' }}>
          {mobile && nav.filter(n => n[1] !== 'work').map(n => (
            <button key={n[0]} onClick={() => onNavigate(n[1])} style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 6px',
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.06em',
              color: activePage === n[1] ? BS_INK : BS_MUTE,
            }}>{n[0] === 'background' ? 'bg' : n[0]}</button>
          ))}
          {!mobile && nav.map(n => (
            <button key={n[0]} onClick={() => onNavigate(n[1])} style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 9px',
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em',
              color: activePage === n[1] ? BS_INK : BS_MUTE,
              textDecoration: activePage === n[1] ? 'underline' : 'none', textUnderlineOffset: '5px',
            }}>{n[0]}</button>
          ))}
          <button onClick={openEditions} style={{
            background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 0 0 9px',
            fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_INK,
          }}>editions</button>
        </div>
      )}
    </div>
  );
}

// The sheet: the inset column every screen of this edition sits in.
function BSSheet({ children, full, style }) {
  return (
    <div style={{
      boxSizing: 'border-box', width: '100%', maxWidth: '1560px', margin: '0 auto',
      padding: '0 ' + BS_EDGE, minHeight: full ? '100svh' : undefined,
      display: 'flex', flexDirection: 'column', ...(style || {}),
    }}>{children}</div>
  );
}

// The statement. The two numbers below are measured, not chosen — see the note at the
// top of this blob for where 5.476 comes from.
//
// 16.1vw fills 96-99% of the measure while the sheet is still narrower than its cap.
// 264px is where that has to stop: the sheet maxes out at 1560px wide, so above a
// 1560px viewport the measure is a constant 1448px however wide the window gets, and
// 1448 / 5.476 = 264. Without that ceiling a 1920px window computed 313px and pushed
// the line 266px past the sheet.
//
// whiteSpace and textWrap are applied conditionally rather than as two keys with one
// set to undefined, and that is not tidiness. React writes an undefined style value as
// style.textWrap = '', which removes the text-wrap SHORTHAND — including
// text-wrap-mode, the half of `white-space: nowrap` that does the not-wrapping. The
// element kept white-space-collapse and silently wrapped anyway. It only showed up at
// 1920px, because below that the line happened to fit on its own.
function BSStatement({ children, size, maxWidth, nowrap, className }) {
  const st = {
    fontFamily: BS_DISPLAY, fontWeight: 400, margin: 0,
    fontSize: size || 'clamp(52px, 16.1vw, 264px)',
    lineHeight: nowrap ? 0.86 : 0.96, letterSpacing: '-0.04em',
    color: BS_INK, maxWidth: maxWidth,
  };
  if (nowrap) st.whiteSpace = 'nowrap';
  else st.textWrap = 'balance';
  return <h1 className={className} style={st}>{children}</h1>;
}

function BSListings({ projects, mobile, onSelect }) {
  const { theme } = useTheme();
  const list = projects.slice(0, 5);
  return (
    <div style={{ flexShrink: 0, paddingBottom: 'clamp(22px, 3vh, 34px)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', paddingBottom: '10px' }}>
        <BSLabel>the listings</BSLabel>
        <BSLabel>{String(list.length).padStart(2, '0')} entries · 2025&ndash;2026</BSLabel>
      </div>
      <BSRule />
      <div style={{
        display: 'grid', gap: mobile ? '0' : '20px', paddingTop: mobile ? '2px' : '14px',
        gridTemplateColumns: mobile ? '1fr' : 'repeat(' + list.length + ', minmax(0, 1fr))',
      }}>
        {list.map((p, i) => {
          const accent = fitAccent(resolveAccent(p, theme.id), BS_PAPER) || BS_INK;
          // Sanity's isPublic arrives as public:false. Every other edition honours it —
          // Volt prints "(soon)", Mondriaan fades the row, Prism and Grain withhold the
          // link — and Broadside was the one that did not, so it printed a live-looking
          // domain and a "visit the site" button for a site that is not up yet.
          const shipped = p.public !== false;
          return (
            <button key={p.id} className="bs-row" onClick={() => onSelect(p)} style={{
              background: 'none', border: 'none', padding: 0, cursor: 'pointer', textAlign: 'left',
              borderBottom: mobile && i < list.length - 1 ? '1px solid ' + BS_LINE : 'none',
              display: 'flex', flexDirection: mobile ? 'row' : 'column',
              alignItems: mobile ? 'center' : 'flex-start', gap: mobile ? '12px' : '5px',
              minHeight: mobile ? '46px' : undefined,
            }}>
              <span style={{ fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.1em', color: BS_MUTE, flexShrink: 0 }}>
                {String(i + 1).padStart(2, '0')}
              </span>
              <span style={{
                fontFamily: BS_DISPLAY, fontSize: mobile ? '19px' : 'clamp(17px, 1.5vw, 22px)',
                lineHeight: 1.05, letterSpacing: '-0.015em', color: BS_INK,
                flex: mobile ? 1 : undefined, minWidth: 0,
              }}>{p.title}</span>
              <span style={{
                display: 'inline-flex', alignItems: 'center', gap: '7px', minWidth: 0, maxWidth: '100%',
                fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.04em', color: BS_BODY,
              }}>
                <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accent, flexShrink: 0, opacity: shipped ? 1 : 0.4 }} />
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{shipped ? (p.url || (p.tags && p.tags[0]) || '') : 'not live yet'}</span>
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function BSHero({ projects, mobile, onSelect, onTop, openEditions, onNavigate, activePage }) {
  return (
    <BSSheet full>
      <BSChrome mobile={mobile} onTop={onTop} openEditions={openEditions} onNavigate={onNavigate} activePage={activePage} />
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center',
        gap: mobile ? '20px' : 'clamp(20px, 3vh, 34px)', minHeight: 0,
        padding: 'clamp(24px, 4vh, 48px) 0',
      }}>
        <BSStatement className="bs-in" nowrap>I build things.</BSStatement>
        <div className="bs-in bs-d1" style={{
          display: 'flex', flexDirection: mobile ? 'column' : 'row',
          alignItems: mobile ? 'flex-start' : 'flex-end',
          justifyContent: 'space-between', gap: mobile ? '22px' : '48px',
        }}>
          <span style={{
            fontFamily: BS_DISPLAY, fontSize: mobile ? 'clamp(24px, 7vw, 34px)' : 'clamp(30px, 4.8vw, 92px)',
            lineHeight: 1.0, letterSpacing: '-0.03em', color: BS_MUTE, textWrap: 'balance',
          }}>Sometimes they&rsquo;re useful.</span>
          <div style={{
            display: 'flex', alignItems: mobile ? 'center' : 'flex-end',
            gap: '20px', flexShrink: 0, flexWrap: 'wrap',
          }}>
            {!mobile && (
              <span style={{ fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE, lineHeight: 1.9 }}>
                product owner by day,<br />builder by night.
              </span>
            )}
            <BSButton primary href="mailto:peterreijm@live.nl">get in touch &rarr;</BSButton>
          </div>
        </div>
      </div>
      <BSListings projects={projects} mobile={mobile} onSelect={onSelect} />
    </BSSheet>
  );
}

// Every section below the fold is the same object: a label row, the heavy rule, then
// content. Nothing is ever boxed.
// No section head. It set the sheet's name over a 3px rule directly under a chrome that
// already carries the nav with the current page marked — so the name was the second thing
// on screen saying where you are, and its rule was the second bar within 60px. The
// chrome's line divides the sheet now and the body starts under it.
function BSSection({ id, children, mobile, page }) {
  return (
    <BSSheet style={{ paddingTop: page ? 'clamp(26px, 4vh, 44px)' : 'clamp(56px, 10vh, 130px)', flex: page ? 1 : undefined }}>
      <div id={id} />
      <div style={{
        paddingTop: mobile ? '28px' : '40px',
        // On a page sheet the body fills what is left, so a section can push something
        // to the foot. Content stays top-aligned by default, so the other sheets are
        // unaffected.
        flex: page ? 1 : undefined, display: page ? 'flex' : undefined,
        flexDirection: page ? 'column' : undefined,
        // Centred between the rule above and the colophon below, rather than hanging off
        // the rule with all the leftover paper at the foot. These sheets run 55-75% of
        // the height, so there was always a wedge of it down there.
        //
        // 'safe center' rather than 'center': on a short viewport centred content that
        // outgrows its box overflows BOTH ends, and the top end is unreachable — you
        // cannot scroll to it. The safe keyword falls back to flex-start at exactly that
        // point, so a laptop shows the top of the sheet instead of losing it.
        justifyContent: page && !mobile ? 'safe center' : undefined,
      }}>{children}</div>
    </BSSheet>
  );
}

function BSWork({ projects, mobile, onSelect }) {
  const { theme } = useTheme();
  return (
    <BSSection page id="bs-work" mobile={mobile}>
      {/* The rows used to spread down the sheet on space-between. That distributes the
          free space BETWEEN items, so the first row got none of it: Milk Me Not sat
          flush against the top with 0px above it while every other row was given 105px.
          One entry visibly tighter than the rest.
          A fixed gap instead. Every row gets the same air, and the list grows down the
          sheet as projects are added rather than being stretched to fill it — landing
          near 60% of the paper today, which reads as a list with room after it rather
          than one that ran out. */}
      <div style={{
        display: 'flex', flexDirection: 'column',
        gap: mobile ? undefined : 'clamp(24px, 3.4vh, 48px)',
      }}>
        {projects.map((p, i) => {
          const accent = fitAccent(resolveAccent(p, theme.id), BS_PAPER) || BS_INK;
          return (
            <button key={p.id} className="bs-row bs-riser" onClick={() => onSelect(p)} style={{
              background: 'none', border: 'none', borderBottom: '1px solid ' + BS_LINE,
              padding: mobile ? '20px 0' : '26px 0', cursor: 'pointer', textAlign: 'left',
              display: 'grid', gap: mobile ? '8px' : '28px', alignItems: 'baseline',
              gridTemplateColumns: mobile ? '1fr' : '48px minmax(0, 1.1fr) minmax(0, 1fr) 118px',
            }}>
              <span style={{ fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.1em', color: BS_MUTE }}>
                {String(i + 1).padStart(2, '0')}
              </span>
              <span style={{
                fontFamily: BS_DISPLAY, fontSize: mobile ? '26px' : 'clamp(24px, 2.8vw, 40px)',
                lineHeight: 1.02, letterSpacing: '-0.025em', color: BS_INK,
              }}>{p.title}</span>
              <span style={{ fontFamily: BS_MONO, fontSize: '11px', lineHeight: 1.75, color: BS_BODY, textWrap: 'pretty' }}>
                {p.description}
              </span>
              <span style={{
                display: 'inline-flex', alignItems: 'center', gap: '8px', minWidth: 0,
                fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.1em', color: BS_MUTE,
                justifySelf: mobile ? 'start' : 'end',
              }}>
                <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accent, flexShrink: 0, opacity: p.public !== false ? 1 : 0.4 }} />
                {p.public === false ? 'soon · ' + p.year : p.year}
              </span>
            </button>
          );
        })}
      </div>
    </BSSection>
  );
}

function BSBackground({ mobile }) {
  // Was five questions in a ruled list, carried over from Prism. They were the same
  // five on two editions, they said nothing about the person behind the work, and they
  // left the sheet short.
  //
  // The site already had a proper background and this edition was not using it: the
  // shared About page, in Peter's own words. So that is what this is now — his copy,
  // labelled and ruled in Broadside's idiom, not a story written to fill a page.
  const story = [
    ['the route', 'Background in plant science. Ended up in data. Now doing product. None of it was planned, just curiosity pointing in the right direction.'],
    ['the method', 'I explore ideas by building them. Curious about the tech, focused on the output. These projects are the random ideas that would not leave me alone.'],
    ['off screen', 'Running roads, mountain biking trails, keeping plants alive, or tracking down rare draft beers one check-in at a time.'],
    ['the point', 'Sometimes something useful comes out of it.'],
  ];
  // The headline and its standfirst are gone. "Not a studio. Just me." plus a paragraph
  // about wanting to build things was the sheet introducing itself before saying
  // anything, and the four parts below it already say all of it — the route says he was
  // not trained for this, the method says he builds to find out. An introduction to
  // four sentences is longer than the four sentences.
  //
  // Which leaves them as the whole page, so they are set at reading size rather than as
  // captions under something larger.
  //
  // The meta is the name, and it is the one fact on this sheet that appears nowhere else
  // on the site — where the location is not, since the colophon at the foot of every
  // sheet carries rotterdam already. It read "not a studio · just me" while that was the
  // statement directly beneath it, which was the sheet saying the same thing twice; both
  // the statement and the column that held a byline under it are gone now.
  return (
    <BSSection page id="bs-background" mobile={mobile}>
      {/* A leader column, not two columns. The split sheet kept posing the same
          problem from both sides: one half always ran out of words before the other ran
          out of paper, and every fix was a way of hiding that. So there is one measure
          now, set in from the left, with the labels hanging in the margin beside the
          text they name — the page furniture of a long read rather than a layout.

          The gutter and its gap are constants because the headline is indented by
          exactly their sum. That is what puts the statement on the same left edge as
          every paragraph under it, with only the labels breaking out of it. Two
          literals would drift the first time either changed. */}
      <div className="bs-riser" style={{
        display: 'flex', flexDirection: 'column',
        gap: mobile ? '30px' : 'clamp(30px, 4.4vh, 58px)',
        marginLeft: mobile ? undefined : 'clamp(0px, 5vw, 96px)',
        maxWidth: mobile ? undefined : '880px',
        paddingTop: mobile ? undefined : 'clamp(8px, 3vh, 40px)',
      }}>
        {/* No rules between the parts. The hanging labels already divide them, and a
            rule as well would be the ruled index from the work sheet wearing a margin.
            The masthead rule at the top of the sheet keeps the edition's grammar. */}
        {story.map(row => (
          <div key={row[0]} style={{
            display: 'grid',
            gridTemplateColumns: mobile ? '1fr' : BS_GUTTER + 'px minmax(0, 58ch)',
            columnGap: BS_GUTTER_GAP + 'px', rowGap: '8px',
          }}>
            {/* Nudged down to sit on the first line of its paragraph rather than on the
                top of the box: 10px mono against a 25px serif do not share a first
                baseline on their own. */}
            <BSLabel style={{ paddingTop: mobile ? undefined : '10px' }}>{row[0]}</BSLabel>
            <span style={{
              fontFamily: BS_DISPLAY, fontSize: mobile ? '21px' : 'clamp(21px, 2vw, 29px)',
              lineHeight: 1.4, letterSpacing: '-0.015em', color: BS_INK, textWrap: 'pretty',
            }}>{row[1]}</span>
          </div>
        ))}
      </div>
    </BSSection>
  );
}

// The shelves read as small print rather than as a page: 18px names over 10px
// descriptions, filling 59% of the sheet. Sizes go up on desktop only — the phone is a
// single column where the same type is already right for its measure.
//
// The category heads are gone — each column opened with its name over a 1px ink rule,
// which was three more labels and three more bars on a sheet already being stripped of
// both. The columns still group by category, and cat.label still keys them; the grouping
// is just not announced any more.
//
// What that costs: nothing on the page now says why these three columns are three
// columns. The tools are ordered by category and read as a sensible run either way, but
// "build" / "infrastructure" / "craft" was the only thing naming the shelves.
function BSTools({ mobile }) {
  const cats = TOOL_CATEGORIES;
  return (
    <BSSection page id="bs-tools" mobile={mobile}>
      <div style={{
        display: 'grid', gap: mobile ? '32px' : '40px',
        gridTemplateColumns: mobile ? '1fr' : 'repeat(' + Math.min(cats.length, 3) + ', minmax(0, 1fr))',
      }}>
        {cats.map(cat => (
          <div key={cat.label} className="bs-riser" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
            <div style={{ display: 'flex', flexDirection: 'column' }}>
              {cat.tools.map((t, i) => (
                <div key={t.name} style={{
                  display: 'flex', flexDirection: 'column', gap: '5px', padding: mobile ? '11px 0' : '14px 0',
                  borderBottom: i < cat.tools.length - 1 ? '1px solid ' + BS_LINE : 'none',
                  opacity: t.status === 'retired' ? 0.55 : 1,
                }}>
                  <span style={{ display: 'flex', alignItems: 'baseline', gap: '8px', flexWrap: 'wrap' }}>
                    <span style={{ fontFamily: BS_DISPLAY, fontSize: mobile ? '18px' : '23px', lineHeight: 1.15, letterSpacing: '-0.015em', color: BS_INK }}>{t.name}</span>
                    {t.status === 'retired' ? <BSLabel style={{ fontSize: '9px' }}>retired</BSLabel> : null}
                  </span>
                  <span style={{ fontFamily: BS_MONO, fontSize: mobile ? '10px' : '11.5px', lineHeight: 1.7, color: BS_BODY, textWrap: 'pretty' }}>{t.desc}</span>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </BSSection>
  );
}

function BSContact({ mobile }) {
  const links = [
    ['github', 'https://github.com/preijm', true],
    ['linkedin', 'https://www.linkedin.com/in/peter-reijm-47165b5b/', true],
  ];
  // This sheet had 394px of nothing under it. A facts grid was tried here and taken back
  // out — it filled the space but it turned the one page whose whole job is "write to
  // me" into a page of admin. The edition already has a way to fill a sheet, and it is
  // the way the home sheet does it: put the type up. So the question is set at poster
  // scale rather than propped up by a second block.
  return (
    <BSSection page id="bs-contact" mobile={mobile}>
      <div className="bs-riser" style={{
        display: 'flex', flexDirection: 'column', gap: '22px', alignItems: 'flex-start',
        // Centred rather than stacked at the top, so the leftover paper is shared above
        // and below instead of all falling to the foot. On mobile too now — the sheet is
        // a full viewport there as well, so top-aligning it left the same wedge of empty
        // space under the buttons that it did on desktop.
        flex: 1, justifyContent: 'center',
      }}>
        {/* "open to a good problem" was the meta on the old section head and went with it.
            It is back as this sheet's eyebrow, which is a better place for it than a
            masthead: it is a standing status, not a page name.
            The paragraph's closing sentence went the other way. It read "I am always up
            for a good problem", which is this line said a second time eighteen words
            later — and with the eyebrow restored the page would have made the same offer
            three times counting the headline. */}
        <BSLabel>open to a good problem</BSLabel>
        {/* No 12ch cap at any size. ch scales with the font, so the cap was the same
            measure in characters everywhere — but the column it sits in does not scale
            with it, and the cap came out narrower than the column at every width:
            203 of 335 on a phone, 848 of 1178 at 1280, 1145 of 1448 at 1920. The
            question broke over three lines each time with "worth" stranded alone on the
            middle one.
            The worry the cap answered does not apply to this string: at 190px it
            measures about 2300px, so it cannot fit one line of a 1448px column however
            wide the sheet gets. textWrap: balance splits it over two everywhere. */}
        <BSStatement size={mobile ? 'clamp(32px, 9vw, 46px)' : 'clamp(46px, 11vw, 190px)'}>
          Got a problem worth building?
        </BSStatement>
        <span style={{ fontFamily: BS_MONO, fontSize: '11px', lineHeight: 1.9, color: BS_BODY, maxWidth: '44ch', textWrap: 'pretty' }}>
          Work, a collaboration, or just a sharp idea worth chasing.
        </span>
        {/* On a phone: a two-column grid with the primary spanning both, so it sits over
            github and linkedin and measures exactly as wide as the pair of them. Wrapping
            a flex row did that badly — the three buttons are 22, 6 and 8 characters, so
            they broke into ragged rows of whatever happened to fit. Desktop keeps the
            single row, where three different widths side by side is the point. */}
        <div style={{
          display: mobile ? 'grid' : 'flex',
          gridTemplateColumns: mobile ? '1fr 1fr' : undefined,
          gap: '10px', flexWrap: mobile ? undefined : 'wrap',
          marginTop: '4px', width: mobile ? '100%' : undefined,
        }}>
          <div style={{ gridColumn: mobile ? '1 / -1' : undefined, display: 'flex' }}>
            <BSButton primary full={mobile} href="mailto:peterreijm@live.nl">start a conversation &rarr;</BSButton>
          </div>
          {links.map(l => <BSButton key={l[0]} full={mobile} href={l[1]} newTab={l[2]}>{l[0]}</BSButton>)}
        </div>
      </div>
    </BSSection>
  );
}

function BSColophon({ mobile }) {
  return (
    <BSSheet style={{ paddingTop: 'clamp(48px, 8vh, 96px)', paddingBottom: 'clamp(24px, 4vh, 40px)' }}>
      {/* No `draw` here, and widening the range would not have rescued it. A view()
          timeline needs a scroller to advance, and most sheets in this edition fit the
          viewport exactly and never scroll — so this rule, the last element on the page,
          sat at scaleX(0) and was simply never drawn. Same rule as above the fold: a
          line the reader does not scroll to is set, not animated. */}
      <BSRule weight="1px" />
      <div style={{
        display: 'flex', flexDirection: 'row', gap: '10px',
        justifyContent: 'space-between', paddingTop: '18px',
      }}>
        {/* Same fix as Prism's footer, with two differences. Both halves already carry
            middots, so joining them whole would make a chain of four. And "peter & co."
            is already in the chrome at the top of every sheet, so the colophon repeating
            it is duplication rather than information — dropped, which also takes the
            line from 311px to about 213px and stops it wrapping on a 320px phone. */}
        {mobile ? (
          <BSLabel>rotterdam, nl &middot; broadside v1</BSLabel>
        ) : (
          <React.Fragment>
            <BSLabel>broadside · edition v1</BSLabel>
            <BSLabel>peter &amp; co. · rotterdam, nl</BSLabel>
          </React.Fragment>
        )}
      </div>
    </BSSheet>
  );
}

// What building it cost, in the same furniture the particulars are set in: a
// lowercase head, a 3px rule, and the same four-column label-over-serif grid.
//
// It gets its own sheet rather than joining the particulars on the opening one.
// That sheet is 100svh with the hero on flex:1 and the particulars pinned under
// it at flexShrink:0, so anything added inside it comes straight out of the
// headline's height on a short screen. BroadsideApp already says how this
// edition handles a new block — everything the old scroll held now has its own
// sheet — so this follows that rather than compressing the poster.
//
// Renders nothing until footprint.json resolves, and nothing for a project with
// no entry, which is every project the extractor's allowlist does not publish.
function BSReckoning({ project, mobile }) {
  const fp = footprintFor(project);
  if (!fp) return null;

  const c = fp.coverage || {};
  const pct = typeof c.commitCoveragePct === 'number' ? c.commitCoveragePct : null;
  // 0% means not one commit falls inside the measured window, so the figures
  // describe a later visit rather than the build. Same call the other two
  // editions make: drop them, and say why in the line underneath.
  const noRecord = pct === 0;
  const mixed = !!(fp.combined && fp.manualSources && fp.manualSources.length);
  const prompts = (fp.combined ? fp.combined.prompts : fp.measured.prompts) || 0;

  // Prompts is the only figure that spans both tools, so where a hand-counted
  // source did most of the work the hours and tokens are dropped rather than set
  // beside it at equal weight. Months comes from git and covers either case.
  const facts = noRecord
    ? [['measured', '0%']]
    : (mixed
        ? [['prompts', prompts.toLocaleString('en-US')], ['months', String(spanMonths(fp))], ['measured in cc', pct === null ? '—' : pct + '%']]
        : [['prompts', prompts.toLocaleString('en-US')], ['hours', String(fp.measured.activeHours)], ['tokens out', fmtTokens(fp.tokens.output)], ['measured', pct === null ? '—' : pct + '%']]);

  return (
    <BSSheet style={{ paddingTop: 'clamp(40px, 7vh, 90px)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', paddingBottom: '10px' }}>
        <BSLabel>the reckoning</BSLabel>
        <BSLabel>{noRecord ? 'no measured record' : 'a floor, never a total'}</BSLabel>
      </div>
      <BSRule />
      <div style={{
        display: 'grid', gap: mobile ? '0' : '18px', paddingTop: mobile ? '2px' : '14px',
        gridTemplateColumns: mobile ? '1fr' : 'repeat(' + facts.length + ', minmax(0, 1fr))',
      }}>
        {facts.map((f, i) => (
          <div key={f[0]} style={{
            display: 'flex', flexDirection: mobile ? 'row' : 'column',
            justifyContent: mobile ? 'space-between' : undefined,
            alignItems: mobile ? 'baseline' : 'flex-start', gap: mobile ? '16px' : '6px',
            padding: mobile ? '11px 0' : 0,
            borderBottom: mobile && i < facts.length - 1 ? '1px solid ' + BS_LINE : 'none',
          }}>
            <BSLabel style={{ flexShrink: 0 }}>{f[0]}</BSLabel>
            <span style={{
              fontFamily: BS_DISPLAY, fontSize: mobile ? '17px' : '20px', lineHeight: 1.15,
              letterSpacing: '-0.015em', color: BS_INK, textAlign: mobile ? 'right' : 'left',
            }}>{f[1]}</span>
          </div>
        ))}
      </div>

      {/* This edition is built from rules, so the meter is a rule that is only
          partly drawn rather than a bar with a fill. Black on the same hairline
          grey every other line here uses — no red, no green: a thin record is a
          fact about the archive, not a grade. */}
      {pct !== null && (
        <div
          role="img"
          aria-label={`${pct}% of this project's commits fall inside the measured window`}
          style={{ height: '2px', background: BS_LINE, marginTop: mobile ? '16px' : '20px' }}>
          <div style={{ width: pct + '%', height: '100%', background: BS_INK }} />
        </div>
      )}

      {/* Not lowercased. This edition sets its labels lowercase — "the
          particulars", "the plate" — but its body prose keeps its capitals, the
          way the kit's tool descriptions do. Folding the sentence down would
          take "Claude Code" and "Lovable" with it. */}
      <p style={{
        fontFamily: BS_MONO, fontSize: '10px', lineHeight: 1.9, color: BS_BODY,
        margin: '14px 0 0', maxWidth: '66ch',
      }}>{footprintCaveat(fp)}</p>
    </BSSheet>
  );
}

function BSProject({ project, projects, mobile, onSelect, onBack, openEditions, onJump }) {
  const { theme } = useTheme();
  const p = project;
  const accent = fitAccent(resolveAccent(p, theme.id), BS_PAPER) || BS_INK;
  const idx = projects.findIndex(x => x.id === p.id);
  const next = projects[(idx + 1) % projects.length];
  const kind = (p.tags && p.tags[0]) || 'project';
  // A project NAME cannot carry a sheet — it is a label, not a statement. The tagline
  // can, and these were written as statements already, so the name drops to a masthead
  // line and the tagline takes the scale.
  const statement = p.tagline || p.description;
  const shipped = p.public !== false;   // Sanity's isPublic
  const live = shipped && !!p.href;      // shipped AND somewhere to send you
  // Sanity puts the real pixel dimensions in the filename, so the plate's box can be
  // reserved before the image loads. Without this the img has no height until it
  // arrives: the whole project page measured 278px of scroll range, the "the plate"
  // cue scrolled to a plate that was not there yet, and everything below jumped when
  // it finally decoded. Falls back to 16/9, which is what every screenshot here is.
  const plateDims = (p.screenshot || '').match(/-(\d+)x(\d+)\.[a-z]+/i);
  const plateRatio = plateDims ? (plateDims[1] + ' / ' + plateDims[2]) : '16 / 9';
  // The last fact is the one that has to be honest: a domain here reads as somewhere
  // you can go. Matches Prism's wording so the two light editions agree.
  const facts = [
    ['role', p.role || '—'],
    ['year', p.year || '—'],
    ['stack', (p.stack || []).slice(0, 3).join(', ') || '—'],
    shipped ? ['site', p.url || '—']
            : ['status', 'In progress, not public yet'],
  ];
  return (
    <React.Fragment>
      <BSSheet full>
        <BSChrome
          mobile={mobile}
          activePage="work"
          left={<button onClick={onBack} style={{
            background: 'none', border: 'none', cursor: 'pointer', padding: '0 10px 0 0', minHeight: '44px',
            fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE,
          }}>&larr; all work</button>}
          right={<div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
            {!mobile && <BSLabel style={{ padding: '0 9px' }}>{String(idx + 1).padStart(2, '0')} / {String(projects.length).padStart(2, '0')} · {kind}</BSLabel>}
            <button onClick={openEditions} style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 0 0 9px',
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_INK,
            }}>editions</button>
          </div>}
        />

        <div style={{ display: 'flex', alignItems: 'baseline', gap: '16px', paddingTop: 'clamp(20px, 3vh, 30px)' }}>
          <span style={{ fontFamily: BS_DISPLAY, fontSize: mobile ? '24px' : 'clamp(26px, 2.6vw, 38px)', lineHeight: 1.0, letterSpacing: '-0.02em', color: BS_INK }}>{p.title}</span>
          <span style={{ flex: 1, height: '1px', background: BS_LINE }} />
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', flexShrink: 0 }}>
            <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: accent }} />
            <BSLabel>{p.year}</BSLabel>
          </span>
        </div>

        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: 'clamp(28px, 5vh, 60px) 0', minHeight: 0, gap: 'clamp(24px, 4vh, 40px)',
        }}>
          <BSStatement
            className="bs-in"
            // The home sheet fills 97% of its measure; at 5.8vw this filled 46%, which
            // made the project page a quieter design rather than the same one. Sized
            // up until the longest of the five taglines still clears a 900px viewport.
            size={mobile ? 'clamp(32px, 9.2vw, 46px)' : 'clamp(42px, 7.6vw, 132px)'}
            maxWidth="15ch"
          >{statement}</BSStatement>
          <div className="bs-in bs-d1" style={{
            display: 'flex', flexDirection: mobile ? 'column' : 'row',
            alignItems: mobile ? 'flex-start' : 'flex-end',
            justifyContent: 'space-between', gap: mobile ? '22px' : '44px',
          }}>
            <span style={{ fontFamily: BS_MONO, fontSize: '11px', lineHeight: 1.9, color: BS_BODY, maxWidth: '48ch', textWrap: 'pretty' }}>
              {p.detail || p.description}
            </span>
            {live ? <BSButton primary href={p.href} newTab>visit the site &rarr;</BSButton> : null}
          </div>
        </div>

        <div style={{ flexShrink: 0, paddingBottom: 'clamp(22px, 3vh, 34px)' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', paddingBottom: '10px' }}>
            <BSLabel>the particulars</BSLabel>
            {/* Both branches carry minHeight 44. The "next ·" button had it and the plate
                cue did not, so the foot of a case study was a 44px control or a 13px one
                depending on which project you happened to be reading. The comment lives
                out here because a ternary branch takes one expression and nothing else. */}
            {p.screenshot ? (
              <button onClick={() => onJump('bs-plate')} className="bs-row bs-nudge" style={{
                background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: 0,
                fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_INK, textAlign: 'right',
              }}>the plate &darr;</button>
            ) : (
              <button onClick={() => onSelect(next)} className="bs-row" style={{
                background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: 0,
                fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE, textAlign: 'right',
              }}>next · {next.title.toLowerCase()} &rarr;</button>
            )}
          </div>
          <BSRule />
          <div style={{
            display: 'grid', gap: mobile ? '0' : '18px', paddingTop: mobile ? '2px' : '14px',
            gridTemplateColumns: mobile ? '1fr' : 'repeat(4, minmax(0, 1fr))',
          }}>
            {facts.map((f, i) => (
              <div key={f[0]} style={{
                display: 'flex', flexDirection: mobile ? 'row' : 'column',
                justifyContent: mobile ? 'space-between' : undefined,
                alignItems: mobile ? 'baseline' : 'flex-start', gap: mobile ? '16px' : '6px',
                padding: mobile ? '11px 0' : 0,
                borderBottom: mobile && i < facts.length - 1 ? '1px solid ' + BS_LINE : 'none',
              }}>
                <BSLabel style={{ flexShrink: 0 }}>{f[0]}</BSLabel>
                <span style={{
                  fontFamily: BS_DISPLAY, fontSize: mobile ? '17px' : '20px', lineHeight: 1.15,
                  letterSpacing: '-0.015em', color: BS_INK, textAlign: mobile ? 'right' : 'left',
                }}>{f[1]}</span>
              </div>
            ))}
          </div>
        </div>
      </BSSheet>

      {/* The evidence, deliberately BELOW the poster sheet. A screenshot beside the
          statement would kill the scale contrast the whole edition runs on; after it,
          that costs nothing — and a portfolio that never shows the work is the worse
          trade of the two. */}
      {p.screenshot ? (
        <BSSheet style={{ paddingTop: 'clamp(40px, 7vh, 90px)' }}>
          <div id="bs-plate" />
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', paddingBottom: '10px' }}>
            <BSLabel>the plate</BSLabel>
            <button onClick={() => onSelect(next)} className="bs-row" style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: 0,
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE, textAlign: 'right',
            }}>next · {next.title.toLowerCase()} &rarr;</button>
          </div>
          <BSRule weight="1px" draw />
          {/* Sized through the CDN rather than shipping the 3840px original into a
              1448px slot — the plate is the heaviest thing this edition loads. */}
          <img className="bs-riser" src={typeof sanityImg === 'function' ? sanityImg(p.screenshot, 1600) : p.screenshot} alt={p.title} loading="lazy" decoding="async" style={{
            width: '100%', height: 'auto', aspectRatio: plateRatio, display: 'block', marginTop: '18px',
            border: '1px solid ' + BS_LINE, background: BS_SURFACE,
          }} />
        </BSSheet>
      ) : null}

      <BSReckoning project={p} mobile={mobile} />

      <BSColophon mobile={mobile} />
    </React.Fragment>
  );
}

function BroadsideApp({ page, selectedProject, navigate, selectProject, activePage }) {
  const mobile = useMobile();
  const { openEditions } = useTheme();
  const projects = PROJECTS;

  React.useEffect(() => { bsStyles(); }, []);
  React.useEffect(() => { window.scrollTo({ top: 0, behavior: bsReduced() ? 'auto' : 'smooth' }); }, [selectedProject && selectedProject.id]);

  const onTop = () => navigate('home');
  const onJump = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: bsReduced() ? 'auto' : 'smooth', block: 'start' });
  };
  const shell = { background: BS_PAPER, color: BS_INK, fontFamily: BS_MONO, minHeight: '100svh', display: 'flex', flexDirection: 'column' };

  if (selectedProject) {
    return (
      <div className="broadside-root" style={shell}>
        <BSProject project={selectedProject} projects={projects} mobile={mobile} onSelect={selectProject} onBack={() => navigate('work')} openEditions={openEditions} onJump={onJump} />
      </div>
    );
  }

  // Home is the poster and nothing else: exactly one screen, no scroll, because the
  // sheet IS the page. Everything the old scroll held now has its own sheet, reached
  // from the chrome.
  if (page === 'home') {
    return (
      <div className="broadside-root" style={shell}>
        <BSHero projects={projects} mobile={mobile} onSelect={selectProject} onTop={onTop} openEditions={openEditions} onNavigate={navigate} activePage={activePage} />
      </div>
    );
  }

  return (
    <div className="broadside-root" style={shell}>
      <BSSheet>
        <BSChrome mobile={mobile} onTop={onTop} openEditions={openEditions} onNavigate={navigate} activePage={activePage} />
      </BSSheet>
      {page === 'work'    && <BSWork projects={projects} mobile={mobile} onSelect={selectProject} />}
      {page === 'about'   && <BSBackground mobile={mobile} />}
      {page === 'tools'   && <BSTools mobile={mobile} />}
      {page === 'contact' && <BSContact mobile={mobile} />}
      <BSColophon mobile={mobile} />
    </div>
  );
}
</script>
</body>
</html>
