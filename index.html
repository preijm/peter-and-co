}

function useRotterdamTime() {
  const fmt = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' });
  const [time, setTime] = React.useState(fmt);
  React.useEffect(() => {
    const id = setInterval(() => setTime(fmt()), 10000);
    return () => clearInterval(id);
  }, []);
  return time;
}

// Static, near-flat backdrop — one faint lime bloom. No canvas, no motion.
function VBackdrop() {
  return (
    <div aria-hidden="true" style={{
      position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none',
      background: 'radial-gradient(70vw 70vh at 84% 6%, rgba(212,249,50,0.055), transparent 55%), radial-gradient(60vw 60vh at 6% 102%, rgba(242,240,230,0.02), transparent 55%), ' + V_BG,
    }} />
  );
}

// Scroll-reactive Three.js point field — a faint depth layer behind the content.
// Camera travels + the field rotates with scroll progress; near-monochrome with a few lime motes.
function VParticles({ mobile }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (vReduced()) return;
    let stop = false, raf = 0, dispose = () => {};
    vLoadThree().then(THREE => {
      if (stop || !ref.current || !THREE) return;
      const el = ref.current;
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(el.clientWidth, el.clientHeight);
      el.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, el.clientWidth / el.clientHeight, 0.1, 120);
      camera.position.z = 24;

      const N = mobile ? 700 : 1700;
      const spread = 38, depth = 70;
      const positions = new Float32Array(N * 3);
      const colors = new Float32Array(N * 3);
      const cInk = new THREE.Color('#cbc8bb'), cLime = new THREE.Color('#d4f932');
      for (let i = 0; i < N; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * spread * 1.8;
        positions[i * 3 + 1] = (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = -Math.random() * depth;
        const c = Math.random() < 0.07 ? cLime : cInk;
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: mobile ? 0.07 : 0.055, vertexColors: true, transparent: true, opacity: 0.6,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);

      let targetScroll = window.scrollY || 0, curScroll = targetScroll, simT = 0, last = performance.now();
      // Pointer parallax — the field eases toward the cursor for an interactive depth.
      let ptrX = 0, ptrY = 0, curPX = 0, curPY = 0;
      const onScroll = () => { targetScroll = window.scrollY || 0; };
      const onPointer = (e) => {
        ptrX = (e.clientX / window.innerWidth) - 0.5;
        ptrY = (e.clientY / window.innerHeight) - 0.5;
      };
      const onResize = () => {
        camera.aspect = el.clientWidth / el.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(el.clientWidth, el.clientHeight);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('pointermove', onPointer, { passive: true });
      window.addEventListener('resize', onResize);

        if (stop) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (document.visibilityState === 'visible') {
          simT += dt;
          curScroll += (targetScroll - curScroll) * 0.06;
          curPX += (ptrX - curPX) * 0.045;
          curPY += (ptrY - curPY) * 0.045;
          const docH = Math.max(1, document.body.scrollHeight - window.innerHeight);
          const prog = Math.min(1, curScroll / docH);
          points.rotation.y = simT * 0.02 + prog * 1.1 + curPX * 0.32;
          points.rotation.x = prog * 0.4 + curPY * 0.22;
          camera.position.z = 24 - prog * 15;
          camera.position.x = Math.sin(simT * 0.1) * 0.5 + curPX * 6;
          camera.position.y = -curPY * 4;
          camera.lookAt(0, 0, -20);
          mat.opacity = 0.5 + prog * 0.3;
          renderer.render(scene, camera);
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);

      dispose = () => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('pointermove', onPointer);
        window.removeEventListener('resize', onResize);
        cancelAnimationFrame(raf);
        geo.dispose(); mat.dispose(); renderer.dispose();
        if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      };
    }).catch(() => {});
    return () => { stop = true; dispose(); };
  }, [mobile]);
  return <div ref={ref} aria-hidden="true" style={{ position: 'fixed', inset: 0, zIndex: -1, pointerEvents: 'none' }} />;
}

// Interactive shell — a real command line in the hero. Type 'help' to explore.
function VTerminal({ projects, mobile }) {
  const { openEditions } = useTheme();
  const [history, setHistory] = React.useState([]);
  const [value, setValue] = React.useState('');
  const [stack, setStack] = React.useState([]); // command recall buffer
  const [si, setSi] = React.useState(-1);
  const inputRef = React.useRef(null);
  const historyRef = React.useRef(null);

  const run = (raw) => {
    const cmd = raw.trim();
    setValue('');
    if (!cmd) return;
    setStack(s => [...s, cmd]); setSi(-1);
    const [name, ...args] = cmd.split(/\s+/);
    const n = name.toLowerCase();
    let a = [];
    if (n === 'help') {
      a = ['available commands:',
           '  whoami       who is this',
           '  projects     list the work        (alias: ls)',
           '  open <n>     open project n in a new tab',
           '  background   the short story       (alias: about)',
           '  stack        what i build with',
           '  contact      how to reach me',
           '  editions     switch site edition   (alias: theme)',
           '  clear        clear the screen'];
    } else if (n === 'whoami') {
      a = ['peter reijm, product owner by day, builder the rest of the time.',
           'not a developer: i bring the ideas and the taste; AI handles the code.'];
    } else if (n === 'ls' || n === 'projects') {
      a = [projects.length + ' projects:'];
      projects.forEach((p, idx) => a.push('  ' + String(idx + 1).padStart(2, '0') + '  ' + p.title + ' \u00b7 ' + (p.tagline || (p.tags || []).join(' · ')) + (p.public !== false && p.href ? '  ↗' : '  (soon)')));
      a.push("→ type 'open <n>' to visit one");
    } else if (n === 'open') {
      const idx = parseInt(args[0], 10);
      const p = projects[idx - 1] || projects.find(x => x.id === (args[0] || '').toLowerCase());
      if (!p) a = ["no such project. try 'projects'"];
      else if (p.public === false || !p.href) a = [p.title + " isn't live yet. coming soon."];
      else { a = ['opening ' + p.title + ' → ' + p.href]; window.open(p.href, '_blank', 'noopener'); }
    } else if (n === 'about' || n === 'background') {
      a = ["i've wanted to build things forever. i just never wanted to learn to write the code.",
           'AI changed that. a personal lab of experiments, running on nights and weekends.'];
    } else if (n === 'stack') {
      a = ['build:  claude · lovable · stitch',
           'infra:  github · supabase · netlify · mapbox',
           'make:   a 3d printer, for turning files into things'];
    } else if (n === 'contact') {
      a = ['email     peterreijm@live.nl',
           'github    github.com/preijm',
           'linkedin  /in/peter-reijm'];
    } else if (n === 'editions' || n === 'theme') {
      a = ['opening editions…']; openEditions();
    } else if (n === 'clear') {
      setHistory([]); return;
    } else if (n === 'sudo') {
      a = ["nice try, you don't have root here :)"];
    } else {
      a = ['command not found: ' + name + ". try 'help'"];
    }
    setHistory(h => [...h.slice(-5), { q: cmd, a }]);
  };

  const onKey = (e) => {
    if (e.key === 'Enter') { run(value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!stack.length) return; const ni = si < 0 ? stack.length - 1 : Math.max(0, si - 1); setSi(ni); setValue(stack[ni]); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (si < 0) return; const ni = si + 1; if (ni >= stack.length) { setSi(-1); setValue(''); } else { setSi(ni); setValue(stack[ni]); } }
  };

  // Output area has a fixed height (below) so new commands never grow the hero
  // and shift the rest of the page — it scrolls internally instead, jumping to
  // the newest line on each command.
  React.useEffect(() => {
    if (historyRef.current) historyRef.current.scrollTop = historyRef.current.scrollHeight;
  }, [history]);

  const mono = { fontFamily: V_MONO, fontSize: mobile ? '12px' : '13px', letterSpacing: '0.02em', lineHeight: 1.7 };
  const prompt = <span style={{ color: V_LIME }}>peter@rotterdam:~$</span>;
  return (
    <div className="v-fade" onClick={() => inputRef.current && inputRef.current.focus()} style={{ cursor: 'text', maxWidth: mobile ? '100%' : '720px' }}>
      <div style={{ ...mono, display: 'flex', alignItems: 'center', gap: '8px', color: V_FAINT }}>
        <span aria-hidden="true" style={{ width: '6px', height: '6px', borderRadius: '50%', background: V_LIME, display: 'inline-block' }} />
        available for good problems
      </div>
      {/* History + the live input line share one scrolling region, input last —
          so output appears right below what you typed, like a real terminal,
          and the whole thing auto-scrolls together. Fixed height, always
          rendered (even empty), so nothing ever shifts the rest of the page. */}
      <div ref={historyRef} className="v-term-scroll" style={{
        // Fixed so a typed command scrolls inside this box instead of growing the hero
        // and shoving the page down. 150px was the desktop number reused on mobile,
        // where it reserved seven lines nobody had typed yet — a fifth of the viewport
        // standing empty between the prompt and the headline.
        //
        // So on a phone it reserves three lines while idle, which is what almost every
        // visitor ever sees, and opens to seven the moment someone actually runs
        // something. Growing on a keystroke the reader just made is a response, not the
        // unbidden reflow the fixed height exists to prevent — and it grows into slack
        // the hero already has, so the footer stays put and nothing below moves.
        ...mono, marginTop: '14px',
        height: mobile ? (history.length ? '150px' : '62px') : '190px',
        transition: 'height 260ms cubic-bezier(0.2,0.7,0.2,1)',
        overflowY: 'auto', overflowX: 'hidden',
      }}>
        {history.map((h, i) => (
          <div key={i} style={{ marginBottom: '8px' }}>
            <div style={{ color: V_INK }}>{prompt} {h.q}</div>
            {h.a.map((line, j) => <div key={j} style={{ color: V_MUTE, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{line}</div>)}
          </div>
        ))}
        <div style={{ display: 'flex', alignItems: 'center', color: V_INK }}>
          <span style={{ marginRight: '8px', flexShrink: 0 }}>{prompt}</span>
          <input
            ref={inputRef} value={value} onChange={e => setValue(e.target.value)} onKeyDown={onKey}
            spellCheck={false} autoComplete="off" autoCapitalize="off" autoCorrect="off"
            aria-label="terminal command input"
            placeholder="try: help, projects, contact"
            style={{
              flex: 1, minWidth: 0, background: 'transparent', border: 'none', outline: 'none', padding: 0,
              color: V_INK, fontFamily: V_MONO, fontSize: mobile ? '12px' : '13px', letterSpacing: '0.02em', caretColor: V_LIME,
            }}
          />
        </div>
      </div>
    </div>
  );
}

<script type="text/plain" id="grain-src">
// ─────────────────────────────────────────────────────────
// GRAIN MODE - cinematic, achromatic, full-bleed.
// Named for the film grain in RField, which renders on every plane whether or not there
// is a photograph behind it. Grain plus grayscale(1) is what makes a stock still life, a
// phone snapshot and a 1992 film scan read as one edition instead of five sources.
// The R_ constants and r-* class names predate the renames from "Reel" and "Silver" and
// were left alone deliberately: 183 internal identifiers, invisible to anyone using the
// site, and each one a chance to break a working theme.
// A portfolio read as a film reel: edge-to-edge planes, one statement per screen,
// text pinned to the top-left corner like a title card, and a single hamburger
// standing in for navigation. Six neutrals, one typeface, weights 300 and 400 only
// — no accent colour, no shadow, no radius except the fully-pill button.
// ─────────────────────────────────────────────────────────
const R_PAPER = '#fafafa';
const R_INK   = '#000000';
const R_CHAR  = '#1c1c1c';
const R_SOIL  = '#141109';
const R_ASH   = '#dcdcdc';
const R_DRIFT = '#c2b5ae';

const R_SANS = "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
const R_FEAT = '"ss01" 1, "tnum" 1';

// Type scale — 41 / 17 / 15 with negative tracking. 41px is the largest size on the
// whole page: hierarchy comes from weight and space, never from scale or boldness.
const R_DISPLAY = { fontSize: '41px', lineHeight: 1.18, letterSpacing: '-0.9px', fontWeight: 400 };
const R_BODY    = { fontSize: '17px', lineHeight: 1.7,  letterSpacing: '-0.02em', fontWeight: 400 };
const R_CAPTION = { fontSize: '15px', lineHeight: 1.4,  letterSpacing: '-0.022em', fontWeight: 300 };

const R_EDGE   = 'clamp(20px, 3.4vw, 43px)';   // viewport-corner inset
const R_CHROME = '72px';                       // clearance under the fixed chrome line
const R_BREATH = 'clamp(90px, 20vw, 288px)';   // the cinematic intermission — 288px lands at 1440px

const R_HALF   = 'clamp(48px, 10vw, 144px)';   // half a breath — a lighter pause between acts

const rReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Film grain, generated as an SVG data URI rather than shipping an asset.
const R_GRAIN = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
  '<filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>' +
  '<feColorMatrix type="saturate" values="0"/></filter>' +
  '<rect width="200" height="200" filter="url(#g)"/></svg>'
);

(function rInjectStyle() {
  if (document.getElementById('grain-style')) return;
  const st = document.createElement('style');
  st.id = 'grain-style';
  st.textContent = [
    '.grain-root ::selection { background: #000000; color: #fafafa; }',
    '.grain-root a, .grain-root button { -webkit-tap-highlight-color: transparent; }',
    // The site-wide ring is `2px solid var(--color-text)`, and Grain sets --color-text
    // to #000000 — 1.05:1 on soil, i.e. no ring at all. Dark planes re-declare it in paper.
    '.grain-root [data-r-tone="dark"] button:focus-visible, .grain-root [data-r-tone="dark"] a:focus-visible { outline-color: #fafafa; }',
    // Planes fill the viewport; svh keeps mobile browser chrome from cropping them.
    '.r-plane { min-height: 100vh; min-height: 100svh; content-visibility: auto; contain-intrinsic-size: auto 100vh; }',
    '@keyframes r-drift-a { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(5%,-4%,0) scale(1.16); } 100% { transform: translate3d(0,0,0) scale(1); } }',
    '@keyframes r-drift-b { 0% { transform: translate3d(0,0,0) scale(1.14); } 50% { transform: translate3d(-6%,5%,0) scale(1); } 100% { transform: translate3d(0,0,0) scale(1.14); } }',
    '@keyframes r-grain { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); } 60% { transform: translate(-2%,-2%); } 80% { transform: translate(3%,1%); } }',
    // A reel is tall: a dozen planes of blurred, animated layers. Only the ones
    // near the viewport are allowed to run — the rest sit paused and cost nothing.
    // Starts at 1, not 1.04: a plane is whatever shape the window is, so cover already
    // discards a slice of the photograph before any transform. Beginning zoomed threw
    // the top away permanently. 1.06 also keeps a 2000px source from being upscaled
    // past ~2100 on a normal window.
    '@keyframes r-ken { from { transform: scale(1); } to { transform: scale(1.06) translate3d(-1%, 0.8%, 0); } }',
    '.r-field .r-blob, .r-field .r-grain, .r-field .r-ken { animation-play-state: paused; }',
    '.r-field.r-live .r-blob, .r-field.r-live .r-grain, .r-field.r-live .r-ken { animation-play-state: running; }',
    // A slowly-scaling element gets re-rastered every time Chrome crosses a scale
    // tier, which on a filtered full-screen photograph is the hitch you feel rather
    // than see. Promoting it while it is live rasters once and transforms after that.
    // Scoped to .r-live so at most the two or three planes near the viewport hold a
    // layer, not all six, and to a pointer that hovers because nothing moves at all
    // on touch - see below - so a layer there would be held for no motion.
    '@media (hover: hover) { .r-field.r-live .r-ken { will-change: transform; } }',
    // Touch devices: the plane is a still photograph.
    //
    // Every layer in a field carries mix-blend-mode, and a blended layer cannot be
    // composited on its own - the browser needs the backdrop rasterised alongside it.
    // So any one of the seven animations dirties the whole plane, photograph and
    // filter chain included: at 375x812 on a DPR-3 phone, 2.7M pixels re-rastered and
    // blended seven ways, sixty times a second. The grain was the worst of them,
    // stepping five times a second forever.
    //
    // Freezing the decorative two cost nothing - a 200px grain tile does not read as
    // shimmer on a 375px screen, and a wash that takes 40 to 74 seconds to cross is
    // not motion anyone perceives - but it left the Ken Burns pushing a full-screen
    // filtered image on its own, which is the expensive one. On a phone that drift
    // buys little: it travels 3% of the plane, settles inside twenty seconds and then
    // holds, so most of the time a plane is on screen it is already still. Holding it
    // still from the start is the honest version of what it was going to be anyway,
    // and it means a phone composites nothing at all.
    //
    // Desktop keeps the drift. The layers still paint identically in both places;
    // only the motion differs.
    //
    // !important because all three animations are set inline from JS.
    '@media (hover: none) { .r-blob, .r-grain, .r-ken { animation: none !important; } }',
    // The only entrance motion in the system: a slow fade up, nothing else.
    '.r-in { opacity: 0; transform: translateY(14px); transition: opacity 1100ms cubic-bezier(0.22,0.61,0.36,1), transform 1100ms cubic-bezier(0.22,0.61,0.36,1); }',
    '.r-in.r-on { opacity: 1; transform: none; }',
    // R_BODY's 1.7 leading is set for the measure it was designed against: a 560 to
    // 640px column runs 65 to 75 characters a line. A phone column is 335px and runs
    // 39, and a short measure wants less leading, not more - the eye has a shorter
    // trip back to the start of the next line, so generous leading just pulls the
    // lines apart. The same description sets as 5 lines and 144px on desktop and 9
    // lines and 260px here; 1.45 brings that back to 222px without touching the copy,
    // the type size, or anything above 600px.
    //
    // 600px matches useMobile's breakpoint so CSS and JS agree on what a phone is.
    // RBody is the only <p> the edition renders, so the selector needs no help.
    // !important because R_BODY is spread inline.
    '@media (max-width: 600px) { .grain-root p { line-height: 1.45 !important; } }',
    '@media (hover: none) { .r-arrow { opacity: 1 !important; transform: none !important; } }',
    // scroll-behavior needs !important to beat the global `html { scroll-behavior: smooth }`:
    // behavior:'auto' at the call sites means "use the computed value", which is smooth.
    '@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto !important; } .r-in { opacity: 1; transform: none; transition: none; } .r-blob, .r-grain, .r-ken { animation: none !important; } .grain-root *, .grain-root *::before, .grain-root *::after { transition-property: opacity, background-color, color, border-color !important; } }',
  ].join('\n');
  document.head.appendChild(st);
})();

// ── Footage ────────────────────────────────────────────────
// Real photographs live in /footage. The manifest is generated from the folder
// contents by `npm run footage` (and by build.js in CI), so a picture only ever has
// to be dropped in — it is never referenced from code. The file's name is its slot:
// hero.jpg fills the hero plane, milk-me-not.jpg fills that project's plane. Any
// slot without a photograph falls back to the plane's generated field.
let rFootagePromise = null;
function rLoadFootage() {
  if (!rFootagePromise) {
    rFootagePromise = fetch('footage/manifest.json')
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
  }
  return rFootagePromise;
}

// Photograph credits, kept in their own file so adding a picture and crediting it are
// the same size of job. Pexels does not require attribution; this is here because the
// work is someone else's. A missing file simply means no credit line.
let rCreditsPromise = null;
function rLoadCredits() {
  if (!rCreditsPromise) {
    rCreditsPromise = fetch('footage/credits.json')
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
  }
  return rCreditsPromise;
}

function useCredits() {
  const [credits, setCredits] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    rLoadCredits().then(c => { if (alive) setCredits(c || {}); });
    return () => { alive = false; };
  }, []);
  return credits || {};
}

// The credit reads at the same weight as the lines beside it. Stacking an opacity on
// top of RCaption's own 0.78 alpha made it the faintest thing on the page — quiet is
// the register, invisible is a different thing.
function RCredit({ credit, style, dim }) {
  if (!credit || !credit.name) return null;
  // 0.5 alpha over the plane's scrim lands about 5:1, so it stays legible while
  // reading as a corner mark rather than as content.
  // `source` is optional: stock needs "via Pexels", a company's own archive photo does
  // not, and asserting a source that is not true is worse than omitting it.
  const col = dim ? { color: 'rgba(250,250,250,0.5)' } : null;
  return (
    <RCaption light style={{ ...col, ...(style || {}) }}>
      Photo:{' '}
      {credit.url
        ? <a href={credit.url} target="_blank" rel="noopener noreferrer" style={{ color: 'inherit', textDecoration: 'none', borderBottom: '1px solid rgba(250,250,250,0.28)' }}>{credit.name}</a>
        : credit.name}
      {credit.source ? ' via ' + credit.source : ''}
    </RCaption>
  );
}

function useFootage() {
  const [map, setMap] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    rLoadFootage().then(m => { if (alive) setMap(m || {}); });
    return () => { alive = false; };
  }, []);
  return map || {};
}

// Not every unpublished project is unfinished. Folio runs at folio.local — built and
// in daily use, just never deployed — so saying "in progress" would be untrue. A
// .local address is the signal, and the address itself is the more useful caption.
function rStatus(project) {
  const url = project.url || '';
  if (/\.local$/i.test(url)) return 'Runs locally at ' + url;
  return 'In progress, not public yet';
}

// A photograph wins; a project screenshot is the fallback; with neither, the plane
// carries its generated field alone.
function rMedia(footage, slot, screenshot) {
  if (footage && footage[slot]) return { src: 'footage/' + footage[slot], kind: 'photo' };
  if (screenshot) return { src: screenshot, kind: 'screenshot' };
  return null;
}

// Deterministic pseudo-random from a string, so each plane gets its own tonal
// composition but never reshuffles between renders.
function rSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function () {
    h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13;
    return ((h >>> 0) % 10000) / 10000;
  };
}

// Reveal-on-scroll without a library — the design only ever asks for one fade.
function useRevealRoot(ref, deps) {
  React.useEffect(() => {
    if (!ref.current) return;
    const nodes = ref.current.querySelectorAll('.r-in');
    if (rReduced() || !('IntersectionObserver' in window)) {
      nodes.forEach(n => n.classList.add('r-on'));
      return;
    }
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('r-on'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
    nodes.forEach(n => io.observe(n));
    return () => io.disconnect();
  }, deps || []);
}

// Which surface sits under the fixed chrome, so the wordmark and hamburger can flip
// between ink and paper instead of carrying a scrim behind them.
function useSurfaceTone() {
  const [tone, setTone] = React.useState('dark');
  React.useEffect(() => {
    let frame = null;
    const read = () => {
      frame = null;
      const marks = document.querySelectorAll('[data-r-tone]');
      let found = 'dark';
      for (let i = 0; i < marks.length; i++) {
        const r = marks[i].getBoundingClientRect();
        if (r.top <= 38 && r.bottom > 38) found = marks[i].getAttribute('data-r-tone');
      }
      setTone(found);
    };
    const onScroll = () => { if (frame === null) frame = requestAnimationFrame(read); };
    read();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      if (frame !== null) cancelAnimationFrame(frame);
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, []);
  return tone;
}

// ── Media plane ────────────────────────────────────────────
// Stands in for the reference site's full-bleed cinematic footage. Where a project
// has a real screenshot it is used raw and desaturated — the palette stays
// achromatic — over a slow-drifting tonal field and film grain.
function RField({ seed, media, dark, eager }) {
  const fieldRef = React.useRef(null);
  React.useEffect(() => {
    const el = fieldRef.current;
    if (!el) return;
    if (rReduced()) return;                       // reduced motion: keyframes are off anyway
    if (!('IntersectionObserver' in window)) { el.classList.add('r-live'); return; }
    const io = new IntersectionObserver(
      entries => entries.forEach(e => el.classList.toggle('r-live', e.isIntersecting)),
      { rootMargin: '25% 0px' }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const blobs = React.useMemo(() => {
    const rnd = rSeed(seed);
    const tints = dark
      ? ['194,181,174', '220,220,220', '150,141,133', '70,64,58']
      : ['28,28,28', '194,181,174', '120,114,108', '190,190,190'];
    const out = [];
    for (let i = 0; i < 5; i++) {
      out.push({
        x: 4 + rnd() * 82, y: 2 + rnd() * 84,
        w: 40 + rnd() * 52, h: 34 + rnd() * 54,
        tint: tints[Math.floor(rnd() * tints.length)],
        alpha: (dark ? 0.14 : 0.09) + rnd() * (dark ? 0.26 : 0.13),
        dur: 40 + Math.floor(rnd() * 34),
        delay: -Math.floor(rnd() * 40),
        anim: i % 2 ? 'r-drift-b' : 'r-drift-a',
      });
    }
    return out;
  }, [seed, dark]);

  return (
    <div ref={fieldRef} className="r-field" aria-hidden="true" style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: dark ? R_SOIL : R_PAPER }}>
      {media && (
        // Presented raw — no border, no radius, no scrim rectangle. Desaturated
        // because the palette is achromatic and a colour cast would break it.
        // A photograph carries the plane, so it sits brighter and drifts (Ken
        // Burns); a screenshot only underpins it, and stays still and top-anchored.
        <img
          className={media.kind === 'photo' ? 'r-ken' : undefined}
          // 640 is tied to the blur(14px) below: a Gaussian with sigma = 14 CSS px
          // needs about 3 samples per sigma to survive, so the widest useful source
          // is displayWidth x 3 / 14 — 549px even at a 2560px viewport. Asking for
          // 1800 downloads ~5x the bytes and decodes 7 MB of bitmap the filter then
          // deletes. If the blur is ever lowered, this has to rise with it.
          src={media.kind === 'screenshot' && typeof sanityImg === 'function' ? sanityImg(media.src, 640) : media.src}
          alt=""
          loading={eager ? 'eager' : 'lazy'}
          // Only the hero and the open case study are eager; everything else queues
          // behind them rather than alongside the LCP image.
          fetchPriority={eager ? 'high' : 'low'}
          decoding="async"
          style={{
            position: 'absolute', inset: 0, width: '100%', height: '100%',
            objectFit: 'cover',
            objectPosition: media.kind === 'photo' ? 'center' : 'top center',
            filter: media.kind === 'photo'
              ? 'grayscale(1) contrast(1.08) brightness(0.68)'
              : 'grayscale(1) blur(14px) contrast(0.95) brightness(0.5)',
            opacity: media.kind === 'photo' ? 0.82 : 0.4,
            transform: media.kind === 'photo' ? undefined : 'scale(1.08)',
            animationName: media.kind === 'photo' ? 'r-ken' : undefined,
            // 20s linear, not 34s eased. That curve was a hard ease-out: it spent most
            // of the 6% in the first few seconds and then asymptoted, so the drift
            // decelerated to a standstill while the plane was still on screen and never
            // restarted - motion that stops reads as motion that broke. A scale of 1.06
            // moves an edge by 3% of the plane height, so on a 812px phone the old
            // timing averaged 0.7px per second and far less than that in the tail, which
            // is below the rate at which drift reads as drift at all. Linear over 20s
            // holds a constant ~1.2px/s for the whole time a plane is on screen. The
            // end scale is untouched: raising it would crop the photograph further, and
            // the top edge is the part worth protecting.
            animationDuration: media.kind === 'photo' ? '20s' : undefined,
            animationTimingFunction: media.kind === 'photo' ? 'linear' : undefined,
            animationIterationCount: media.kind === 'photo' ? '1' : undefined,
            animationFillMode: media.kind === 'photo' ? 'both' : undefined,
          }}
        />
      )}
      {blobs.map((b, i) => (
        <div key={i} className="r-blob" style={{
          position: 'absolute', left: b.x + '%', top: b.y + '%', width: b.w + '%', height: b.h + '%',
          // No blur: `closest-side` already lands the gradient on alpha 0 at every
          // edge of the box, so there is no discontinuity for a Gaussian to soften —
          // it redistributes under 0.012 alpha while promoting all 30 blobs to their
          // own render surfaces (~84 MB of RGBA at a 1265x595 window, ~200 MB at
          // 1080p). A/B'd in the browser: the frames are identical.
          background: 'radial-gradient(closest-side, rgba(' + b.tint + ',' + b.alpha + '), rgba(' + b.tint + ',0))',
          mixBlendMode: dark ? 'screen' : 'multiply',
          animationName: b.anim, animationDuration: b.dur + 's', animationTimingFunction: 'ease-in-out',
          animationDelay: b.delay + 's', animationIterationCount: 'infinite',
        }} />
      ))}
      <div className="r-grain" style={{
        position: 'absolute', inset: '-6%', backgroundImage: 'url("' + R_GRAIN + '")',
        backgroundSize: '200px 200px', opacity: dark ? 0.16 : 0.07,
        mixBlendMode: dark ? 'overlay' : 'multiply',
        animationName: 'r-grain', animationDuration: '0.9s', animationTimingFunction: 'steps(1,end)',
        animationIterationCount: 'infinite',
      }} />
      {/* Tonal falloff so top-left type always has ground to sit on, without a scrim rectangle. */}
      <div style={{
        position: 'absolute', inset: 0,
        background: dark
          ? (media
            // The radial is anchored at 8% 4% and thins to ~0.22 at the bottom, but the
            // hero's caption and pills sit in the bottom-left. The linear layer paints on
            // top of it and lands the worst case around #282828 (~9:1 for the caption).
            ? 'linear-gradient(to top, rgba(20,17,9,0.80) 0%, rgba(20,17,9,0.30) 26%, rgba(20,17,9,0) 46%), radial-gradient(135% 100% at 8% 4%, rgba(20,17,9,0.94), rgba(20,17,9,0.34) 58%, rgba(20,17,9,0.22) 100%)'
            : 'radial-gradient(120% 90% at 12% 8%, rgba(20,17,9,0.74), rgba(20,17,9,0.08) 62%)')
          : 'radial-gradient(120% 90% at 12% 8%, rgba(250,250,250,0.82), rgba(250,250,250,0.12) 62%)',
      }} />
    </div>
  );
}

// ── Primitives ─────────────────────────────────────────────
function RCaption({ children, light, style, className }) {
  return <div className={className} style={{ fontFamily: R_SANS, fontFeatureSettings: R_FEAT, ...R_CAPTION, color: light ? 'rgba(250,250,250,0.78)' : 'rgba(0,0,0,0.55)', ...(style || {}) }}>{children}</div>;
}

function RDisplay({ children, light, as, style, className }) {
  const Tag = as || 'h2';
  return <Tag className={className} style={{ fontFamily: R_SANS, fontFeatureSettings: R_FEAT, ...R_DISPLAY, margin: 0, color: light ? R_PAPER : R_INK, ...(style || {}) }}>{children}</Tag>;
}

function RBody({ children, light, style, className }) {
  return <p className={className} style={{ fontFamily: R_SANS, fontFeatureSettings: R_FEAT, ...R_BODY, margin: 0, color: light ? 'rgba(250,250,250,0.86)' : R_INK, ...(style || {}) }}>{children}</p>;
}

// Ghost pill — the only interactive shape in the system. 300px radius, hairline
// border, no fill; hover inverts rather than tinting, because there is no tint.
function RPill({ children, href, onClick, light, newTab }) {
  const [hot, setHot] = React.useState(false);
  const line = light ? R_PAPER : R_INK;
  const style = {
    display: 'inline-flex', alignItems: 'center', gap: '8px',
    // Horizontal padding gives way on narrow screens; vertical never does, so the
    // 44px tap target survives. At the 360px CSS width a Galaxy S, Pixel 5 or iPhone
    // 12 mini reports, the three contact pills needed 319.6px inside a 320px row -
    // four tenths of a pixel of slack, which any font substitution or subpixel
    // rounding spent, dropping LinkedIn onto its own line. 4vw yields 14.4px a side
    // there and buys back ~34px, and clamps to the full 20px again by 500px, so
    // nothing above a phone changes at all.
    padding: '12px clamp(14px, 4vw, 20px)', borderRadius: '300px',
    border: '1px solid ' + line,
    background: hot ? line : 'transparent',
    color: hot ? (light ? R_INK : R_PAPER) : line,
    fontFamily: R_SANS, fontFeatureSettings: R_FEAT, fontSize: '15px', fontWeight: 400,
    letterSpacing: '-0.02em', lineHeight: 1.2, textDecoration: 'none', cursor: 'pointer',
    transition: 'background-color 320ms ease, color 320ms ease',
  };
  const on = { onMouseEnter: () => setHot(true), onMouseLeave: () => setHot(false), onFocus: () => setHot(true), onBlur: () => setHot(false) };
  if (href) return <a href={href} target={newTab ? '_blank' : undefined} rel={newTab ? 'noopener noreferrer' : undefined} style={style} {...on}>{children}</a>;
  return <button onClick={onClick} style={style} {...on}>{children}</button>;
}

// ── Chrome ─────────────────────────────────────────────────
function RChrome({ tone, menuOpen, onMenu, onTop, marked }) {
  const light = tone === 'dark';
  const line = light ? R_PAPER : R_INK;
  const bar = { display: 'block', width: '24px', height: '1px', background: line, transition: 'transform 380ms cubic-bezier(0.22,0.61,0.36,1), background-color 400ms ease' };
  return (
    <React.Fragment>
      <button
        onClick={onTop}
        style={{
          position: 'fixed', top: 'calc(' + R_EDGE + ' - 18px)', left: R_EDGE, zIndex: 120,
          // 45px tall so the back-to-top target matches the hamburger opposite it. The
          // extra padding is cancelled by the top offset, so the wordmark itself does
          // not move; only the region that responds to a thumb grows.
          background: 'none', border: 'none', padding: '12px 12px 12px 0', cursor: 'pointer', outlineColor: line,
          fontFamily: R_SANS, fontFeatureSettings: R_FEAT, ...R_CAPTION, color: line,
          opacity: marked ? 1 : 0, pointerEvents: marked ? 'auto' : 'none',
          visibility: marked ? 'visible' : 'hidden',
          transition: 'opacity 700ms ease, color 400ms ease, visibility 0ms' + (marked ? '' : ' 700ms'),
        }}
      >Peter &amp; Co.</button>
      <button
        onClick={onMenu}
        aria-label={menuOpen ? 'Close menu' : 'Open menu'}
        aria-expanded={menuOpen}
        aria-controls="r-menu"
        style={{
          position: 'fixed', top: 'calc(' + R_EDGE + ' - 4px)', right: R_EDGE, zIndex: 120,
          background: 'none', border: 'none', cursor: 'pointer', outlineColor: line,
          // 44x44 hit area (24px bar + 20 left pad; 8px of bars + 36 vertical pad).
          // The negative top margin cancels the extra top padding, so the two lines
          // stay on exactly the pixels they sat on before.
          padding: '18px 0 18px 20px', marginTop: '-8px', display: 'flex', flexDirection: 'column', gap: '6px', alignItems: 'flex-end',
        }}
      >
        <span style={{ ...bar, transform: menuOpen ? 'translateY(3.5px) rotate(9deg)' : 'none' }} />
        <span style={{ ...bar, transform: menuOpen ? 'translateY(-3.5px) rotate(-9deg)' : 'none' }} />
      </button>
    </React.Fragment>
  );
}

function RMenu({ open, onClose, onNav }) {
  const { openEditions } = useTheme();

function RProjectPlane({ project, index, total, footage, onSelect }) {

  const lead = project.tagline || project.description;
  return (

      className="r-plane"

      onClick={() => onSelect(project)}

            the affordance has to follow the whole plane, not the four words of the

            the cursor is over that project — which is the honest signal, even though it
            means the slide-in only plays as you move between planes. The title is still
            a real button so the plane is keyboard-reachable and announced; its handler
            stops the event so selecting cannot fire twice. */}
        <RDisplay light style={{ marginBottom: '17px' }}>
          <button
            onClick={e => { e.stopPropagation(); onSelect(project); }}
            onFocus={() => setHot(true)}
            onBlur={() => setHot(false)}
            style={{
              font: 'inherit', color: 'inherit', letterSpacing: 'inherit',

            }}>&rarr;</span>

        <RBody light style={{ maxWidth: '48ch' }}>{lead}</RBody>

  return (
    <section className="r-plane" data-r-tone="dark" style={{

      display: 'flex', flexDirection: 'column',
    }}>
      <RField seed={project.id} media={rMedia(footage, project.id, project.screenshot)} dark eager />

      {/* The type covers most of the plane here, not just the corner, so the falloff
          has to reach further left and down than RField's own. Still a falloff rather
          than a flat scrim — the image keeps its own tonal range at the edges. */}
      <div aria-hidden="true" style={{
        position: 'absolute', inset: 0,

        position: 'relative', flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'flex-start',

      }}>
        <RDisplay as="h1" light>{project.title}</RDisplay>

        <div style={{ maxWidth: '62ch' }}>
          {/* Kept at body size: a 41px statement under a 41px title reads as two

            {/* The claim and the explanation were both 17px/400, so neither led. The system

            {/* Full paper-white against the prose's 0.80. Bold is not available - the
                system stops at 400 - so the statement leads on weight and brightness
                together: 400/1.0 over 300/0.80. */}
            <RBody className="r-in" light style={{ marginBottom: '20px', color: R_PAPER }}>{project.tagline || project.description}</RBody>
            <RBody className="r-in" light style={{ marginBottom: '29px', fontWeight: 300, color: 'rgba(250,250,250,0.80)' }}>
              {project.detail || project.description}
            </RBody>
            <div className="r-in">
              {live
                ? <RPill light newTab href={project.href}>{project.url} <span aria-hidden="true">&#8599;</span></RPill>
                : <RCaption light>{rStatus(project)}</RCaption>}

          </div>
        </div>
      </div>

      {/* The credit sits in the corner opposite the title, above the Next bar: out of
          the reading column entirely, present where the photograph fills the screen. */}
      {credit && (
        <div style={{
          position: 'relative', flexShrink: 0,
          padding: '0 ' + R_EDGE, paddingBottom: '12px',
          display: 'flex', justifyContent: 'flex-end',
        }}>
          <RCredit credit={credit} dim />
        </div>
      )}

      {/* Pinned to the foot of the screen, hairline above it — the one piece of chrome
          on the page, and the way through the reel without going back to it. */}
      {next && (
        <button
          onClick={() => onSelect(next)}
          style={{
            position: 'relative', flexShrink: 0, width: '100%', textAlign: 'left', cursor: 'pointer',
            // Flat wash, no backdrop-filter. A backdrop filter makes this a backdrop
            // root: the compositor re-rasterises and re-blurs everything behind it on
            // every frame, and behind it is a full-viewport plane running a 58s Ken
            // Burns transform — a 60fps readback for the whole time a case study is
            // open. The separation it bought is bought here by alpha instead, which
            // is also the more honest reading of "no elevation, no card surfaces".
            background: 'rgba(20,17,9,0.72)', border: 'none', borderTop: '1px solid rgba(250,250,250,0.22)',
            // Tighter on a phone. R_BODY carries line-height 1.7, which is a prose
            // value: in a one-line bar it wraps ~20px of glyph in a 28.9px box and
            // leaves the bar 64px tall, near 8% of an 812px screen, more than half of
            // it air. Desktop has the room for that and reads correctly, so it keeps
            // the original numbers - this only trims the phone.
            padding: mobile ? '12px 20px' : '20px clamp(20px, 3.4vw, 43px)',
            display: 'flex', alignItems: 'baseline', gap: '16px',
          }}
          onMouseEnter={e => e.currentTarget.style.background = 'rgba(20,17,9,0.88)'}
          onMouseLeave={e => e.currentTarget.style.background = 'rgba(20,17,9,0.72)'}
        >
          <RCaption light>Next</RCaption>
          {/* 1.25 rather than R_BODY's 1.7: the leading exists to space stacked lines
              of prose and there is only ever one line here. Type size is untouched -
              the destination is the point of the bar - and baseline alignment keeps it
              sitting with "Next" regardless. The button still clears 44px. */}
          <span style={{ fontFamily: R_SANS, fontFeatureSettings: R_FEAT, ...R_BODY, lineHeight: mobile ? 1.25 : R_BODY.lineHeight, color: R_PAPER }}>
            {next.title} <span aria-hidden="true">&rarr;</span>
          </span>
        </button>
      )}
    </section>
  );
}

function GrainApp({ selectedProject, navigate, selectProject }) {
  const mobile = useMobile();
  const tone = useSurfaceTone();
  const footage = useFootage();
  const rootRef = React.useRef(null);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [scrolled, setScrolled] = React.useState(false);
  const projects = PROJECTS;

  // Re-run the reveal observer when the view swaps, or a case study renders invisible.
  useRevealRoot(rootRef, [projects.map(p => p.id).join('|'), (TOOL_CATEGORIES || []).map(c => c.label).join('|'), selectedProject && selectedProject.id]);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 120);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  React.useEffect(() => {
    // <html> is the scrolling element here, so locking <body> alone lets the reel
    // keep scrolling behind the open menu. Lock both.
    const root = document.documentElement;
    root.style.overflow = menuOpen ? 'hidden' : '';
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { root.style.overflow = ''; document.body.style.overflow = ''; };
  }, [menuOpen]);

  const scrollToId = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: rReduced() ? 'auto' : 'smooth', block: 'start' });
  };
  const goTo = (id) => {
    setMenuOpen(false);
    // Two reasons never to scroll in this tick: the open menu locks <html> overflow,
    // which swallows the scroll, and the reel's sections do not exist at all while a
    // case study is open. Let React paint the close (and the reel) first.
    if (selectedProject) navigate('home');
    requestAnimationFrame(() => requestAnimationFrame(() => scrollToId(id)));
  };

  return (
    <div ref={rootRef} className="grain-root" style={{
      background: R_SOIL, color: R_INK, minHeight: '100vh',
      fontFamily: R_SANS, fontFeatureSettings: R_FEAT, overflowX: 'clip',
    }}>
      <RChrome
        tone={menuOpen ? 'light' : tone}
        menuOpen={menuOpen}
        marked={scrolled || menuOpen}
        onMenu={() => setMenuOpen(o => !o)}
        onTop={() => window.scrollTo({ top: 0, behavior: rReduced() ? 'auto' : 'smooth' })}
      />
      <RMenu open={menuOpen} onClose={() => setMenuOpen(false)} onNav={goTo} />
      {selectedProject ? (
        <RProjectDetail
          project={selectedProject}
          projects={projects}
          footage={footage}
          mobile={mobile}
          onSelect={selectProject}
        />
      ) : (
        <React.Fragment>
          <RHero mobile={mobile} footage={footage} />
          <RStatement footage={footage} />
          <RIntertitle mobile={mobile} />
          <RWork projects={projects} footage={footage} onSelect={selectProject} />
          <RTools mobile={mobile} />
          <RContact mobile={mobile} />
        </React.Fragment>
      )}
    </div>
  );
}
</script>

<script type="text/plain" id="prism-src">
// ── PRISM MODE ─────────────────────────────────────────────
// Light, and the only edition with real colour. The whole idea is that the ground
// drifts slower than the cards: that parallax is where the depth comes from, which
// is why there is not one box-shadow in here.
//
// Four motion primitives and nothing else. Anything not on this list does not exist:
//   DRIFT  19-31s   the colour fields, each on its own clock so they never settle
//   FLOAT  9s       cards rising out of step; the depth cue that replaces shadows
//   RISE   900ms    the only entrance, scroll-driven below the fold
//   SHEEN  7s       one light sweep, on the primary call to action and nowhere else
//
// Two rules keep it honest. Transform and opacity only — never an animated blur or
// filter, which is what makes this affordable. And every oklch() carries a hex on the
// line above it: without that, a renderer that cannot parse oklch drops all three
// fields and the edition fails to a blank white page.
const PZ_PAPER = '#fbfbfd', PZ_INK = '#1b1a22', PZ_BODY = '#4e4c63', PZ_MUTE = '#5b586f';
const PZ_LINE = 'rgba(27,26,34,0.10)';
const PZ_DISPLAY = "'Instrument Serif', Georgia, 'Times New Roman', serif";
const PZ_SANS = "'Instrument Sans', system-ui, -apple-system, sans-serif";
const PZ_EDGE = 'clamp(20px, 4vw, 56px)';
const PZ_GAP = 'clamp(64px, 11vw, 148px)';
// 44px control plus 18px of padding either side. The hero subtracts this so the
// first screen is exactly one viewport, header included.
const PZ_CHROME = '80px';

const pzReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function pzStyles() {
  if (document.getElementById('prism-style')) return;
  const st = document.createElement('style');
  st.id = 'prism-style';
  st.textContent = [
    '.prism-root ::selection { background: #6d4fd0; color: #fbfbfd; }',
    '.prism-root a, .prism-root button { -webkit-tap-highlight-color: transparent; }',
    '.prism-root a:focus-visible, .prism-root button:focus-visible { outline: 2px solid #6d4fd0; outline-offset: 3px; }',

    // DRIFT. Transform only — animating the blur instead would cost a full re-raster
    // every frame, which is exactly what makes most designs like this unusable.
    '@keyframes pz-drift-a { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(7%,-5%,0) scale(1.14); } }',
    '@keyframes pz-drift-b { 0%,100% { transform: translate3d(0,0,0) scale(1.10); } 50% { transform: translate3d(-8%,6%,0) scale(1); } }',
    '@keyframes pz-drift-c { 0%,100% { transform: translate3d(0,0,0) scale(1.05); } 50% { transform: translate3d(5%,7%,0) scale(1.16); } }',
    // Hex first, oklch second: a renderer that cannot parse oklch keeps the hex
    // instead of dropping the field and leaving a blank white page.
    '.pz-a { background: #ddc9f2; background: oklch(0.88 0.085 300); animation: pz-drift-a 19s ease-in-out infinite; }',
    '.pz-b { background: #b6dcf1; background: oklch(0.88 0.085 218); animation: pz-drift-b 24s ease-in-out infinite; }',
    '.pz-c { background: #f5d5a4; background: oklch(0.89 0.085 68);  animation: pz-drift-c 31s ease-in-out infinite; }',

    // FLOAT.
    '@keyframes pz-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }',
    '.pz-float { animation: pz-float 9s ease-in-out infinite; }',
    '@keyframes pz-cue { 0%,100% { transform: translateY(0); opacity: 0.55; } 50% { transform: translateY(6px); opacity: 1; } }',
    '.pz-cue { animation: pz-cue 2.6s ease-in-out infinite; }',

    // RISE. Above the fold it runs once on load; below it, it runs on scroll so it
    // moves at reading speed. Default state is VISIBLE, and the animation is layered
    // on inside @supports — a browser without scroll-driven timelines shows the page
    // rather than a column of invisible blocks.
    '@keyframes pz-rise { from { clip-path: inset(104% 0 0 0); transform: translateY(18px); } to { clip-path: inset(-26% 0 0 0); transform: translateY(0); } }',
    '.pz-in { animation: pz-rise 900ms cubic-bezier(0.22,0.61,0.36,1) both; }',
    '.pz-d1 { animation-delay: 90ms; } .pz-d2 { animation-delay: 180ms; } .pz-d3 { animation-delay: 280ms; } .pz-d4 { animation-delay: 380ms; }',
    '@supports (animation-timeline: view()) { @media (prefers-reduced-motion: no-preference) {',
    '  .pz-rise { animation: pz-rise linear both; animation-timeline: view(); animation-range: entry 0% cover 30%; }',
    '} }',

    // SHEEN.
    '@keyframes pz-sheen { 0% { background-position: -140% 0; } 55%,100% { background-position: 240% 0; } }',
    '.pz-sheen { background-image: linear-gradient(100deg, transparent 38%, rgba(255,255,255,0.55) 50%, transparent 62%); background-size: 220% 100%; animation: pz-sheen 7s ease-in-out infinite; }',

    '.pz-card { transition: transform 420ms cubic-bezier(0.22,0.61,0.36,1), background-color 320ms ease; }',
    '@media (hover: hover) { .pz-card:hover { transform: translateY(-4px); background-color: rgba(255,255,255,0.78); } }',
    '.pz-arrow { transition: transform 380ms cubic-bezier(0.22,0.61,0.36,1); }',
    '@media (hover: hover) { .pz-card:hover .pz-arrow { transform: translate(3px,-3px); } }',

    // Stopping the animation is not enough for the sheen: the gradient is a
    // background-image and would sit there as a static white streak.
    '@media (prefers-reduced-motion: reduce) {',
    '  .pz-a, .pz-b, .pz-c, .pz-float, .pz-in, .pz-sheen, .pz-card, .pz-arrow, .pz-cue { animation: none !important; transition: none !important; }',
    '  .pz-in { clip-path: none !important; transform: none !important; }',
    '  .pz-sheen { background-image: none !important; }',
    '}',
  ].join('\n');
  document.head.appendChild(st);
}

// The drifting ground. Three fields on desktop, TWO on a phone, and a smaller blur
// radius there — blur cost scales with radius and area, and this is the single most
// expensive thing the edition paints.
function PZField({ mobile }) {
  return (
    <div aria-hidden="true" style={{
      position: 'absolute', inset: mobile ? '-16%' : '-12%',
      filter: mobile ? 'blur(48px)' : 'blur(74px)',
      opacity: mobile ? 0.78 : 0.8, pointerEvents: 'none', zIndex: 0,
    }}>
      <div className="pz-a" style={{ position: 'absolute', left: '-4%', top: '-4%', width: mobile ? '72%' : '52%', height: mobile ? '42%' : '62%', borderRadius: '50%' }} />
      <div className="pz-b" style={{ position: 'absolute', right: '-8%', top: mobile ? '30%' : '14%', width: mobile ? '70%' : '48%', height: mobile ? '40%' : '58%', borderRadius: '50%' }} />
      {!mobile && <div className="pz-c" style={{ position: 'absolute', left: '20%', bottom: '-14%', width: '56%', height: '52%', borderRadius: '50%' }} />}
    </div>
  );
}

function PZSection({ children, mobile, fields, style, id }) {
  return (
    <section id={id} style={{ position: 'relative', overflow: 'hidden', padding: `${PZ_GAP} ${PZ_EDGE}`, ...(style || {}) }}>
      {fields && <PZField mobile={mobile} />}
      <div style={{ position: 'relative', zIndex: 1, maxWidth: '1180px', margin: '0 auto' }}>{children}</div>
    </section>
  );
}

function PZLabel({ children }) {
  return <div style={{ fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', color: PZ_MUTE, fontWeight: 500 }}>{children}</div>;
}

function PZPill({ children, onClick, href, newTab, primary }) {
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minHeight: '44px',
    padding: '0 24px', borderRadius: '999px', fontFamily: PZ_SANS, fontSize: '14px',
    fontWeight: primary ? 600 : 500, cursor: 'pointer', textDecoration: 'none',
    border: primary ? '1px solid transparent' : '1px solid rgba(27,26,34,0.18)',
    background: primary ? '#6d4fd0' : 'rgba(255,255,255,0.6)',
    color: primary ? PZ_PAPER : PZ_INK,
  };
  if (href) return <a href={href} target={newTab ? '_blank' : undefined} rel={newTab ? 'noopener noreferrer' : undefined} style={base}>{children}</a>;
  return <button onClick={onClick} style={base}>{children}</button>;
}

function PZArrow({ size }) {
  const s = size || 15;
  return (
    <svg className="pz-arrow" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }} aria-hidden="true">
      <path d="M7 17 17 7" /><path d="M9 7h8v8" />
    </svg>
  );
}

function PZChrome({ mobile, onTop, openEditions, onJump }) {
  const nav = [['Work', 'pz-work'], ['Background', 'pz-background'], ['Contact', 'pz-contact']];
  return (
    <div style={{
      position: 'relative', zIndex: 2, display: 'flex', alignItems: 'center',
      justifyContent: 'space-between', maxWidth: '1180px', margin: '0 auto', width: '100%', boxSizing: 'border-box',
      // Fixed height, and no horizontal padding: this now sits INSIDE a section rather
      // than above one, so the colour field runs behind it instead of leaving a white
      // band across the top. The section supplies the inset; the height keeps the
      // hero's arithmetic exact.
      height: PZ_CHROME, flexShrink: 0,
    }}>
      <button onClick={onTop} style={{
        background: 'none', border: 'none', cursor: 'pointer',
        // 45px tall, not 43: at 15px the text box is 19px, so 12px of padding lands
        // one pixel under the minimum. The right padding keeps the width honest too.
        padding: '13px 14px 13px 0', minHeight: '44px',
        fontFamily: PZ_SANS, fontSize: '15px', fontWeight: 600, letterSpacing: '-0.01em', color: PZ_INK,
      }}>Peter &amp; Co.</button>
      <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? '0' : '28px' }}>
        {!mobile && nav.map(n => (
          <button key={n[0]} onClick={() => onJump(n[1])} style={{
            background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 4px',
            fontFamily: PZ_SANS, fontSize: '13px', color: PZ_BODY,
          }}>{n[0]}</button>
        ))}
        <PZPill onClick={openEditions}>Editions</PZPill>
      </div>
    </div>
  );
}

function PZHero({ mobile, openEditions, onWork, onTop, onJump }) {
  const facts = [
    ['Based in', 'Rotterdam, NL'],
    ['Projects', 'Five, two paid for'],
    ['Since', '2025'],
  ];
  return (
    // One screen, not one block. PZ_CHROME is subtracted because the header sits
    // above this section rather than inside it, and svh rather than vh so mobile
    // browser chrome cannot crop the bottom row off.
    <section style={{
      position: 'relative', overflow: 'hidden',
      minHeight: '100svh',
      display: 'flex', flexDirection: 'column',
      padding: `0 ${PZ_EDGE} clamp(24px, 4vw, 44px)`,
      boxSizing: 'border-box',
    }}>
      <PZField mobile={mobile} />
      <PZChrome mobile={mobile} onTop={onTop} openEditions={openEditions} onJump={onJump} />
      <div style={{ position: 'relative', zIndex: 1, maxWidth: '1180px', margin: '0 auto', width: '100%', flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <div style={{ overflow: 'hidden' }}>
          <h1 className="pz-in" style={{
            fontFamily: PZ_DISPLAY, fontWeight: 400, margin: 0, color: PZ_INK,
            fontSize: mobile ? 'clamp(46px, 13vw, 62px)' : 'clamp(64px, 8vw, 108px)',
            lineHeight: 0.98, letterSpacing: '-0.026em', maxWidth: '15ch',
          }}>
            Ideas worth <em style={{ fontStyle: 'italic', color: '#6d4fd0' }}>building</em> twice.
          </h1>
        </div>
        <p className="pz-in pz-d1" style={{
          fontFamily: PZ_SANS, margin: '26px 0 0', color: PZ_BODY,
          fontSize: mobile ? '15px' : '17px', lineHeight: 1.6, maxWidth: '46ch', textWrap: 'pretty',
        }}>
          Product owner by day, builder by night. No roadmap, no backlog, no stakeholders.
        </p>
        <div className="pz-in pz-d2" style={{ display: 'flex', gap: '12px', marginTop: '30px', flexWrap: 'wrap' }}>
          <PZPill primary onClick={onWork}>Selected work</PZPill>
          <PZPill onClick={openEditions}>Change edition</PZPill>
        </div>
      </div>

      <div className="pz-in pz-d3" style={{
        position: 'relative', zIndex: 1, maxWidth: '1180px', margin: '0 auto', width: '100%',
        display: 'flex', flexWrap: 'wrap', gap: mobile ? '18px' : '42px',
        alignItems: 'flex-end', justifyContent: 'space-between',
      }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: mobile ? '18px' : '42px' }}>
          {facts.map(f => (
            <div key={f[0]} style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
              <span style={{ fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase', color: PZ_MUTE }}>{f[0]}</span>
              <span style={{ fontSize: mobile ? '14px' : '15px', fontWeight: 500, color: PZ_INK }}>{f[1]}</span>
            </div>
          ))}
        </div>
        {!mobile && (
          <span aria-hidden="true" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', color: PZ_MUTE }}>
            <span style={{ fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Scroll</span>
            <svg className="pz-cue" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>
          </span>
        )}
      </div>
    </section>
  );
}

function PZWork({ projects, mobile, onSelect }) {
  const tints = ['#c9a9ef', '#9fd0ee', '#f2cf9d'];
  return (
    <PZSection mobile={mobile} fields>
      <div id="pz-work" style={{ display: 'flex', alignItems: mobile ? 'flex-start' : 'flex-end', justifyContent: 'space-between', gap: '24px', marginBottom: '38px', flexDirection: mobile ? 'column' : 'row' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
          <PZLabel>Selected work</PZLabel>
          <h2 className="pz-rise" style={{
            fontFamily: PZ_DISPLAY, fontWeight: 400, margin: 0, color: PZ_INK,
            fontSize: mobile ? 'clamp(32px, 8vw, 40px)' : 'clamp(40px, 4.4vw, 56px)',
            lineHeight: 1.0, letterSpacing: '-0.022em',
          }}>Some of it was paid for.</h2>
        </div>
        {/* Counted, not written down: a sixth project cannot leave a stale number here. */}
        <span style={{ fontSize: '13px', color: PZ_MUTE, whiteSpace: 'nowrap', paddingBottom: mobile ? 0 : '8px' }}>
          {String(projects.length).padStart(2, '0')} projects
        </span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : 'repeat(2, minmax(0, 1fr))', gap: mobile ? '12px' : '18px' }}>
        {projects.map((p, i) => (
          <button
            key={p.id}
            className={'pz-card pz-rise' + (mobile ? '' : ' pz-float')}
            onClick={() => onSelect(p)}
            style={{
              animationDelay: mobile ? undefined : `${-i * 1.8}s`,
              textAlign: 'left', cursor: 'pointer', font: 'inherit', color: PZ_INK,
              borderRadius: mobile ? '17px' : '20px', padding: mobile ? '18px 20px' : '26px 28px',
              background: 'rgba(255,255,255,0.6)', border: '1px solid rgba(255,255,255,0.92)',
              backdropFilter: mobile ? undefined : 'blur(16px)',
              display: 'flex', flexDirection: 'column', gap: '14px', minHeight: '44px',
              gridColumn: (!mobile && i === 0) ? 'span 2' : undefined,
            }}>
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '16px' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <span style={{ width: '9px', height: '9px', borderRadius: '50%', flexShrink: 0, background: tints[i % tints.length] }} />
                  <span style={{ fontFamily: PZ_DISPLAY, fontSize: mobile ? '23px' : '30px', lineHeight: 1.05, letterSpacing: '-0.015em' }}>{p.title}</span>
                </div>
                <span style={{ fontFamily: PZ_SANS, fontSize: mobile ? '13px' : '14px', lineHeight: 1.55, color: PZ_BODY, textWrap: 'pretty' }}>{p.tagline || p.description}</span>
              </div>
              <span style={{ width: '34px', height: '34px', borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(27,26,34,0.06)', color: PZ_INK }}>
                <PZArrow />
              </span>
            </div>
            <div style={{ marginTop: 'auto', display: 'flex', alignItems: 'center', gap: '10px', fontFamily: PZ_SANS, fontSize: '11px', letterSpacing: '0.08em', textTransform: 'uppercase', color: PZ_MUTE }}>
              <span>{p.year || '2026'}</span>
              <span style={{ width: '3px', height: '3px', borderRadius: '50%', background: '#a9a6b8' }} />
              <span>{(p.tags && p.tags[0]) || 'Project'}</span>
            </div>
          </button>
        ))}
      </div>

<script type="text/plain" id="broadside-src">
// ── BROADSIDE MODE ─────────────────────────────────────────────
// A poster, not a page. One statement owns the first screen at a size no other
// edition goes near, and everything under it is a ruled listing.
//
// The scale is the whole idea, so it is arithmetic rather than taste. In DM Serif
// Display at -0.04em, "I build things." measures 5.476x its own font-size, so the line
// that fills a sheet is (available width / 5.476). At 16.3vw that lands at 95-99% of
// the measure from a 390px phone to a 1920px desktop — measured in a browser at each
// width, not estimated. Change those words and that ratio changes with them.
//
// This was first drawn on a 1120x1240 artboard, which is PORTRAIT, and it did not
// survive contact with a real 1440x900 viewport: at the size that filled the sheet the
// line reached only 67% across a screen, which is a large headline rather than a
// poster. Landscape wanted the type BIGGER, not smaller.
//
// Motion is deliberately near-zero. This is a print idiom and print does not float:
// rules draw themselves in from the left, content rises once, nothing loops.
const BS_PAPER = '#f2f0eb', BS_INK = '#0a0a0a', BS_BODY = '#3a3a3a', BS_MUTE = '#6b6b6b';
const BS_SURFACE = '#e2e0db', BS_LINE = '#dddbd6';
const BS_DISPLAY = "'DM Serif Display', Georgia, serif";
const BS_MONO = "'JetBrains Mono', 'Fira Code', monospace";
const BS_EDGE = 'clamp(20px, 4vw, 56px)';
const BS_CHROME = '64px';

const bsReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function bsStyles() {
  if (document.getElementById('broadside-style')) return;
  const st = document.createElement('style');
  st.id = 'broadside-style';
  st.textContent = [
    '.broadside-root ::selection { background: #0a0a0a; color: #f2f0eb; }',
    '.broadside-root a, .broadside-root button { -webkit-tap-highlight-color: transparent; }',
    '.broadside-root a:focus-visible, .broadside-root button:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 3px; }',

    // RULE. A rule that draws itself is the only flourish here, and it is the one
    // motion that belongs to a printing idiom rather than a screen one. Default state
    // is DRAWN — without scroll-driven timelines the page is simply already set.
    '@keyframes bs-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }',
    '.bs-rule { transform-origin: 0 50%; }',

    // RISE. One move, 12px, no loop.
    '@keyframes bs-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }',
    '.bs-in { animation: bs-rise 620ms cubic-bezier(0.22,0.61,0.36,1) both; }',
    '.bs-d1 { animation-delay: 90ms; } .bs-d2 { animation-delay: 180ms; }',
    '@supports (animation-timeline: view()) { @media (prefers-reduced-motion: no-preference) {',
    '  .bs-rule { animation: bs-draw linear both; animation-timeline: view(); animation-range: entry 10% cover 22%; }',
    '  .bs-riser { animation: bs-rise linear both; animation-timeline: view(); animation-range: entry 5% cover 26%; }',
    '} }',
    '@media (prefers-reduced-motion: reduce) { .broadside-root *, .broadside-root *::before { animation: none !important; transition: none !important; } }',

    // Listing rows fade on hover rather than filling: a filled row would be a card,
    // and this edition does not have one anywhere.
    '.bs-row { transition: opacity 140ms ease; }',
    '.bs-row:hover { opacity: 0.55; }',

    // NUDGE — the one looping animation here, and it earns the exception. The first
    // sheet is exactly one viewport ending in a hard rule, so nothing bleeds past the
    // fold and the composition reads as finished: the next section starts 90px BELOW
    // the fold, which is to say invisibly. A closed poster needs to say it continues.
    '@keyframes bs-nudge { 0%,100% { transform: translateY(0); opacity: 0.75; } 50% { transform: translateY(3px); opacity: 1; } }',
    '.bs-nudge { animation: bs-nudge 2.4s ease-in-out infinite; }',
  ].join('\n');
  document.head.appendChild(st);
}

function BSLabel({ children, style }) {
  return (
    <span style={{
      fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em',
      color: BS_MUTE, textTransform: 'lowercase', ...(style || {}),
    }}>{children}</span>
  );
}

// The heavy rule under every section head.
//
// `draw` is opt-in, and deliberately so. view() measures an element against its own
// trip through the viewport, so a rule that is ALREADY on screen at load sits partway
// through its own entry range forever — the listings rule at the foot of the first
// sheet drew to about 45% and stopped there. Anything above the fold is therefore
// simply set, and only rules the reader actually scrolls to draw themselves in.
function BSRule({ weight, draw }) {
  return <div className={draw ? 'bs-rule' : undefined} style={{ height: weight || '3px', background: BS_INK, width: '100%' }} />;
}

function BSButton({ children, onClick, href, newTab, primary }) {
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
    minHeight: '44px', padding: '0 26px', borderRadius: '2px', boxSizing: 'border-box',
    fontFamily: BS_MONO, fontSize: '12px', letterSpacing: '0.08em', cursor: 'pointer',
    textDecoration: 'none', border: '1px solid ' + BS_INK,
    background: primary ? BS_INK : 'transparent',
    color: primary ? BS_PAPER : BS_INK,
  };
  if (href) return <a href={href} target={newTab ? '_blank' : undefined} rel={newTab ? 'noopener noreferrer' : undefined} style={base}>{children}</a>;
  return <button onClick={onClick} style={base}>{children}</button>;
}

// The nav navigates. Broadside used to be one long scroll with these as jump targets,
// which meant the poster sheet had five sections stacked under it and had to apologise
// for them with a "continued" mark. Each is its own sheet now, so the first screen is
// the whole of the home page and nothing is hidden below a fold that gave no sign of
// having anything below it.
function BSChrome({ mobile, onTop, openEditions, onNavigate, activePage, left, right }) {
  const nav = [['work', 'work'], ['background', 'about'], ['kit', 'tools'], ['contact', 'contact']];
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      gap: '16px', height: BS_CHROME, flexShrink: 0,
      borderBottom: '1px solid ' + BS_INK,
    }}>
      {left || (
        <button onClick={onTop} style={{
          background: 'none', border: 'none', cursor: 'pointer', padding: '0 10px 0 0', minHeight: '44px',
          fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_MUTE, textAlign: 'left',
        }}>peter &amp; co. · rotterdam, nl</button>
      )}
      {right || (
        <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? '2px' : '4px' }}>
          {mobile && nav.filter(n => n[1] !== 'work').map(n => (
            <button key={n[0]} onClick={() => onNavigate(n[1])} style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 6px',
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.06em',
              color: activePage === n[1] ? BS_INK : BS_MUTE,
            }}>{n[0] === 'background' ? 'bg' : n[0]}</button>
          ))}
          {!mobile && nav.map(n => (
            <button key={n[0]} onClick={() => onNavigate(n[1])} style={{
              background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 9px',
              fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em',
              color: activePage === n[1] ? BS_INK : BS_MUTE,
              textDecoration: activePage === n[1] ? 'underline' : 'none', textUnderlineOffset: '5px',
            }}>{n[0]}</button>
          ))}
          <button onClick={openEditions} style={{
            background: 'none', border: 'none', cursor: 'pointer', minHeight: '44px', padding: '0 0 0 9px',
            fontFamily: BS_MONO, fontSize: '10px', letterSpacing: '0.14em', color: BS_INK,
          }}>editions</button>
        </div>
      )}
    </div>
  );
}

// The sheet: the inset column every screen of this edition sits in.
function BSSheet({ children, full, style }) {
  return (
    <div style={{
      boxSizing: 'border-box', width: '100%', maxWidth: '1560px', margin: '0 auto',
      padding: '0 ' + BS_EDGE, minHeight: full ? '100svh' : undefined,
      display: 'flex', flexDirection: 'column', ...(style || {}),
    }}>{children}</div>
  );
}

// The statement. The two numbers below are measured, not chosen — see the note at the
// top of this blob for where 5.476 comes from.
//
// 16.1vw fills 96-99% of the measure while the sheet is still narrower than its cap.
// 264px is where that has to stop: the sheet maxes out at 1560px wide, so above a
// 1560px viewport the measure is a constant 1448px however wide the window gets, and
// 1448 / 5.476 = 264. Without that ceiling a 1920px window computed 313px and pushed
// the line 266px past the sheet.
//
// whiteSpace and textWrap are applied conditionally rather than as two keys with one
// set to undefined, and that is not tidiness. React writes an undefined style value as
// style.textWrap = '', which removes the text-wrap SHORTHAND — including
// text-wrap-mode, the half of `white-space: nowrap` that does the not-wrapping. The
// element kept white-space-collapse and silently wrapped anyway. It only showed up at
// 1920px, because below that the line happened to fit on its own.
function BSStatement({ children, size, maxWidth, nowrap, className }) {
  const st = {
    fontFamily: BS_DISPLAY, fontWeight: 400, margin: 0,
    fontSize: size || 'clamp(52px, 16.1vw, 264px)',
    lineHeight: nowrap ? 0.86 : 0.96, letterSpacing: '-0.04em',
    color: BS_INK, maxWidth: maxWidth,
  };
  if (nowrap) st.whiteSpace = 'nowrap';
  else st.textWrap = 'balance';
  return <h1 className={className} style={st}>{children}</h1>;
}

function BSListings({ projects, mobile, onSelect }) {
  const { theme } = useTheme();
  const list = projects.slice(0, 5);
  return (
    <div style={{ flexShrink: 0, paddingBottom: 'clamp(22px, 3vh, 34px)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: '12px', paddingBottom: '10px' }}>
        <BSLabel>the listings</BSLabel>
        <BSLabel>{String(list.length).padStart(2, '0')} entries · 2025&ndash;2026</BSLabel>
      </div>
      <BSRule />
      <div style={{
        display: 'grid', gap: mobile ? '0' : '20px', paddingTop: mobile ? '2px' : '14px',
        gridTemplateColumns: mobile ? '1fr' : 'repeat(' + list.length + ', minmax(0, 1fr))',
      }}>
        {list.map((p, i) => {
          const accent = fitAccent(resolveAccent(p, theme.id), BS_PAPER) || BS_INK;
          // Sanity's isPublic arrives as public:false. Every other edition honours it —
          // Volt prints "(soon)", Mondriaan fades the row, Prism and Grain withhold the
          // link — and Broadside was the one that did not, so it printed a live-looking
          // domain and a "visit the site" button for a site that is not up yet.
          const shipped = p.public !== false;
          return (
