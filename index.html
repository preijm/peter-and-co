<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(6px); opacity: 0.9; }
  }
  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  input::placeholder, textarea::placeholder { color: #3a3a3a; }
  button:focus-visible, a:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const PCo = {
  fonts: {
    serif: "'DM Serif Display', Georgia, serif",
    mono:  "'JetBrains Mono', 'Fira Code', monospace",
  },
};

function useMobile(breakpoint = 600) {
  const [mobile, setMobile] = React.useState(() => window.innerWidth < breakpoint);
  React.useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpoint}px)`);
    const handler = e => setMobile(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [breakpoint]);
  return mobile;
}

// ── Tag ────────────────────────────────────────────────────
function Tag({ children, filled, muted }) {
  const bg     = filled ? '#ffffff' : muted ? '#1e1e1e' : 'transparent';
  const color  = filled ? '#0a0a0a' : muted ? '#6b6b6b' : '#a8a8a8';
  const border = filled ? '1px solid #ffffff' : '1px solid #2a2a2a';
  return (
    <span style={{
      fontFamily: PCo.fonts.mono, fontSize: '10px', letterSpacing: '0.08em',
      padding: '3px 8px', background: bg, color, border,
      borderRadius: '2px', display: 'inline-block',
    }}>{children}</span>
  );
}

// ── SiteHeader ─────────────────────────────────────────────
function SiteHeader({ activePage, onNavigate }) {
  const mobile = useMobile();
  const links = ['work', 'about', 'tools', 'contact'];
  return (
    <div style={{ maxWidth: '1080px', margin: '0 auto', padding: '48px 32px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: mobile ? 'wrap' : 'nowrap', gap: mobile ? '12px' : '0' }}>
      <button onClick={() => onNavigate('work')} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, display: 'flex', alignItems: 'baseline', gap: '5px' }}>
        <span style={{ fontFamily: PCo.fonts.serif, fontSize: mobile ? '26px' : '36px', color: '#ffffff', letterSpacing: '-0.03em', lineHeight: 1.0 }}>Peter</span>
        <span style={{ fontFamily: PCo.fonts.serif, fontSize: mobile ? '16px' : '22px', color: '#6b6b6b', letterSpacing: '-0.02em', lineHeight: 1.0 }}>&amp; Co.</span>
      </button>
      <nav style={{ display: 'flex', gap: mobile ? '16px' : '28px', paddingTop: '8px', flexShrink: 0 }}>
        {links.map(l => (
          <button key={l} onClick={() => onNavigate(l)} style={{
            fontFamily: PCo.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
            color: activePage === l ? '#ffffff' : '#6b6b6b',
            background: 'none', border: 'none', cursor: 'pointer',
            borderBottom: activePage === l ? '1px solid #ffffff' : '1px solid transparent',
            paddingBottom: '2px', transition: 'color 150ms ease',
          }}
          onMouseEnter={e => e.currentTarget.style.color = '#ffffff'}
          onMouseLeave={e => e.currentTarget.style.color = activePage === l ? '#ffffff' : '#6b6b6b'}
          >{l}</button>
        ))}
      </nav>
    </div>
  );
}

// ── Hero ───────────────────────────────────────────────────
function Hero({ onCTA, activePage, onNavigate }) {
  const mobile = useMobile();
  return (
    <section style={{ borderBottom: '1px solid #2a2a2a' }}>
      {/* Logo + nav row */}
      <SiteHeader activePage={activePage} onNavigate={onNavigate} />
      {/* Headline block */}
      <div style={{ maxWidth: '1080px', margin: '0 auto', width: '100%', padding: '64px 32px 80px' }}>
        <div style={{ fontFamily: PCo.fonts.mono, fontSize: '11px', letterSpacing: '0.12em', color: '#4a4a4a', marginBottom: '24px' }}>
          rotterdam, nl · digital studio
        </div>
        <h1 style={{
          fontFamily: PCo.fonts.serif, fontSize: 'clamp(52px, 8vw, 92px)',
          fontWeight: 400, color: '#ffffff', lineHeight: 1.0,
          letterSpacing: '-0.025em', margin: 0, marginBottom: '40px', maxWidth: '14ch',
        }}>I build things.<br />Sometimes<br />they're useful.</h1>
        <div style={{ display: 'flex', flexDirection: mobile ? 'column' : 'row', alignItems: mobile ? 'flex-start' : 'center', gap: mobile ? '12px' : '32px' }}>
          <button onClick={() => onNavigate('contact')} style={{
            fontFamily: PCo.fonts.mono, fontSize: '12px', letterSpacing: '0.08em',
            color: '#0a0a0a', background: '#ffffff', border: '1px solid #ffffff',
            padding: '11px 28px', borderRadius: '2px', cursor: 'pointer', transition: 'opacity 150ms ease',
            whiteSpace: 'nowrap',
          }}
          onMouseEnter={e => e.currentTarget.style.opacity = '0.7'}
          onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >get in touch →</button>
          <span style={{ fontFamily: PCo.fonts.mono, fontSize: '11px', color: '#4a4a4a', letterSpacing: '0.06em' }}>
            product owner by day, builder by night.
          </span>
        </div>
      </div>
    </section>
  );
}

// ── ProjectCard ────────────────────────────────────────────
function ProjectCard({ project, index, onClick }) {
  const [hovered, setHovered] = React.useState(false);
  const accent = project.accent || '#ffffff';
  return (
    <div
      onClick={() => onClick(project)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        background: '#111111', cursor: 'pointer', padding: '28px 28px 0',
        display: 'flex', flexDirection: 'column',
        border: '1px solid #1e1e1e',
        transition: 'border-color 150ms ease',
        borderColor: hovered ? '#2a2a2a' : '#1e1e1e',
        position: 'relative',
      }}
    >
      {/* Top row: number + tag */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '32px' }}>
        <span style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.1em' }}>
          {String(index + 1).padStart(2, '0')}
        </span>
        <span style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.12em' }}>
          {project.tags[0].toUpperCase()}
        </span>
      </div>

      {/* Title — font size adapts to title length */}
      <h3 style={{
        fontFamily: PCo.fonts.serif, fontWeight: 400,
        fontSize: '36px',
        lineHeight: 0.95, color: '#ffffff', letterSpacing: '-0.02em',
        marginBottom: '24px', flex: 1,
      }}>{project.title}</h3>

      {/* Description */}
      <p style={{
        fontFamily: PCo.fonts.mono, fontSize: '12px', color: '#6b6b6b',
        lineHeight: 1.7, marginBottom: '32px', maxWidth: '36ch',
      }}>{project.description}</p>

      {/* Bottom row: dot + url + arrow */}
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        paddingBottom: '28px',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: accent, display: 'inline-block', flexShrink: 0 }} />
          <span style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: accent, letterSpacing: '0.04em' }}>
            {project.url}
          </span>
        </div>
        <span style={{ fontFamily: PCo.fonts.mono, fontSize: '13px', color: hovered ? '#ffffff' : '#3a3a3a', transition: 'color 150ms ease' }}>→</span>
      </div>

      {/* Accent bottom border */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: '2px',
        background: hovered ? accent : 'transparent',
        transition: 'background 150ms ease',
      }} />
    </div>
  );
}

function ProjectGrid({ onSelect }) {
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: '80px 32px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '24px' }}>
        <span style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.15em' }}>SELECTED PROJECTS</span>
        <span style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.1em' }}>
          {String(PROJECTS.length).padStart(2, '0')} projects
        </span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '1px', background: '#1e1e1e' }}>
        {PROJECTS.map((p, i) => <ProjectCard key={p.id} project={p} index={i} onClick={onSelect} />)}
      </div>
    </section>
  );
}

            { label: 'linkedin', href: 'https://www.linkedin.com/in/peter-reijm-47165b5b/' },
            { label: 'email',    href: 'mailto:peterreijm@live.nl' },

            <a key={label} href={href} target={href.startsWith('http') ? '_blank' : undefined} rel="noopener noreferrer" style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', letterSpacing: '0.08em', color: '#3a3a3a', textDecoration: 'none', transition: 'color 150ms ease' }}

function Tools() {
  const categories = [
    {
      label: 'build',
      tools: [
        { name: 'Lovable',       desc: 'Prototype to product, fast.' },
        { name: 'Claude',        desc: "The whole suite. Design, code, research. It's become the default." },
        { name: 'Stitch',        desc: 'Connecting data without the plumbing.' },

    },

      label: 'infrastructure',
      tools: [

  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: '80px 32px' }}>

        {categories.map(cat => (

              {cat.tools.map(t => (
                <div key={t.name}>
                  <div style={{ fontFamily: PCo.fonts.serif, fontSize: '20px', color: '#ffffff', letterSpacing: '-0.01em', marginBottom: '4px' }}>{t.name}</div>
                  <div style={{ fontFamily: PCo.fonts.mono, fontSize: '11px', color: '#4a4a4a', lineHeight: 1.6 }}>{t.desc}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

// ── Contact ────────────────────────────────────────────────
function Contact() {
  const [sent, setSent] = React.useState(false);
  const inputStyle = {
    width: '100%', padding: '10px 12px', fontFamily: PCo.fonts.mono,
    fontSize: '13px', color: '#ffffff', background: '#141414',
    border: '1px solid #2a2a2a', borderRadius: '2px', outline: 'none',
  };
  return (
    <section style={{ maxWidth: '640px', margin: '0 auto', padding: '80px 32px' }}>
      <div style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', letterSpacing: '0.12em', color: '#4a4a4a', marginBottom: '20px' }}>contact</div>
      <h1 style={{ fontFamily: PCo.fonts.serif, fontSize: '44px', fontWeight: 400, color: '#ffffff', lineHeight: 1.05, letterSpacing: '-0.02em', marginBottom: '48px' }}>Say hello.</h1>
      {!sent ? (
        <form onSubmit={e => {
          e.preventDefault();
          const data = new FormData(e.target);
          const name = data.get('name') || '';
          const msg = data.get('message') || '';
          window.location.href = `mailto:peterreijm@live.nl?subject=Hello from ${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}`;
          setSent(true);
        }} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
          {[
            { id: 'name',  label: 'name',  type: 'text',  placeholder: 'your name' },
            { id: 'email', label: 'email', type: 'email', placeholder: 'your@email.com' },
          ].map(f => (
            <div key={f.id}>
              <label htmlFor={f.id} style={{ display: 'block', fontFamily: PCo.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: '#4a4a4a', marginBottom: '6px' }}>{f.label}</label>
              <input id={f.id} name={f.id} type={f.type} placeholder={f.placeholder} style={inputStyle}
                onFocus={e => e.target.style.borderColor = '#6b6b6b'}
                onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
            </div>
          ))}
          <div>
            <label htmlFor="message" style={{ display: 'block', fontFamily: PCo.fonts.mono, fontSize: '10px', letterSpacing: '0.1em', color: '#4a4a4a', marginBottom: '6px' }}>message</label>
            <textarea id="message" name="message" rows={5} placeholder="what's on your mind?" style={{ ...inputStyle, resize: 'vertical' }}
              onFocus={e => e.target.style.borderColor = '#6b6b6b'}
              onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
          </div>
          <button type="submit" style={{
            alignSelf: 'flex-start', fontFamily: PCo.fonts.mono, fontSize: '12px',
            letterSpacing: '0.08em', color: '#0a0a0a', background: '#ffffff',
            border: '1px solid #ffffff', padding: '10px 28px', borderRadius: '2px', cursor: 'pointer',
          }}
          onMouseEnter={e => e.currentTarget.style.opacity = '0.7'}
          onMouseLeave={e => e.currentTarget.style.opacity = '1'}
          >send →</button>
        </form>
      ) : (
        <div style={{ borderTop: '1px solid #2a2a2a', paddingTop: '32px' }}>
          <p style={{ fontFamily: PCo.fonts.serif, fontSize: '28px', color: '#ffffff', marginBottom: '12px' }}>Got it.</p>
          <p style={{ fontFamily: PCo.fonts.mono, fontSize: '13px', color: '#6b6b6b', lineHeight: 1.7 }}>I'll be in touch. Usually within a day or two.</p>
        </div>
      )}
    </section>
  );
}

// ── Project Detail ─────────────────────────────────────────
function ProjectDetail({ project, onBack }) {
  const accent = project.accent || '#ffffff';
  return (
    <section style={{ maxWidth: '1080px', margin: '0 auto', padding: '80px 32px' }}>
      <button onClick={onBack} style={{
        fontFamily: PCo.fonts.mono, fontSize: '11px', letterSpacing: '0.08em',
        color: '#4a4a4a', background: 'none', border: 'none', cursor: 'pointer',
        padding: 0, marginBottom: '48px', display: 'block', transition: 'color 150ms ease',
      }}
      onMouseEnter={e => e.currentTarget.style.color = '#ffffff'}
      onMouseLeave={e => e.currentTarget.style.color = '#4a4a4a'}
      >← back to work</button>

      {/* Tags + year */}
      <div style={{ display: 'flex', gap: '6px', marginBottom: '20px', flexWrap: 'wrap' }}>
        {project.tags.map(t => <Tag key={t} muted>{t}</Tag>)}
        <Tag filled>{project.year}</Tag>
      </div>

      {/* Title + tagline */}
      <h1 style={{ fontFamily: PCo.fonts.serif, fontSize: '52px', fontWeight: 400, color: '#ffffff', lineHeight: 1.0, letterSpacing: '-0.02em', marginBottom: '12px' }}>
        {project.title}
      </h1>
      {project.tagline && (
        <p style={{ fontFamily: PCo.fonts.mono, fontSize: '13px', color: accent, letterSpacing: '0.04em', marginBottom: '32px' }}>
          {project.tagline}
        </p>
      )}

      {/* Two-col layout: description + meta */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 260px', gap: '64px', marginBottom: '48px', alignItems: 'start' }}>
        <p style={{ fontFamily: PCo.fonts.mono, fontSize: '14px', color: '#a8a8a8', lineHeight: 1.8, margin: 0 }}>
          {project.detail || project.description}
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
          {project.role && (
            <div>
              <div style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.12em', marginBottom: '6px' }}>ROLE</div>
              <div style={{ fontFamily: PCo.fonts.mono, fontSize: '12px', color: '#6b6b6b' }}>{project.role}</div>
            </div>
          )}
          {project.stack && (
            <div>
              <div style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.12em', marginBottom: '8px' }}>STACK</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                {project.stack.map(s => <Tag key={s} muted>{s}</Tag>)}
              </div>
            </div>
          )}
          {project.href && (
            <div>
              <div style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.12em', marginBottom: '6px' }}>LIVE AT</div>
              <a href={project.href} target="_blank" rel="noopener noreferrer" style={{
                fontFamily: PCo.fonts.mono, fontSize: '12px', color: accent,
                textDecoration: 'none', letterSpacing: '0.04em',
              }}
              onMouseEnter={e => e.target.style.opacity = '0.7'}
              onMouseLeave={e => e.target.style.opacity = '1'}
              >{project.url} ↗</a>
            </div>
          )}
        </div>
      </div>

      {/* Screenshot */}
      <div style={{
        width: '100%', aspectRatio: '16/9', background: '#111', border: `1px solid ${accent}22`,
        borderRadius: '2px', display: 'flex', alignItems: 'center', justifyContent: 'center',
        position: 'relative', overflow: 'hidden',
      }}>
        {project.screenshot
          ? <img src={project.screenshot} alt={project.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          : <>
              <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at 30% 50%, ${accent}11 0%, transparent 70%)` }} />
              <div style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: PCo.fonts.serif, fontSize: '32px', color: accent, opacity: 0.2, marginBottom: '8px' }}>{project.title}</div>
                <div style={{ fontFamily: PCo.fonts.mono, fontSize: '10px', color: '#3a3a3a', letterSpacing: '0.1em' }}>screenshot coming soon</div>
              </div>
            </>
        }
      </div>
    </section>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  const [page, setPage] = React.useState('work');
  const [selectedProject, setSelectedProject] = React.useState(null);

  const navigate = (p) => {
    setPage(p);
    setSelectedProject(null);
    window.scrollTo({ top: 0 });
  };

  const selectProject = (project) => {
    setSelectedProject(project);
    setPage('project');
    window.scrollTo({ top: 0 });
  };

  const activePage = selectedProject ? 'work' : page;

  return (
    <div>
      <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
        <main style={{ flex: 1 }}>
        {page === 'work' && !selectedProject && (
          <>
            <Hero
              activePage={activePage}
              onNavigate={navigate}
              onCTA={() => {
                const el = document.getElementById('projects');
                if (el) window.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
              }}
            />
            <div id="projects"><ProjectGrid onSelect={selectProject} /></div>
          </>
        )}
        {(page === 'about' || page === 'tools' || page === 'contact' || page === 'project') && (
          <SiteHeader activePage={activePage} onNavigate={navigate} />
        )}
        {page === 'about' && <About />}
        {page === 'tools' && <Tools />}
        {page === 'contact' && <Contact />}
        {page === 'project' && selectedProject && <ProjectDetail project={selectedProject} onBack={() => navigate('work')} />}
        </main>
        <Footer />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
